services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    # -------- Both of the following commands should be commented to run with nginx --------

    # -------- replace with comment to run with gunicorn --------
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./src/.env
    environment:
      ENVIRONMENT: local
      AUTH_MODE: local_dev
      ENABLE_DEV_ROLE_SELECTOR: "true"
      OIDC_ENABLED: "false"
      DEV_SESSION_ALLOWED_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
    # -------- replace with expose if you are using nginx --------
    ports:
       - "127.0.0.1:8000:8000"
    # expose:
    #    - "8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env

  db:
    image: postgres:13
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    expose:
      - "6379"

  #-------- uncomment to run with nginx --------
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "127.0.0.1:80:80"
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - web

  #-------- create the initial CL Admin assignment --------
  create_initial_cl_admin:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_initial_cl_admin
    volumes:
      - ./src:/code/src

  #-------- uncomment to run tests --------
  pytest:
    build: 
      context: .
      dockerfile: Dockerfile 
    env_file:
      - ./src/.env
    depends_on:
      - db
      - create_initial_cl_admin
      - redis
    command: python -m pytest ./tests
    volumes:
      - .:/code

volumes:
  postgres-data:
  redis-data:
 
