<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">CanadaLogin AWS traffic flow topology actor treatment v2</title>
  <desc id="desc">Illustrative AWS traffic flow topology regenerated after the actor handling skill update. External users are shown as a human actor node outside AWS, with web browser context in the actor label. Application and static website flows remain similar to the first version.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .aws-boundary { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
      .boundary { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .boundary-soft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .region { fill: #faffff; stroke: #0891b2; stroke-width: 2.2; }
      .vpc { fill: #fbf7ff; stroke: #8b5cf6; stroke-width: 2.2; }
      .subnet-public { fill: #f8fbef; stroke: #78a22f; stroke-width: 2; }
      .subnet-private { fill: #eefbfc; stroke: #0ea5a8; stroke-width: 2; }
      .subnet-data { fill: #f8f7ff; stroke: #7c3aed; stroke-width: 2; }
      .edge { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .optional { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 7; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .card-soft { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .actor-line { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .actor-label { font: 700 15px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .actor-context { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 2.8; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrowSoft); }
      .flow-dashed { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowSoft); }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label-sm { font: 700 14px Arial, sans-serif; fill: #111827; }
      .label-xs { font: 700 12px Arial, sans-serif; fill: #111827; }
      .text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .text-sm { font: 12px Arial, sans-serif; fill: #334155; }
      .hint { font: 12px Arial, sans-serif; fill: #64748b; }
      .flow-label { font: 700 12px Arial, sans-serif; fill: #111827; }
      .tileTextSm { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="900" y="38">CanadaLogin AWS Traffic Flow Topology - Actor Treatment v2</text>
  <text class="subtitle" x="900" y="64">Regenerated with updated skill guidance: human users are actor/person nodes; systems remain boxes</text>

  <!-- Human actor outside AWS: no enclosing system box. -->
  <g transform="translate(900,104)">
    <circle class="actor-line" cx="0" cy="-26" r="15"/>
    <path class="actor-line" d="M0 -11 L0 30"/>
    <path class="actor-line" d="M-34 4 L34 4"/>
    <path class="actor-line" d="M0 30 L-28 64"/>
    <path class="actor-line" d="M0 30 L28 64"/>
    <text class="actor-label" x="0" y="92">External users</text>
    <text class="actor-context" x="0" y="110">Web browsers</text>
  </g>

  <!-- AWS account boundary -->
  <rect class="aws-boundary" x="46" y="184" width="1708" height="934"/>
  <rect x="70" y="208" width="36" height="36" fill="#111827"/>
  <text class="tileTextSm" x="88" y="226">aws</text>
  <text class="label" x="120" y="232">AWS account / ca-central-1 workload boundary</text>

  <!-- Route 53 -->
  <g transform="translate(834,238)">
    <rect class="card" width="132" height="86" rx="4"/>
    <rect x="46" y="18" width="40" height="40" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="38">R53</text>
    <text class="label-sm" x="66" y="72" text-anchor="middle">Route 53</text>
  </g>
  <path class="flow" d="M900 170 L900 238"/>
  <text class="flow-label" x="916" y="207">HTTPS</text>

  <!-- Application flow panel -->
  <rect class="boundary" x="82" y="352" width="1142" height="558"/>
  <text class="label" x="653" y="382" text-anchor="middle">Application traffic flow</text>
  <text class="hint" x="653" y="404" text-anchor="middle">Users -> Route 53 -> ALB -> WAF -> ECS services</text>

  <rect class="region" x="116" y="430" width="1074" height="430"/>
  <rect x="136" y="452" width="30" height="30" fill="#0891b2"/>
  <text class="tileTextSm" x="151" y="467">R</text>
  <text class="label-sm" x="178" y="471">Canada Central Region</text>
  <text class="hint" x="926" y="471">Resources shown once; deployment spans 3 AZs</text>

  <rect class="vpc" x="142" y="502" width="928" height="306"/>
  <rect x="164" y="524" width="30" height="30" fill="#8b5cf6"/>
  <text class="tileTextSm" x="179" y="539">V</text>
  <text class="label-sm" x="206" y="543">Application VPC</text>
  <text class="hint" x="206" y="565">Spans ca-central-1a, ca-central-1b, and ca-central-1d; boxes are not duplicated per AZ</text>

  <rect class="subnet-public" x="178" y="596" width="248" height="162"/>
  <text class="label-sm" x="302" y="623" text-anchor="middle">Public subnets</text>
  <text class="hint" x="302" y="643" text-anchor="middle">ALBs across 3 AZs</text>

  <rect class="subnet-private" x="462" y="596" width="368" height="162"/>
  <text class="label-sm" x="646" y="623" text-anchor="middle">Private app subnets</text>
  <text class="hint" x="646" y="643" text-anchor="middle">ECS Fargate services across 3 AZs</text>

  <rect class="subnet-data" x="866" y="596" width="168" height="162"/>
  <text class="label-sm" x="950" y="623" text-anchor="middle">Private data</text>
  <text class="hint" x="950" y="643" text-anchor="middle">Redis / Valkey</text>

  <g transform="translate(218,666)">
    <rect class="card" width="168" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#8b5cf6"/>
    <text class="tileTextSm" x="27" y="27">ALB</text>
    <text class="label-xs" x="54" y="23">ALB Selfservice</text>
    <text class="text-sm" x="54" y="41">api / selfservice</text>
  </g>
  <g transform="translate(218,732)">
    <rect class="card" width="168" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#8b5cf6"/>
    <text class="tileTextSm" x="27" y="27">ALB</text>
    <text class="label-xs" x="54" y="23">ALB Migration</text>
    <text class="text-sm" x="54" y="41">api / migration</text>
  </g>

  <g transform="translate(468,474)">
    <rect class="card" width="188" height="84" rx="3"/>
    <rect x="18" y="22" width="40" height="40" fill="#e11d48"/>
    <text class="tileTextSm" x="38" y="42">WAF</text>
    <text class="label-sm" x="76" y="36">Regional WAF</text>
    <text class="text-sm" x="76" y="55">inspection on ALBs</text>
  </g>

  <g transform="translate(500,666)">
    <rect class="card" width="292" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#f97316"/>
    <text class="tileTextSm" x="27" y="27">ECS</text>
    <text class="label-xs" x="56" y="23">Selfservice service</text>
    <text class="text-sm" x="56" y="41">Fargate tasks</text>
  </g>
  <g transform="translate(500,732)">
    <rect class="card" width="292" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#f97316"/>
    <text class="tileTextSm" x="27" y="27">ECS</text>
    <text class="label-xs" x="56" y="23">Migration service</text>
    <text class="text-sm" x="56" y="41">Fargate tasks</text>
  </g>

  <g transform="translate(894,656)">
    <rect class="card-soft" width="112" height="50" rx="3"/>
    <rect x="12" y="10" width="30" height="30" fill="#c026d3"/>
    <text class="tileTextSm" x="27" y="25">R</text>
    <text class="label-xs" x="54" y="22">Selfservice</text>
    <text class="text-sm" x="54" y="40">Valkey 7.2</text>
  </g>
  <g transform="translate(894,730)">
    <rect class="card-soft" width="112" height="50" rx="3"/>
    <rect x="12" y="10" width="30" height="30" fill="#c026d3"/>
    <text class="tileTextSm" x="27" y="25">R</text>
    <text class="label-xs" x="54" y="22">Migration</text>
    <text class="text-sm" x="54" y="40">Valkey 7.2</text>
  </g>

  <path class="flow" d="M860 324 C820 372, 530 418, 332 666"/>
  <text class="flow-label" x="612" y="420">api.*</text>
  <path class="flow-soft" d="M386 693 C432 665, 478 600, 515 558"/>
  <path class="flow-soft" d="M386 759 C440 704, 492 606, 529 558"/>
  <path class="flow" d="M560 558 C588 604, 612 638, 628 666"/>
  <path class="flow" d="M578 558 C608 626, 632 694, 650 732"/>

  <rect class="boundary-soft" x="1092" y="502" width="74" height="306"/>
  <text class="label-xs" x="1129" y="528" text-anchor="middle">No extra</text>
  <text class="label-xs" x="1129" y="544" text-anchor="middle">flow arrows</text>
  <text class="label-xs" x="1129" y="604" text-anchor="middle">ECR</text>
  <text class="label-xs" x="1129" y="668" text-anchor="middle">DNS FW</text>
  <text class="label-xs" x="1129" y="732" text-anchor="middle">Secrets</text>

  <!-- Static website flow panel -->
  <rect class="edge" x="1262" y="352" width="438" height="470"/>
  <text class="label" x="1481" y="382" text-anchor="middle">Static website flow</text>
  <text class="hint" x="1481" y="404" text-anchor="middle">Users -> Route 53 -> WAF -> CloudFront -> S3</text>

  <g transform="translate(1415,460)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#e11d48"/>
    <text class="tileTextSm" x="66" y="34">WAF</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">Edge WAF</text>
  </g>
  <g transform="translate(1415,586)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="34">CF</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">CloudFront</text>
  </g>
  <g transform="translate(1415,712)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#679a08"/>
    <text class="tileTextSm" x="66" y="34">S3</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">S3 origins</text>
  </g>
  <path class="flow" d="M940 324 C1040 372, 1270 404, 1481 460"/>
  <text class="flow-label" x="1175" y="394">static.*</text>
  <path class="flow" d="M1481 536 L1481 586"/>
  <path class="flow" d="M1481 662 L1481 712"/>

  <!-- Notes and optional webhook -->
  <rect class="note" x="82" y="944" width="1142" height="124"/>
  <text class="label-sm" x="112" y="974">Actor-treatment notes</text>
  <text class="text" x="112" y="1001">- The user node changed from a boxed group to a human actor glyph outside AWS.</text>
  <text class="text" x="112" y="1027">- Browser context lives in the actor label because it does not change the topology in this view.</text>
  <text class="text" x="112" y="1053">- The AWS service layout, flows, 3-AZ note, and no-arrow ECS dependencies stay materially the same.</text>

  <rect class="optional" x="1262" y="858" width="438" height="210"/>
  <text class="label-sm" x="1481" y="888" text-anchor="middle">Optional Verify webhook path</text>
  <text class="hint" x="1481" y="909" text-anchor="middle">Lower-priority system flow; systems stay as boxes</text>
  <g transform="translate(1290,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <text class="label-xs" x="37" y="21" text-anchor="middle">IBM</text>
    <text class="text-sm" x="37" y="37" text-anchor="middle">Verify</text>
  </g>
  <g transform="translate(1380,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <text class="label-xs" x="37" y="21" text-anchor="middle">API</text>
    <text class="text-sm" x="37" y="37" text-anchor="middle">Gateway</text>
  </g>
  <g transform="translate(1470,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <text class="label-xs" x="37" y="21" text-anchor="middle">Ingest</text>
    <text class="text-sm" x="37" y="37" text-anchor="middle">Queue</text>
  </g>
  <g transform="translate(1560,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <text class="label-xs" x="37" y="21" text-anchor="middle">Lambda</text>
    <text class="text-sm" x="37" y="37" text-anchor="middle">Forwarder</text>
  </g>
  <path class="flow-dashed" d="M1364 970 L1380 970"/>
  <path class="flow-dashed" d="M1454 970 L1470 970"/>
  <path class="flow-dashed" d="M1544 970 L1560 970"/>
</svg>
