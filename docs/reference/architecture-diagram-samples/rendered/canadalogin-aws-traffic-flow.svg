<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">CanadaLogin AWS traffic flow topology</title>
  <desc id="desc">Illustrative AWS traffic flow topology showing users to Route 53, application traffic through ALB and AWS WAF to ECS services, static website traffic through WAF and CloudFront to S3, VPC resources across three availability zones, service dependencies, and an optional Verify webhook path.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .aws-boundary { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
      .boundary { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .boundary-soft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .region { fill: #faffff; stroke: #0891b2; stroke-width: 2.2; }
      .vpc { fill: #fbf7ff; stroke: #8b5cf6; stroke-width: 2.2; }
      .subnet-public { fill: #f8fbef; stroke: #78a22f; stroke-width: 2; }
      .subnet-private { fill: #eefbfc; stroke: #0ea5a8; stroke-width: 2; }
      .subnet-data { fill: #f8f7ff; stroke: #7c3aed; stroke-width: 2; }
      .edge { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .optional { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 7; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .card-soft { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .actor { fill: #fffdf7; stroke: #64748b; stroke-width: 2; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 2.8; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrowSoft); }
      .flow-dashed { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowSoft); }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label-sm { font: 700 14px Arial, sans-serif; fill: #111827; }
      .label-xs { font: 700 12px Arial, sans-serif; fill: #111827; }
      .text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .text-sm { font: 12px Arial, sans-serif; fill: #334155; }
      .hint { font: 12px Arial, sans-serif; fill: #64748b; }
      .flow-label { font: 700 12px Arial, sans-serif; fill: #111827; }
      .tileText { font: 700 16px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .tileTextSm { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="900" y="38">CanadaLogin AWS Traffic Flow Topology</text>
  <text class="subtitle" x="900" y="64">Illustrative local sample - rough traffic arrows, service boundaries, and 3-AZ deployment note; no live AWS inventory used</text>

  <!-- External users -->
  <g transform="translate(835,86)">
    <rect class="actor" width="130" height="82" rx="6"/>
    <circle cx="51" cy="27" r="12" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="78" cy="27" r="12" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M32 62 C37 43,65 43,70 62" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M59 62 C64 43,92 43,97 62" fill="none" stroke="#334155" stroke-width="2"/>
    <text class="label-sm" x="65" y="78" text-anchor="middle">Users</text>
  </g>

  <!-- AWS account boundary -->
  <rect class="aws-boundary" x="46" y="132" width="1708" height="986"/>
  <rect x="70" y="156" width="36" height="36" fill="#111827"/>
  <text class="tileTextSm" x="88" y="174">aws</text>
  <text class="label" x="120" y="180">AWS account / ca-central-1 workload boundary</text>

  <!-- Route 53 -->
  <g transform="translate(834,190)">
    <rect class="card" width="132" height="86" rx="4"/>
    <rect x="46" y="18" width="40" height="40" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="38">R53</text>
    <text class="label-sm" x="66" y="72" text-anchor="middle">Route 53</text>
  </g>
  <path class="flow" d="M900 168 L900 190"/>
  <text class="flow-label" x="915" y="181">HTTPS</text>

  <!-- Application flow panel -->
  <rect class="boundary" x="82" y="302" width="1142" height="608"/>
  <text class="label" x="653" y="332" text-anchor="middle">Application traffic flow</text>
  <text class="hint" x="653" y="354" text-anchor="middle">Prompt shorthand: Users -&gt; Route 53 -&gt; ALB -&gt; WAF -&gt; ECS services</text>

  <rect class="region" x="116" y="380" width="1074" height="486"/>
  <rect x="136" y="402" width="30" height="30" fill="#0891b2"/>
  <text class="tileTextSm" x="151" y="417">R</text>
  <text class="label-sm" x="178" y="421">Canada Central Region</text>
  <text class="hint" x="945" y="421">Resources shown once; deployment spans 3 AZs</text>

  <rect class="vpc" x="142" y="452" width="928" height="366"/>
  <rect x="164" y="474" width="30" height="30" fill="#8b5cf6"/>
  <text class="tileTextSm" x="179" y="489">V</text>
  <text class="label-sm" x="206" y="493">Application VPC</text>
  <text class="hint" x="206" y="515">Spans ca-central-1a, ca-central-1b, and ca-central-1d; boxes are not duplicated per AZ</text>

  <rect class="subnet-public" x="178" y="545" width="248" height="222"/>
  <text class="label-sm" x="302" y="572" text-anchor="middle">Public subnets</text>
  <text class="hint" x="302" y="592" text-anchor="middle">ALBs across 3 AZs</text>

  <rect class="subnet-private" x="462" y="545" width="368" height="222"/>
  <text class="label-sm" x="646" y="572" text-anchor="middle">Private app subnets</text>
  <text class="hint" x="646" y="592" text-anchor="middle">ECS Fargate services across 3 AZs</text>

  <rect class="subnet-data" x="866" y="545" width="168" height="222"/>
  <text class="label-sm" x="950" y="572" text-anchor="middle">Private data</text>
  <text class="hint" x="950" y="592" text-anchor="middle">Redis / Valkey</text>

  <!-- ALBs -->
  <g transform="translate(218,626)">
    <rect class="card" width="168" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#8b5cf6"/>
    <text class="tileTextSm" x="27" y="27">ALB</text>
    <text class="label-xs" x="54" y="23">ALB Selfservice</text>
    <text class="text-sm" x="54" y="41">api / selfservice</text>
  </g>
  <g transform="translate(218,696)">
    <rect class="card" width="168" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#8b5cf6"/>
    <text class="tileTextSm" x="27" y="27">ALB</text>
    <text class="label-xs" x="54" y="23">ALB Migration</text>
    <text class="text-sm" x="54" y="41">api / migration</text>
  </g>

  <!-- Regional WAF -->
  <g transform="translate(468,424)">
    <rect class="card" width="188" height="84" rx="3"/>
    <rect x="18" y="22" width="40" height="40" fill="#e11d48"/>
    <text class="tileTextSm" x="38" y="42">WAF</text>
    <text class="label-sm" x="76" y="36">Regional WAF</text>
    <text class="text-sm" x="76" y="55">inspection on ALBs</text>
  </g>

  <!-- ECS services -->
  <g transform="translate(500,626)">
    <rect class="card" width="292" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#f97316"/>
    <text class="tileTextSm" x="27" y="27">ECS</text>
    <text class="label-xs" x="56" y="23">Selfservice service</text>
    <text class="text-sm" x="56" y="41">Fargate tasks</text>
  </g>
  <g transform="translate(500,696)">
    <rect class="card" width="292" height="54" rx="3"/>
    <rect x="12" y="12" width="30" height="30" fill="#f97316"/>
    <text class="tileTextSm" x="27" y="27">ECS</text>
    <text class="label-xs" x="56" y="23">Migration service</text>
    <text class="text-sm" x="56" y="41">Fargate tasks</text>
  </g>

  <!-- Redis dependencies shown without flow arrows -->
  <g transform="translate(894,620)">
    <rect class="card-soft" width="112" height="58" rx="3"/>
    <rect x="12" y="13" width="30" height="30" fill="#c026d3"/>
    <text class="tileTextSm" x="27" y="28">R</text>
    <text class="label-xs" x="54" y="24">Selfservice</text>
    <text class="text-sm" x="54" y="42">Valkey 7.2</text>
  </g>
  <g transform="translate(894,694)">
    <rect class="card-soft" width="112" height="58" rx="3"/>
    <rect x="12" y="13" width="30" height="30" fill="#c026d3"/>
    <text class="tileTextSm" x="27" y="28">R</text>
    <text class="label-xs" x="54" y="24">Migration</text>
    <text class="text-sm" x="54" y="42">Valkey 7.2</text>
  </g>

  <!-- App flow arrows -->
  <path class="flow" d="M860 276 C820 325, 520 356, 332 626"/>
  <text class="flow-label" x="610" y="372">api.*</text>
  <path class="flow-soft" d="M386 653 C430 630, 478 552, 515 508"/>
  <path class="flow-soft" d="M386 723 C438 688, 484 560, 529 508"/>
  <path class="flow" d="M560 508 C582 552, 606 592, 628 626"/>
  <path class="flow" d="M578 508 C604 580, 625 648, 650 696"/>

  <!-- Platform dependencies -->
  <rect class="boundary-soft" x="1092" y="452" width="74" height="366"/>
  <text class="label-xs" x="1129" y="478" text-anchor="middle">No extra</text>
  <text class="label-xs" x="1129" y="494" text-anchor="middle">flow arrows</text>
  <g transform="translate(1110,530)">
    <rect class="card-soft" width="38" height="58" rx="3"/>
    <rect x="7" y="8" width="24" height="24" fill="#f97316"/>
    <text class="tileTextSm" x="19" y="20">E</text>
    <text class="label-xs" x="19" y="47" text-anchor="middle">ECR</text>
  </g>
  <g transform="translate(1110,620)">
    <rect class="card-soft" width="38" height="58" rx="3"/>
    <rect x="7" y="8" width="24" height="24" fill="#0891b2"/>
    <text class="tileTextSm" x="19" y="20">DNS</text>
    <text class="label-xs" x="19" y="47" text-anchor="middle">FW</text>
  </g>
  <g transform="translate(1110,710)">
    <rect class="card-soft" width="38" height="58" rx="3"/>
    <rect x="7" y="8" width="24" height="24" fill="#e11d48"/>
    <text class="tileTextSm" x="19" y="20">S</text>
    <text class="label-xs" x="19" y="47" text-anchor="middle">Secrets</text>
  </g>

  <!-- Static website flow panel -->
  <rect class="edge" x="1262" y="302" width="438" height="520"/>
  <text class="label" x="1481" y="332" text-anchor="middle">Static website flow</text>
  <text class="hint" x="1481" y="354" text-anchor="middle">Users -&gt; Route 53 -&gt; WAF -&gt; CloudFront -&gt; S3</text>

  <g transform="translate(1415,408)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#e11d48"/>
    <text class="tileTextSm" x="66" y="34">WAF</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">Edge WAF</text>
  </g>
  <g transform="translate(1415,540)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="34">CF</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">CloudFront</text>
  </g>
  <g transform="translate(1415,672)">
    <rect class="card" width="132" height="76" rx="3"/>
    <rect x="46" y="14" width="40" height="40" fill="#679a08"/>
    <text class="tileTextSm" x="66" y="34">S3</text>
    <text class="label-sm" x="66" y="68" text-anchor="middle">S3 origins</text>
  </g>

  <path class="flow" d="M940 276 C1040 324, 1270 352, 1481 408"/>
  <text class="flow-label" x="1175" y="342">static.*</text>
  <path class="flow" d="M1481 484 L1481 540"/>
  <path class="flow" d="M1481 616 L1481 672"/>

  <!-- Notes and optional webhook -->
  <rect class="note" x="82" y="944" width="1142" height="124"/>
  <text class="label-sm" x="112" y="974">Diagram notes</text>
  <text class="text" x="112" y="1001">- App and static website traffic are shown as separate flows so arrows stay readable.</text>
  <text class="text" x="112" y="1027">- AWS WAF is drawn as a traffic-inspection step for review shorthand; in AWS it is associated with ALB or CloudFront rather than a VPC-hosted proxy.</text>
  <text class="text" x="112" y="1053">- ECS dependencies such as ECR, DNS Firewall, Redis / Valkey, and Secrets Manager are visible but intentionally do not add more arrows.</text>

  <rect class="optional" x="1262" y="858" width="438" height="210"/>
  <text class="label-sm" x="1481" y="888" text-anchor="middle">Optional Verify webhook path</text>
  <text class="hint" x="1481" y="909" text-anchor="middle">Lower-priority overlay, kept separate from app/static traffic</text>

  <g transform="translate(1290,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <text class="label-xs" x="37" y="21" text-anchor="middle">IBM</text>
    <text class="text-sm" x="37" y="37" text-anchor="middle">Verify</text>
  </g>
  <g transform="translate(1380,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <rect x="22" y="8" width="30" height="22" fill="#7c3aed"/>
    <text class="tileTextSm" x="37" y="19">API</text>
    <text class="text-sm" x="37" y="39" text-anchor="middle">Gateway</text>
  </g>
  <g transform="translate(1470,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <rect x="22" y="8" width="30" height="22" fill="#db2777"/>
    <text class="tileTextSm" x="37" y="19">Q</text>
    <text class="text-sm" x="37" y="39" text-anchor="middle">Queue</text>
  </g>
  <g transform="translate(1560,946)">
    <rect class="card-soft" width="74" height="48" rx="3"/>
    <rect x="22" y="8" width="30" height="22" fill="#f97316"/>
    <text class="tileTextSm" x="37" y="19">L</text>
    <text class="text-sm" x="37" y="39" text-anchor="middle">Lambda</text>
  </g>
  <path class="flow-dashed" d="M1364 970 L1380 970"/>
  <path class="flow-dashed" d="M1454 970 L1470 970"/>
  <path class="flow-dashed" d="M1544 970 L1560 970"/>
  <path class="flow-dashed" d="M1634 970 C1660 970, 1670 1008, 1642 1028"/>
  <text class="text-sm" x="1536" y="1037" text-anchor="middle">Forward logs/events to SIEM when in scope</text>
</svg>
