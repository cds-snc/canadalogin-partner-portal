<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">CanadaLogin AWS traffic flow topology feedback v3</title>
  <desc id="desc">Illustrative AWS traffic flow topology revised from review feedback. Static website and webhook processing are inside Canada Central Region. Regional WAF is shown above the ALBs before ECS. Valkey is shown in private subnets with placement to confirm.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .aws-boundary { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
      .region { fill: #faffff; stroke: #0891b2; stroke-width: 2.2; }
      .vpc { fill: #fbf7ff; stroke: #8b5cf6; stroke-width: 2.2; }
      .panel { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .panel-soft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .subnet-public { fill: #f8fbef; stroke: #78a22f; stroke-width: 2; }
      .subnet-private { fill: #eefbfc; stroke: #0ea5a8; stroke-width: 2; }
      .static-panel { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .webhook-panel { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 7; }
      .external { fill: #fffdf7; stroke: #64748b; stroke-width: 1.8; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .card-soft { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .actor-line { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .actor-label { font: 700 15px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .actor-context { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 2.8; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrowSoft); }
      .flow-dashed { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowSoft); }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label-sm { font: 700 14px Arial, sans-serif; fill: #111827; }
      .label-xs { font: 700 12px Arial, sans-serif; fill: #111827; }
      .text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .text-sm { font: 12px Arial, sans-serif; fill: #334155; }
      .hint { font: 12px Arial, sans-serif; fill: #64748b; }
      .flow-label { font: 700 12px Arial, sans-serif; fill: #111827; }
      .tileTextSm { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="900" y="38">CanadaLogin AWS Traffic Flow Topology - Feedback v3</text>
  <text class="subtitle" x="900" y="64">Static and webhook processing inside ca-central-1; WAF moved to ingress; Valkey subnet placement no longer asserted</text>

  <!-- Human actor outside AWS. -->
  <g transform="translate(900,104)">
    <circle class="actor-line" cx="0" cy="-26" r="15"/>
    <path class="actor-line" d="M0 -11 L0 30"/>
    <path class="actor-line" d="M-34 4 L34 4"/>
    <path class="actor-line" d="M0 30 L-28 64"/>
    <path class="actor-line" d="M0 30 L28 64"/>
    <text class="actor-label" x="0" y="92">External users</text>
    <text class="actor-context" x="0" y="110">Web browsers</text>
  </g>

  <!-- External webhook source/sink. -->
  <g transform="translate(1654,492)">
    <rect class="external" width="112" height="66" rx="4"/>
    <text class="label-xs" x="56" y="24" text-anchor="middle">IBM Verify</text>
    <text class="text-sm" x="56" y="43" text-anchor="middle">External SaaS</text>
  </g>
  <g transform="translate(1654,724)">
    <rect class="external" width="112" height="66" rx="4"/>
    <text class="label-xs" x="56" y="24" text-anchor="middle">SIEM /</text>
    <text class="label-xs" x="56" y="40" text-anchor="middle">Sentinel</text>
  </g>

  <!-- AWS account boundary -->
  <rect class="aws-boundary" x="160" y="184" width="1480" height="800"/>
  <rect x="184" y="208" width="36" height="36" fill="#111827"/>
  <text class="tileTextSm" x="202" y="226">aws</text>
  <text class="label" x="234" y="232">AWS account / workload boundary</text>

  <!-- Route 53 -->
  <g transform="translate(834,238)">
    <rect class="card" width="132" height="82" rx="4"/>
    <rect x="46" y="16" width="40" height="40" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="36">R53</text>
    <text class="label-sm" x="66" y="70" text-anchor="middle">Route 53</text>
  </g>
  <path class="flow" d="M900 170 L900 238"/>
  <text class="flow-label" x="916" y="207">HTTPS</text>

  <!-- Canada Central Region -->
  <rect class="region" x="205" y="344" width="1390" height="590"/>
  <rect x="230" y="368" width="30" height="30" fill="#0891b2"/>
  <text class="tileTextSm" x="245" y="383">R</text>
  <text class="label" x="274" y="390">Canada Central Region</text>
  <text class="hint" x="1228" y="390">Static website and webhook processing are modeled inside this boundary</text>

  <!-- Application panel -->
  <rect class="panel" x="235" y="420" width="720" height="438"/>
  <text class="label-sm" x="595" y="448" text-anchor="middle">Application API flow</text>
  <text class="hint" x="595" y="468" text-anchor="middle">WAF sits with ingress before ALBs/ECS to avoid crossing runtime arrows</text>

  <g transform="translate(442,490)">
    <rect class="card" width="188" height="78" rx="3"/>
    <rect x="18" y="19" width="40" height="40" fill="#e11d48"/>
    <text class="tileTextSm" x="38" y="39">WAF</text>
    <text class="label-sm" x="76" y="33">Regional WAF</text>
    <text class="text-sm" x="76" y="52">attached to ALBs</text>
  </g>

  <rect class="vpc" x="265" y="584" width="660" height="210"/>
  <text class="label-sm" x="595" y="612" text-anchor="middle">Application VPC</text>
  <text class="hint" x="595" y="632" text-anchor="middle">Spans ca-central-1a, ca-central-1b, and ca-central-1d; resources shown once</text>

  <rect class="subnet-public" x="292" y="654" width="230" height="112"/>
  <text class="label-xs" x="407" y="678" text-anchor="middle">Public subnets - 3 AZs</text>
  <g transform="translate(318,698)">
    <rect class="card-soft" width="178" height="42" rx="3"/>
    <rect x="10" y="8" width="26" height="26" fill="#8b5cf6"/>
    <text class="tileTextSm" x="23" y="21">ALB</text>
    <text class="label-xs" x="48" y="17">ALB Selfservice</text>
    <text class="text-sm" x="48" y="33">api / selfservice</text>
  </g>
  <g transform="translate(318,746)">
    <rect class="card-soft" width="178" height="42" rx="3"/>
    <rect x="10" y="8" width="26" height="26" fill="#8b5cf6"/>
    <text class="tileTextSm" x="23" y="21">ALB</text>
    <text class="label-xs" x="48" y="17">ALB Migration</text>
    <text class="text-sm" x="48" y="33">api / migration</text>
  </g>

  <rect class="subnet-private" x="558" y="654" width="330" height="112"/>
  <text class="label-xs" x="723" y="678" text-anchor="middle">Private subnets - 3 AZs</text>
  <text class="hint" x="723" y="694" text-anchor="middle">Valkey placement to confirm</text>
  <g transform="translate(578,708)">
    <rect class="card-soft" width="132" height="34" rx="3"/>
    <rect x="9" y="6" width="22" height="22" fill="#f97316"/>
    <text class="tileTextSm" x="20" y="17">ECS</text>
    <text class="label-xs" x="40" y="21">Selfservice</text>
  </g>
  <g transform="translate(578,748)">
    <rect class="card-soft" width="132" height="34" rx="3"/>
    <rect x="9" y="6" width="22" height="22" fill="#f97316"/>
    <text class="tileTextSm" x="20" y="17">ECS</text>
    <text class="label-xs" x="40" y="21">Migration</text>
  </g>
  <g transform="translate(728,708)">
    <rect class="card-soft" width="132" height="34" rx="3"/>
    <rect x="9" y="6" width="22" height="22" fill="#c026d3"/>
    <text class="tileTextSm" x="20" y="17">R</text>
    <text class="label-xs" x="40" y="21">Valkey self</text>
  </g>
  <g transform="translate(728,748)">
    <rect class="card-soft" width="132" height="34" rx="3"/>
    <rect x="9" y="6" width="22" height="22" fill="#c026d3"/>
    <text class="tileTextSm" x="20" y="17">R</text>
    <text class="label-xs" x="40" y="21">Valkey migr</text>
  </g>

  <rect class="panel-soft" x="290" y="806" width="610" height="38"/>
  <text class="label-xs" x="314" y="830">No-arrow dependencies:</text>
  <text class="text-sm" x="460" y="830">ECR</text>
  <text class="text-sm" x="530" y="830">DNS Firewall</text>
  <text class="text-sm" x="650" y="830">Secrets Manager</text>

  <path class="flow" d="M858 320 C760 360, 618 420, 536 490"/>
  <text class="flow-label" x="704" y="408">api.*</text>
  <path class="flow" d="M536 568 C500 616, 454 668, 407 698"/>
  <path class="flow" d="M550 568 C508 638, 456 722, 407 746"/>
  <path class="flow" d="M496 719 L578 725"/>
  <path class="flow" d="M496 767 L578 765"/>

  <!-- Static website panel inside region -->
  <rect class="static-panel" x="990" y="420" width="270" height="438"/>
  <text class="label-sm" x="1125" y="448" text-anchor="middle">Static website flow</text>
  <text class="hint" x="1125" y="468" text-anchor="middle">Inside ca-central-1 boundary per feedback</text>
  <g transform="translate(1059,520)">
    <rect class="card" width="132" height="70" rx="3"/>
    <rect x="46" y="12" width="40" height="36" fill="#e11d48"/>
    <text class="tileTextSm" x="66" y="30">WAF</text>
    <text class="label-sm" x="66" y="62" text-anchor="middle">Static WAF</text>
  </g>
  <g transform="translate(1059,630)">
    <rect class="card" width="132" height="70" rx="3"/>
    <rect x="46" y="12" width="40" height="36" fill="#7c3aed"/>
    <text class="tileTextSm" x="66" y="30">CF</text>
    <text class="label-sm" x="66" y="62" text-anchor="middle">CloudFront</text>
  </g>
  <g transform="translate(1059,740)">
    <rect class="card" width="132" height="70" rx="3"/>
    <rect x="46" y="12" width="40" height="36" fill="#679a08"/>
    <text class="tileTextSm" x="66" y="30">S3</text>
    <text class="label-sm" x="66" y="62" text-anchor="middle">S3 origins</text>
  </g>
  <path class="flow" d="M928 320 C1000 374, 1082 438, 1125 520"/>
  <text class="flow-label" x="1036" y="410">static.*</text>
  <path class="flow" d="M1125 590 L1125 630"/>
  <path class="flow" d="M1125 700 L1125 740"/>

  <!-- Webhook processing inside region -->
  <rect class="webhook-panel" x="1300" y="420" width="260" height="438"/>
  <text class="label-sm" x="1430" y="448" text-anchor="middle">Verify webhook processing</text>
  <text class="hint" x="1430" y="468" text-anchor="middle">AWS processing inside ca-central-1</text>
  <g transform="translate(1364,520)">
    <rect class="card-soft" width="132" height="62" rx="3"/>
    <text class="label-xs" x="66" y="25" text-anchor="middle">API Gateway</text>
    <text class="text-sm" x="66" y="43" text-anchor="middle">webhook ingress</text>
  </g>
  <g transform="translate(1364,630)">
    <rect class="card-soft" width="132" height="62" rx="3"/>
    <text class="label-xs" x="66" y="25" text-anchor="middle">Ingest queue</text>
    <text class="text-sm" x="66" y="43" text-anchor="middle">events</text>
  </g>
  <g transform="translate(1364,740)">
    <rect class="card-soft" width="132" height="62" rx="3"/>
    <text class="label-xs" x="66" y="25" text-anchor="middle">Forwarder Lambda</text>
    <text class="text-sm" x="66" y="43" text-anchor="middle">forward logs</text>
  </g>
  <path class="flow-dashed" d="M1654 525 L1496 551"/>
  <path class="flow-dashed" d="M1430 582 L1430 630"/>
  <path class="flow-dashed" d="M1430 692 L1430 740"/>
  <path class="flow-dashed" d="M1496 771 L1654 757"/>

  <!-- Notes -->
  <rect class="note" x="205" y="1018" width="1390" height="110"/>
  <text class="label-sm" x="235" y="1048">Feedback applied</text>
  <text class="text" x="235" y="1075">- Static website and AWS webhook processing are now inside the Canada Central Region boundary.</text>
  <text class="text" x="235" y="1101">- Regional WAF moved above/near ALBs so arrows flow from DNS to ingress to ECS without crossing the runtime area.</text>
  <text class="text" x="1005" y="1075">- Valkey is still shown, but subnet placement is marked to confirm.</text>
  <text class="text" x="1005" y="1101">- IBM Verify and SIEM stay external to AWS.</text>
</svg>
