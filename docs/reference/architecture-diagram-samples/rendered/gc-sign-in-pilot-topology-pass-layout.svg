<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">GC Sign-In Pilot - AWS Topology Pass Layout</title>
  <desc id="desc">Structure-only AWS topology with AWS Cloud, Canada Central Region, Application VPC, edge static web tier, IBM Verify SaaS, and external participants. Runtime flow lines are omitted.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 26px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .subtitle { font: 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .boundary { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .boundary-soft { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .aws-boundary { fill: #ffffff; stroke: #111827; stroke-width: 2.4; }
      .region { fill: #faffff; stroke: #0ea5a8; stroke-width: 2; }
      .vpc { fill: #fbf7ff; stroke: #8b5cf6; stroke-width: 2.2; }
      .subnet-public { fill: #f8fbef; stroke: #78a22f; stroke-width: 2; }
      .subnet-private { fill: #eefbfc; stroke: #09a8b5; stroke-width: 2; }
      .group { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .group-muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .external { fill: #fffdf7; stroke: #64748b; stroke-width: 2; }
      .saas { fill: #f8fbff; stroke: #2563eb; stroke-width: 2.2; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; }
      .label-sm { font: 700 14px Arial, sans-serif; fill: #111827; }
      .label-xs { font: 700 12px Arial, sans-serif; fill: #111827; }
      .text { font: 13px Arial, sans-serif; fill: #1f2937; }
      .text-sm { font: 12px Arial, sans-serif; fill: #334155; }
      .hint { font: 12px Arial, sans-serif; fill: #64748b; font-style: italic; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .card-soft { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; }
      .pill { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .iconText { font: 700 18px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .iconTextSmall { font: 700 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .legend { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1120"/>
  <text class="title" x="800" y="34">GC Sign-In Pilot - Sample AWS Topology</text>
  <text class="subtitle" x="800" y="58">Structure-only topology based on the uploaded pilot sketch; runtime and OAuth flow lines omitted</text>

  <!-- AWS cloud / product boundary -->
  <rect class="aws-boundary" x="48" y="86" width="1084" height="738" rx="0"/>
  <rect x="70" y="108" width="32" height="32" fill="#111827"/>
  <text class="iconTextSmall" x="86" y="124">aws</text>
  <text class="label" x="116" y="130">AWS Cloud</text>

  <rect class="boundary-soft" x="88" y="162" width="1000" height="612"/>
  <text class="label" x="590" y="188" text-anchor="middle">Web App and Product Website</text>

  <!-- Canada Central Region -->
  <rect class="region" x="120" y="210" width="635" height="520"/>
  <rect x="138" y="230" width="30" height="30" fill="#08a6a8"/>
  <text class="iconText" x="153" y="245">R</text>
  <text class="label-sm" x="184" y="250">Canada Central Region</text>

  <!-- App WAF -->
  <g transform="translate(154,285)">
    <rect class="card" width="138" height="122"/>
    <rect x="35" y="41" width="52" height="52" fill="#e11d48"/>
    <text class="iconText" x="61" y="67">W</text>
    <text class="hint" x="69" y="23" text-anchor="middle">WAF</text>
    <text class="label-sm" x="69" y="39" text-anchor="middle">Web App</text>
    <text class="label-sm" x="69" y="56" text-anchor="middle">Firewall</text>
    <text class="text-sm" x="69" y="111" text-anchor="middle">App protection</text>
  </g>

  <!-- Application VPC -->
  <rect class="vpc" x="320" y="276" width="405" height="384"/>
  <rect x="340" y="296" width="30" height="30" fill="#8b5cf6"/>
  <text class="iconText" x="355" y="311">V</text>
  <text class="label-sm" x="386" y="316">Application VPC</text>
  <rect class="group-muted" x="352" y="342" width="340" height="270"/>
  <text class="label-sm" x="522" y="367" text-anchor="middle">(back-end)</text>

  <rect class="subnet-public" x="382" y="398" width="132" height="158"/>
  <rect x="398" y="416" width="27" height="27" fill="#78a22f"/>
  <text class="iconTextSmall" x="411.5" y="429.5">S</text>
  <text class="label-xs" x="436" y="434">Public subnet</text>
  <g transform="translate(409,464)">
    <rect class="card-soft" width="78" height="62"/>
    <circle cx="39" cy="28" r="17" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="39" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8b5cf6">ALB</text>
    <text class="text-sm" x="39" y="55" text-anchor="middle">HTTPS</text>
  </g>
  <text class="label-xs" x="448" y="580" text-anchor="middle">App Load Balancer</text>

  <rect class="subnet-private" x="546" y="388" width="118" height="188"/>
  <rect x="560" y="406" width="27" height="27" fill="#0ea5a8"/>
  <text class="iconTextSmall" x="573.5" y="419.5">S</text>
  <text class="label-xs" x="599" y="424">Private subnet</text>
  <g transform="translate(564,452)">
    <rect class="card-soft" width="82" height="72"/>
    <rect x="18" y="24" width="36" height="36" fill="#f97316"/>
    <text class="iconTextSmall" x="36" y="42">ECS</text>
    <text class="label-xs" x="41" y="17" text-anchor="middle">ECS Service</text>
    <text class="text-sm" x="41" y="65" text-anchor="middle">Fargate</text>
  </g>
  <rect class="pill" x="565" y="537" width="80" height="22"/>
  <text class="text-sm" x="605" y="552" text-anchor="middle">Backend</text>
  <g transform="translate(579,588)">
    <rect class="card-soft" width="54" height="50"/>
    <rect x="11" y="12" width="32" height="28" fill="#c026d3"/>
    <text class="iconTextSmall" x="27" y="26">R</text>
    <text class="label-xs" x="27" y="-7" text-anchor="middle">Redis</text>
  </g>

  <!-- Platform services -->
  <rect class="group" x="150" y="622" width="565" height="86"/>
  <text class="label-sm" x="432" y="645" text-anchor="middle">Platform services</text>
  <g transform="translate(186,660)">
    <rect class="card-soft" width="132" height="34"/>
    <rect x="9" y="6" width="23" height="23" fill="#e11d48"/>
    <text class="iconTextSmall" x="20.5" y="17.5">S</text>
    <text class="label-xs" x="42" y="19">Secrets Manager</text>
  </g>
  <g transform="translate(354,660)">
    <rect class="card-soft" width="158" height="34"/>
    <rect x="9" y="6" width="23" height="23" fill="#f97316"/>
    <text class="iconTextSmall" x="20.5" y="17.5">E</text>
    <text class="label-xs" x="42" y="19">Elastic Container Registry</text>
  </g>
  <g transform="translate(548,660)">
    <rect class="card-soft" width="132" height="34"/>
    <rect x="9" y="6" width="23" height="23" fill="#db2777"/>
    <text class="iconTextSmall" x="20.5" y="17.5">L</text>
    <text class="label-xs" x="42" y="19">CloudWatch Logs</text>
  </g>

  <!-- Edge/static tier -->
  <rect class="group" x="790" y="210" width="258" height="520"/>
  <text class="label-sm" x="919" y="238" text-anchor="middle">Edge and static web tier</text>
  <g transform="translate(850,272)">
    <rect class="card" width="138" height="122"/>
    <rect x="35" y="41" width="52" height="52" fill="#e11d48"/>
    <text class="iconText" x="61" y="67">W</text>
    <text class="hint" x="69" y="23" text-anchor="middle">WAF</text>
    <text class="label-sm" x="69" y="39" text-anchor="middle">Web App</text>
    <text class="label-sm" x="69" y="56" text-anchor="middle">Firewall</text>
    <text class="text-sm" x="69" y="111" text-anchor="middle">Edge protection</text>
  </g>
  <rect class="group-muted" x="825" y="432" width="188" height="166"/>
  <text class="label-sm" x="919" y="458" text-anchor="middle">(Web)</text>
  <g transform="translate(846,482)">
    <rect class="card-soft" width="70" height="78"/>
    <rect x="18" y="22" width="34" height="34" fill="#7c3aed"/>
    <text class="iconTextSmall" x="35" y="39">CF</text>
    <text class="label-xs" x="35" y="16" text-anchor="middle">CloudFront</text>
    <text class="text-sm" x="35" y="71" text-anchor="middle">dist</text>
  </g>
  <g transform="translate(930,482)">
    <rect class="card-soft" width="62" height="78"/>
    <rect x="15" y="22" width="32" height="34" fill="#679a08"/>
    <text class="iconTextSmall" x="31" y="39">S3</text>
    <text class="label-xs" x="31" y="16" text-anchor="middle">S3</text>
    <text class="text-sm" x="31" y="71" text-anchor="middle">assets</text>
  </g>
  <g transform="translate(876,632)">
    <rect class="card" width="86" height="70"/>
    <rect x="25" y="21" width="36" height="36" fill="#7c3aed"/>
    <text class="iconTextSmall" x="43" y="39">53</text>
    <text class="label-xs" x="43" y="15" text-anchor="middle">Route 53</text>
    <text class="text-sm" x="43" y="64" text-anchor="middle">DNS</text>
  </g>

  <!-- External participants -->
  <rect class="external" x="1180" y="132" width="360" height="230"/>
  <text class="hint" x="1360" y="158" text-anchor="middle">External</text>
  <text class="label" x="1360" y="181" text-anchor="middle">External participants</text>
  <g transform="translate(1230,224)">
    <rect class="card" width="112" height="82"/>
    <rect x="40" y="13" width="32" height="28" fill="#f59e0b"/>
    <text class="iconTextSmall" x="56" y="27">UA</text>
    <text class="label-xs" x="56" y="58" text-anchor="middle">User Agent</text>
    <text class="text-sm" x="56" y="74" text-anchor="middle">Web Browser</text>
  </g>
  <g transform="translate(1380,224)">
    <rect class="card" width="112" height="82"/>
    <rect x="40" y="13" width="32" height="28" fill="#65a30d"/>
    <text class="iconTextSmall" x="56" y="27">RP</text>
    <text class="label-xs" x="56" y="58" text-anchor="middle">Relying Party</text>
    <text class="text-sm" x="56" y="74" text-anchor="middle">Partner Portal</text>
  </g>

  <!-- Diagram notes -->
  <rect class="legend" x="1180" y="420" width="360" height="214"/>
  <text class="label-sm" x="1202" y="450">Layout pass summary</text>
  <text class="text" x="1202" y="480">Objects grouped before layout.</text>
  <text class="text" x="1202" y="505">Region, VPC, SaaS, and external</text>
  <text class="text" x="1202" y="530">boundaries preserved.</text>
  <text class="text" x="1202" y="565">Peer groups are placed left-to-right</text>
  <text class="text" x="1202" y="590">where the source topology permits it.</text>
  <text class="text" x="1202" y="625">No runtime or OAuth flow lines shown.</text>

  <!-- IBM Verify SaaS -->
  <rect class="saas" x="48" y="862" width="1084" height="190"/>
  <text class="hint" x="590" y="888" text-anchor="middle">External</text>
  <text class="label" x="590" y="912" text-anchor="middle">IBM Verify SaaS (Canada)</text>
  <g transform="translate(94,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="19" text-anchor="middle">MFA Services</text>
    <text class="text-sm" x="72.5" y="35" text-anchor="middle">authentication</text>
  </g>
  <g transform="translate(262,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="19" text-anchor="middle">APIs</text>
    <text class="text-sm" x="72.5" y="35" text-anchor="middle">profile/OIDC</text>
  </g>
  <g transform="translate(430,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="19" text-anchor="middle">OIDC Applications</text>
    <text class="text-sm" x="72.5" y="35" text-anchor="middle">clients</text>
  </g>
  <g transform="translate(598,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="17" text-anchor="middle">Monitoring /</text>
    <text class="label-xs" x="72.5" y="32" text-anchor="middle">Reporting</text>
  </g>
  <g transform="translate(766,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="17" text-anchor="middle">Flow Designer</text>
    <text class="text-sm" x="72.5" y="34" text-anchor="middle">branded flows</text>
  </g>
  <g transform="translate(934,944)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="17" text-anchor="middle">Custom Themes</text>
    <text class="text-sm" x="72.5" y="34" text-anchor="middle">branding</text>
  </g>
  <g transform="translate(178,1000)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="17" text-anchor="middle">Identity Store</text>
    <text class="text-sm" x="72.5" y="34" text-anchor="middle">core profile</text>
  </g>
  <g transform="translate(430,1000)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="17" text-anchor="middle">OIDC Services</text>
    <text class="text-sm" x="72.5" y="34" text-anchor="middle">SSO</text>
  </g>
  <g transform="translate(682,1000)">
    <rect class="card" width="145" height="44"/>
    <text class="label-xs" x="72.5" y="19" text-anchor="middle">Access Policies</text>
    <text class="text-sm" x="72.5" y="35" text-anchor="middle">rules</text>
  </g>

  <rect class="legend" x="1180" y="862" width="360" height="190"/>
  <text class="label-sm" x="1202" y="892">Intentionally omitted</text>
  <text class="text" x="1202" y="922">OAuth sign-in / sign-up / recovery</text>
  <text class="text" x="1202" y="947">Redirect callback paths</text>
  <text class="text" x="1202" y="972">Back-channel logout</text>
  <text class="text" x="1202" y="997">Profile update and OIDC endpoint flow</text>
  <text class="text" x="1202" y="1022">Data-flow arrows and runtime sequencing</text>
</svg>
