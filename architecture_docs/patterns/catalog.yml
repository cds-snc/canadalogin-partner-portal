  - id: PAT-022
    title: Page Length and Splitting
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
      - testing
    path: docs/patterns/design/pat-022-page-length-and-splitting.md
    problem: Generated pages often become too long because they combine orientation, task selection, forms, reports, help text, status, and administration on one route.
    use_when:
      - a page is becoming hard to scan, test, or explain in one H1
      - a page includes several tasks, forms, data views, or user goals
      - an existing page or active design combines unrelated task flows, forms, reports, status, administration, or help content
      - long content needs a decision between one page, multiple pages, details sections, in-page table of contents, or a multi-step flow
      - a design review needs a consistent way to challenge oversized generated pages
    do_not_use_when:
      - the page is already a short, focused single task or single content page
      - the content is required to remain together for legal, policy, or publication reasons and has an approved long-page structure
      - the split would hide required information, break task flow, or create unnecessary navigation
