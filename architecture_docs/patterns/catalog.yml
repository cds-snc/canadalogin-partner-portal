  - id: PAT-025
    title: Dependency Substitution
    type: pattern
    status: active
    primary_category: full-stack
    categories:
      - full-stack
      - architecture
      - operations
      - testing
      - security
    path: docs/patterns/full-stack/pat-025-dependency-substitution.md
    problem: Required dependencies may be unavailable or unauthorized in a work context, but substitutes must not create a different application architecture or conceal remaining real-integration gaps.
    use_when:
      - a target dependency is unavailable or access is not authorized in the declared work context
      - local or shared non-production work needs a safe stub, fake, simulator, local service, or other substitute
      - real and substituted implementations need a stable application-owned boundary and common contract tests
      - dependency mode must be selected explicitly and fail safely
    do_not_use_when:
      - the target dependency or application-facing contract is unknown
      - the requested outcome specifically requires real provider, infrastructure, assurance, performance, or operational behavior
      - a substitute would bypass required security, privacy, audit, retention, transaction, or business behavior
      - production fallback or degraded mode lacks an explicit architecture and operational decision
    related_standards:
      - STD-002
      - STD-012
      - STD-013
      - STD-014
    related_patterns:
      - PAT-007
