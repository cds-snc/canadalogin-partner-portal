catalog_version: 1
scope: patterns
description: >
  Machine-readable routing index for reusable architecture patterns. Use this
  file to find candidate patterns by problem, category, fit, and related
  standards. Pattern documents remain the authoritative source for approach,
  trade-offs, and checks.

categories:
  full-stack:
    title: Full Stack
    description: Cross-layer feature delivery from requirements and API contracts through backend, frontend, authorization, persistence, and verification.
  architecture:
    title: Architecture
    description: Cross-cutting solution boundaries, dependency composition, and reusable runtime architecture shapes.
  design-system:
    title: Design System
    description: UI page structure, navigation, component choices, and page-shell patterns.
  accessibility:
    title: Accessibility
    description: UI interaction, labels, focus, errors, page structure, and assistive technology behavior.
  frontend:
    title: Frontend
    description: Browser application behavior, routing, data fetching, forms, and client state.
  backend:
    title: Backend
    description: Backend route, service, schema, job, and resource implementation shapes.
  api:
    title: API
    description: API client/server interaction, request/response handling, and contract behavior.
  security:
    title: Security
    description: Authentication, authorization, audit, secret handling, and sensitive operations.
  data:
    title: Data
    description: Persistence, migrations, schema changes, and database lifecycle work.
  operations:
    title: Operations
    description: Jobs, verification, observability, runtime behavior, and operational checks.
  testing:
    title: Testing
    description: Pattern-specific tests, checks, verification notes, and regression coverage.
  deployment:
    title: Deployment
    description: Runtime deployment, platform configuration, and deployed secret handling.

documents:
  - id: PAT-001
    title: UI Page Patterns
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
    path: docs/patterns/design/pat-001-ui-page-patterns.md
    problem: User-facing pages need a repeatable page structure so teams do not invent one-off layouts, navigation paths, or accessibility behavior for each screen.
    use_when:
      - scaffolding a user-facing frontend or template UI
      - planning, implementing, or reviewing a user-facing page, route, form, or task flow
      - selecting a GC Design System page shell, navigation path, or component baseline
      - recording a page-pattern decision or UI exception
      - refactoring an overloaded feature area into a task hub and focused destination routes
      - deciding whether a feature area needs a service home, task hub, dashboard, or direct task page
    do_not_use_when:
      - the work is backend-only and does not affect user-facing UI
      - the project has already selected a different approved page framework and recorded the exception
    related_standards:
      - STD-005
      - STD-006
      - STD-007
      - STD-017
    related_patterns:
      - PAT-013
      - PAT-014
      - PAT-015
      - PAT-003
      - PAT-019
      - PAT-020
      - PAT-021
      - PAT-022
    schema_refs:
      - id: ARCH-SCHEMA-PAT-001-UI-PAGE-PATTERNS
        path: docs/schemas/patterns/pat-001-ui-page-patterns.schema.yaml
        used_for:
          - checking page-pattern selection, page shell, navigation path, design-system use, accessibility evidence, and UI exceptions

  - id: PAT-002
    title: API Query and Mutation
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - api
    path: docs/patterns/frontend/pat-002-api-query-and-mutation.md
    problem: Frontend features need a consistent way to read and change backend data without scattering fetch behavior, loading states, error handling, and cache updates.
    use_when:
      - a frontend feature reads backend data
      - a frontend feature creates, updates, deletes, or triggers backend behavior
      - the UI needs loading, empty, error, success, refresh, or cache behavior
    do_not_use_when:
      - data is static content
      - state is purely local UI state and does not come from the backend
    related_standards:
      - STD-004
      - STD-009
      - STD-010
      - STD-012
    related_patterns:
      - PAT-003
      - PAT-005
      - PAT-006
      - PAT-020
      - PAT-024
    schema_refs:
      - id: ARCH-SCHEMA-PAT-002-API-QUERY-MUTATION
        path: docs/schemas/patterns/pat-002-api-query-and-mutation.schema.yaml
        used_for:
          - checking typed API helpers, query and mutation hooks, status states, cache behavior, tests, and API contract evidence

  - id: PAT-003
    title: Form Page
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - design-system
      - accessibility
      - api
    path: docs/patterns/frontend/pat-003-form-page.md
    problem: Forms need a consistent page, validation, submission, and error-handling structure so user input is reliable and reviewable.
    use_when:
      - a user-facing page collects input
      - a form needs validation, error summaries, field-level errors, or submission handling
      - form behavior needs frontend and API verification
    do_not_use_when:
      - the page is read-only content
      - the form is part of a larger multi-step flow that needs a separate flow decision
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-010
      - STD-012
    related_patterns:
      - PAT-001
      - PAT-002
      - PAT-019
      - PAT-020
      - PAT-022
    schema_refs:
      - id: ARCH-SCHEMA-PAT-003-FORM-PAGE
        path: docs/schemas/patterns/pat-003-form-page.schema.yaml
        used_for:
          - checking form validation, error summary, field-level errors, submit behavior, accessibility evidence, and form tests

  - id: PAT-004
    title: Protected Route
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - security
    path: docs/patterns/frontend/pat-004-protected-route.md
    problem: Protected frontend routes need a clear session and authorization boundary so unauthenticated or unauthorized users are handled predictably.
    use_when:
      - a frontend route requires a signed-in user
      - a route needs role, permission, or session-aware UI behavior
      - the app needs loading, signed-out, forbidden, or retry states for protected content
      - protected route entry needs fresh server-backed session or authorization state
      - local protected-route verification uses a cookie-backed backend session
    do_not_use_when:
      - the route is public
      - backend authorization is missing and the frontend route guard would be the only protection
    related_standards:
      - STD-004
      - STD-013
    related_patterns:
      - PAT-009
      - PAT-010
      - PAT-018
      - PAT-020
      - PAT-024
    schema_refs:
      - id: ARCH-SCHEMA-PAT-004-PROTECTED-ROUTE
        path: docs/schemas/patterns/pat-004-protected-route.schema.yaml
        used_for:
          - checking server-backed session freshness, fail-closed route entry, public sign-in reachability, backend enforcement, local cookie-session verification when applicable, and authorization tests

  - id: PAT-005
    title: Router, Service, Schema
    type: pattern
    status: active
    primary_category: backend
    categories:
      - backend
      - api
      - testing
    path: docs/patterns/backend/pat-005-router-service-schema.md
    problem: Backend endpoints need a repeatable route, service, and schema split so HTTP concerns, behavior, and contracts stay easy to review.
    use_when:
      - adding a backend endpoint or endpoint group
      - a route does more than return a static response
      - route behavior, request models, response models, dependencies, and service logic need a clear boundary
      - endpoint behavior delegates to an external API or provider
    do_not_use_when:
      - the route is a one-line health check with no behavior or dependency needs
    related_standards:
      - STD-008
      - STD-009
      - STD-010
      - STD-012
    related_patterns:
      - PAT-002
      - PAT-006
      - PAT-024
      - PAT-026
    schema_refs:
      - id: ARCH-SCHEMA-PAT-005-ROUTER-SERVICE-SCHEMA
        path: docs/schemas/patterns/pat-005-router-service-schema.schema.yaml
        used_for:
          - checking route, service, schema, dependency, outbound adapter, error, OpenAPI, and backend test boundaries

  - id: PAT-006
    title: CRUD Resource
    type: pattern
    status: active
    primary_category: backend
    categories:
      - backend
      - api
      - data
      - testing
    path: docs/patterns/backend/pat-006-crud-resource.md
    problem: CRUD resources need a consistent implementation shape for create, read, update, and delete behavior across API, service, persistence, and tests.
    use_when:
      - a resource needs create, read, update, or delete behavior
      - API, service, persistence, and tests need to evolve together
      - ownership, validation, and error behavior need consistent handling
      - create, update, or delete behavior may change backend or frontend cached data
    do_not_use_when:
      - the domain behavior is an action or workflow rather than a resource lifecycle
      - authorization, ownership, or audit requirements are unclear
    related_standards:
      - STD-008
      - STD-009
      - STD-010
      - STD-012
      - STD-013
      - STD-020
    related_patterns:
      - PAT-002
      - PAT-005
      - PAT-008
      - PAT-012
      - PAT-024
    schema_refs:
      - id: ARCH-SCHEMA-PAT-006-CRUD-RESOURCE
        path: docs/schemas/patterns/pat-006-crud-resource.schema.yaml
        used_for:
          - checking CRUD ownership, API models, service and repository boundaries, migrations, authorization, delete semantics, write-path cache consistency, and tests

  - id: PAT-007
    title: Background Job
    type: pattern
    status: active
    primary_category: backend
    categories:
      - backend
      - operations
    path: docs/patterns/backend/pat-007-background-job.md
    problem: Background work needs a clear boundary so slow or asynchronous behavior does not get hidden inside request handlers.
    use_when:
      - work is too slow or unreliable to complete inside a request
      - retry, status, queueing, or scheduled execution behavior is needed
      - queue or downstream dependencies may need explicit substitutes and operational verification
    do_not_use_when:
      - the work must complete synchronously before returning a response
      - queue infrastructure, retry semantics, or idempotency are unclear
    related_standards:
      - STD-008
      - STD-011
      - STD-012
      - STD-013
    related_patterns:
      - PAT-005
      - PAT-008
      - PAT-025
      - PAT-026

  - id: PAT-008
    title: Audit Log
    type: pattern
    status: active
    primary_category: security
    categories:
      - security
      - backend
      - data
      - operations
    path: docs/patterns/security/pat-008-audit-log.md
    problem: Audit-sensitive behavior needs a consistent record of who did what, when it happened, and which business object was affected.
    use_when:
      - a business action needs traceability
      - changes affect sensitive data, access, permissions, administrative action, or record lifecycle
      - audit records need persistence, safe logging, and verification
    do_not_use_when:
      - ordinary diagnostic logs are sufficient
      - retention, privacy, or audit-event ownership is unclear
    related_standards:
      - STD-011
      - STD-013
    related_patterns:
      - PAT-006
      - PAT-010
      - PAT-012

  - id: PAT-009
    title: OIDC Backend Session
    type: pattern
    status: active
    primary_category: security
    categories:
      - security
      - backend
      - frontend
      - operations
      - testing
    path: docs/patterns/security/pat-009-oidc-backend-session.md
    problem: OIDC sign-in needs a secure browser-to-backend session boundary without storing sensitive tokens in the browser.
    use_when:
      - users authenticate through an OIDC provider
      - the browser should not store access, refresh, or ID tokens
      - backend routes need the current user, roles, or session state
      - local cookie-session hostnames, credentials, CORS, CSRF posture, or auth redirects are designed or changed
    do_not_use_when:
      - the caller is a machine-to-machine client
      - the app is static and has no backend session boundary
      - the feature only needs simulated users or roles and no OIDC provider interaction is in scope
    related_standards:
      - STD-002
      - STD-003
      - STD-004
      - STD-008
      - STD-012
      - STD-013
      - STD-014
    related_patterns:
      - PAT-004
      - PAT-010
      - PAT-011
      - PAT-018
      - PAT-024
      - PAT-025
    schema_refs:
      - id: ARCH-SCHEMA-PAT-009-OIDC-BACKEND-SESSION
        path: docs/schemas/patterns/pat-009-oidc-backend-session.schema.yaml
        used_for:
          - checking the OIDC and backend-session boundary, cookie security, local hostname consistency, scoped credentials, CORS, CSRF posture, redirects, logout, and verification

  - id: PAT-010
    title: RBAC Policy Check
    type: pattern
    status: active
    primary_category: security
    categories:
      - security
      - backend
      - api
    path: docs/patterns/security/pat-010-rbac-policy-check.md
    problem: Permission checks need a repeatable policy boundary so routes do not embed one-off role logic.
    use_when:
      - backend routes need role or permission checks
      - access decisions should be centralized and testable
      - frontend protected routes need matching backend enforcement
      - a protected resource or action needs policy initialization, enforcement, resource scoping, and authorization tests
    do_not_use_when:
      - the route, resource, or action is public
      - simple authentication is enough
    related_standards:
      - STD-008
      - STD-013
    related_patterns:
      - PAT-004
      - PAT-008
      - PAT-009
      - PAT-018
      - PAT-024
    schema_refs:
      - id: ARCH-SCHEMA-PAT-010-RBAC-POLICY-CHECK
        path: docs/schemas/patterns/pat-010-rbac-policy-check.schema.yaml
        used_for:
          - checking policy definition, initialization data, server enforcement, object or tenant boundaries, and authorization tests

  - id: PAT-011
    title: Secret Lifecycle
    type: pattern
    status: active
    primary_category: security
    categories:
      - security
      - operations
      - deployment
    path: docs/patterns/security/pat-011-secret-lifecycle.md
    problem: Secret-handling capabilities need consistent lifecycle semantics across safe fake values or development and test adapters and deployed runtime sources, while real secrets require provisioning, rotation, revocation, and incident response.
    use_when:
      - adding, changing, rotating, or removing secrets
      - deciding how a substitute store preserves the selected deployed store's application-owned lifecycle contract
      - reviewing config, logs, generated output, or deployment for secret exposure
    do_not_use_when:
      - the value is public configuration
      - secret ownership, runtime source, or rotation path is unknown
    related_standards:
      - STD-002
      - STD-014
      - STD-016
    related_patterns:
      - PAT-009
      - PAT-025

  - id: PAT-012
    title: Alembic PostgreSQL Change
    type: pattern
    status: active
    primary_category: data
    categories:
      - data
      - backend
      - operations
    path: docs/patterns/data/pat-012-alembic-postgres-change.md
    problem: PostgreSQL schema changes need a repeatable migration path so database state, application code, and rollback expectations stay aligned.
    use_when:
      - changing PostgreSQL schema with Alembic
      - adding, modifying, or removing tables, columns, indexes, constraints, or seed/reference data
      - coordinating backend models, migrations, tests, and deployment notes
      - reviewing revision identifier capacity, storage, truncation, or migration graph resolution
    do_not_use_when:
      - the project does not use PostgreSQL or Alembic
      - destructive, large, or high-risk data migration needs a separate rollout decision
    related_standards:
      - STD-008
      - STD-012
      - STD-013
      - STD-020
    related_patterns:
      - PAT-006
      - PAT-008
      - PAT-024
    schema_refs:
      - id: ARCH-SCHEMA-PAT-012-ALEMBIC-POSTGRES-CHANGE
        path: docs/schemas/patterns/pat-012-alembic-postgres-change.schema.yaml
        used_for:
          - checking migration review, configured revision capacity and lookup behavior, rollback or downgrade consideration, data-loss review, tests, and deployment sequencing notes

  - id: PAT-013
    title: GC Design System React App Shell
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - design-system
      - accessibility
    path: docs/patterns/frontend/pat-013-gcds-react-app-shell.md
    problem: React applications that use the GC Design System need a consistent app shell so headers, language toggles, navigation, skip links, breadcrumbs, page content, and footers are not rebuilt differently on each page.
    use_when:
      - a React frontend uses @gcds-core/components-react
      - scaffolding or regenerating a React frontend that uses the GC Design System
      - a project needs a shared user-facing page shell
      - a page or feature adds navigation, language behavior, breadcrumbs, or layout structure
    do_not_use_when:
      - the project intentionally uses GCWeb/WET or another approved shell and has recorded the decision
      - the page is not user-facing and does not need Government of Canada page structure
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-018
    related_patterns:
      - PAT-001
      - PAT-014
      - PAT-015
    schema_refs:
      - id: ARCH-SCHEMA-PAT-013-GCDS-REACT-APP-SHELL
        path: docs/schemas/patterns/pat-013-gcds-react-app-shell.schema.yaml
        used_for:
          - checking GCDS app shell, header, footer, route metadata, navigation, language toggle, account summary, screenshots, and accessibility evidence

  - id: PAT-014
    title: Bilingual Route and I18n
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - design-system
      - accessibility
    path: docs/patterns/frontend/pat-014-bilingual-route-and-i18n.md
    problem: Bilingual React applications need one source of truth for language, equivalent routes, translated content, page titles, breadcrumbs, and language-toggle behavior.
    use_when:
      - a frontend has English and French routes or content
      - the page shell includes a Government of Canada language toggle
      - page titles, breadcrumbs, navigation labels, forms, and errors need translation
    do_not_use_when:
      - the application is intentionally single-language and has recorded that decision
      - language is controlled by an upstream platform and routes cannot include a language segment
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
    related_patterns:
      - PAT-001
      - PAT-013
      - PAT-015
    schema_refs:
      - id: ARCH-SCHEMA-PAT-014-BILINGUAL-ROUTE-I18N
        path: docs/schemas/patterns/pat-014-bilingual-route-and-i18n.schema.yaml
        used_for:
          - checking English and French route parity, i18n resources, language toggle, page metadata, breadcrumbs, and unsaved-input mitigation

  - id: PAT-015
    title: Storybook UI Review Fixture
    type: pattern
    status: active
    primary_category: frontend
    categories:
      - frontend
      - design-system
      - accessibility
      - testing
    path: docs/patterns/frontend/pat-015-storybook-ui-review-fixture.md
    problem: User-facing frontend work needs reviewable UI states without requiring reviewers to reproduce every backend state or signed-in session manually.
    use_when:
      - a component, page, form, task flow, or layout change needs visual review
      - a feature has loading, error, empty, validation, confirmation, or success states
      - a team wants repeatable accessibility checks for UI states
    do_not_use_when:
      - the change is backend-only
      - the UI is too coupled to a real external service to mock safely and needs an end-to-end environment instead
    related_standards:
      - STD-004
      - STD-005
      - STD-007
      - STD-012
      - STD-018
    related_patterns:
      - PAT-001
      - PAT-003
      - PAT-013
      - PAT-014

  - id: PAT-016
    title: Editable List
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
    path: docs/patterns/design/pat-016-editable-list.md
    problem: Editable lists need a consistent view mode and edit mode so repeated values can be reviewed, added, changed, removed, validated, and saved without accidental changes or one-off interaction patterns.
    use_when:
      - a user-facing page shows a list of repeated values that users can manage
      - the list needs add, edit, remove, save, cancel, validation, or error handling
      - values such as redirect URLs, allowed domains, notification email addresses, aliases, tags, or contact methods belong to one parent record or configuration screen
      - the list is short enough to manage directly on the page
    do_not_use_when:
      - the list is a large resource collection that needs search, filtering, pagination, bulk actions, or separate detail pages
      - each item has its own lifecycle, permissions, audit trail, or complex form
      - removing an item is high risk and needs a separate confirmation workflow
      - the page is read-only
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-012
      - STD-018
    related_patterns:
      - PAT-001
      - PAT-002
      - PAT-003
      - PAT-015
      - PAT-017

  - id: PAT-017
    title: Itemized Data Display
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
    path: docs/patterns/design/pat-017-itemized-data-display.md
    problem: Read-only itemized data needs a consistent structure so users can scan, compare, and verify repeated information without every feature inventing a custom table, card layout, or metadata block.
    use_when:
      - a user-facing page shows read-only item details, metadata, summaries, or repeated records
      - users need to scan a list of items but do not need to edit them in place
      - a page needs to show key-value facts, short repeated item summaries, or tabular data
      - the display needs responsive, accessible structure before custom styling
    do_not_use_when:
      - the list can be edited, added to, removed from, or reordered in place
      - the collection is a complex data grid with row selection, bulk actions, frozen columns, inline editing, or spreadsheet-like interaction
      - the selected structure is already known to be a frontend table that needs implementation, styling, sorting, filtering, pagination, or responsive behaviour rules
      - the information is a navigation menu, page outline, or task hub rather than itemized data
      - the data model, labels, or user task are not clear enough to choose a semantic structure
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-012
      - STD-018
    related_patterns:
      - PAT-001
      - PAT-002
      - PAT-015
      - PAT-016
      - PAT-023

  - id: PAT-018
    title: Local Role Simulation
    type: pattern
    status: active
    primary_category: security
    categories:
      - security
      - backend
      - frontend
      - testing
    path: docs/patterns/security/pat-018-local-role-simulation.md
    problem: Local development often needs to exercise role-based routes, navigation, and authorization before the real identity provider, role database, or claim-mapping source is available.
    use_when:
      - a local developer environment needs to simulate signed-in users or roles
      - the real identity provider, role database, or role assignment workflow is unavailable or unauthorized in the declared local context
      - protected routes, role-specific navigation, permission states, or review fixtures need local coverage
      - all data is fake, seeded, fixture, or test-only
    do_not_use_when:
      - the work is in a shared non-production or production environment
      - real identity-provider, database, or claim-mapping behaviour is being tested
      - role assignment, delegation, or approval is part of the business workflow
      - the role source of truth is unclear for a real deployment decision
    related_standards:
      - STD-002
      - STD-004
      - STD-008
      - STD-013
      - STD-014
    related_patterns:
      - PAT-004
      - PAT-009
      - PAT-010
      - PAT-013
      - PAT-015
      - PAT-025

  - id: PAT-019
    title: Multi-Step Task Flow
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
      - testing
    path: docs/patterns/design/pat-019-multi-step-task-flow.md
    problem: Government services often need to split a task across several pages so people can complete one clear step at a time without fragile wizards, unclear progress indicators, duplicated navigation, or hard-to-test confirmation states.
    use_when:
      - a user-facing task has a logical sequence split across more than one page
      - a form is too long or conditional to complete comfortably on one page
      - users need to review information before a final submit or state-changing action
      - the task needs progress, recovery, confirmation, or save-and-return behaviour
    do_not_use_when:
      - the task is one short form or one simple action on a single page
      - the content is a long informational page with subsections but no task sequence
      - users must be able to jump freely between unrelated pages or records
      - the business rules for step order, saving, or final submission are unclear
    related_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-012
      - STD-017
    related_patterns:
      - PAT-001
      - PAT-002
      - PAT-003
      - PAT-014
      - PAT-015
      - PAT-017
      - PAT-020
      - PAT-022

  - id: PAT-020
    title: Status and Feedback
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
      - testing
    path: docs/patterns/design/pat-020-status-and-feedback.md
    problem: User-facing applications need consistent feedback for loading, empty, error, warning, success, unauthorized, and service-disruption states so users know what happened and what to do next.
    use_when:
      - a page reads, creates, updates, deletes, submits, or refreshes data
      - a user action needs success, warning, error, or next-step feedback
      - a service outage, permission state, empty result, or unavailable feature needs to be explained
      - a UI state needs consistent copy, placement, accessibility, and visual treatment
    do_not_use_when:
      - the message is ordinary instructional content that belongs in the page body
      - the issue is only a field-level validation problem
      - the message is decorative emphasis, promotional content, or a label
      - the state is sensitive enough that safe error wording or disclosure rules are unclear
    related_standards:
      - STD-004
      - STD-005
      - STD-006
