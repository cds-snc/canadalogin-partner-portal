        path: docs/schemas/patterns/pat-025-dependency-substitution.schema.yaml
        used_for:
          - checking dependency availability, authorized access, target-contract preservation, explicit mode selection, production rejection, and real-integration gaps

  - id: PAT-026
    title: Outbound Service Adapter
    type: pattern
    status: active
    primary_category: backend
    categories:
      - backend
      - api
      - operations
      - security
      - testing
    path: docs/patterns/backend/pat-026-outbound-service-adapter.md
    problem: Backend services that call external APIs or providers need a stable, injected boundary for provider mapping, resilience, safe errors, and isolated tests.
    use_when:
      - a backend service calls an external API, platform, provider, or hosted service
      - provider-specific requests, responses, authentication, errors, timeouts, or retries need an application boundary
      - business behavior that depends on an external service needs isolated unit tests
    do_not_use_when:
      - the dependency is an in-process library with no network or provider boundary
      - the work only accesses the application's own database through its persistence boundary
      - a browser calls a third party directly and needs a separate browser trust and cross-origin review
    related_standards:
      - STD-002
