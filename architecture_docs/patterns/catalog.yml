  - id: PAT-021
    title: Dashboard Overview Page
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
      - testing
    path: docs/patterns/design/pat-021-dashboard-overview-page.md
    problem: Dashboards are easy to overuse as default landing pages; use them only when authenticated users have an operational need to monitor, triage, compare, or resume work across related records.
    use_when:
      - authenticated users need an overview of work, status, alerts, or recent activity
      - the page supports repeat users who need to triage or resume tasks quickly
      - users need to compare several queues, records, cases, clients, submissions, or configuration areas
      - each section has a clear data source, owner, refresh behaviour, and next action
    do_not_use_when:
      - the page is a public landing page or service home
      - the page is only a collection of shortcuts with no status or operational context
      - the dashboard would mix unrelated workflows, forms, reports, and admin tools on one page
      - the data is not reliable enough to support user decisions
      - users need to complete a linear task
