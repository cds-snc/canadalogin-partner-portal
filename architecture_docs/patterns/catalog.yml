  - id: PAT-023
    title: Frontend Data Table
    type: pattern
    status: active
    primary_category: design-system
    categories:
      - design-system
      - frontend
      - accessibility
      - testing
    path: docs/patterns/design/pat-023-frontend-data-table.md
    problem: Frontend data tables need consistent Government of Canada styling, accessible structure, responsive behaviour, and predictable data controls.
    use_when:
      - a user-facing frontend shows records with shared attributes
      - users need to scan, compare, sort, filter, or page through related data
      - a table needs to match GC Design System look and feel
      - a read-only table includes links, row actions, status text, or missing values that need consistent treatment
      - the team needs a repeatable standard for table component wrappers, responsive checks, and visual review
    do_not_use_when:
      - the page shows facts about one item or a short item summary
      - the repeated values are editable in place
      - the component is a complex data grid with row selection, bulk actions, frozen columns, inline editing, virtual scrolling, or spreadsheet-like navigation
      - the content is a navigation menu, task hub, dashboard card group, or visual page layout
      - the data model, labels, mobile task, or privacy rules are not clear enough to design the table safely
