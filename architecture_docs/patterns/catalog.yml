  - id: PAT-024
    title: Full-Stack Feature Slice
    type: pattern
    status: active
    primary_category: full-stack
    categories:
      - full-stack
      - frontend
      - backend
      - api
      - data
      - security
      - testing
    path: docs/patterns/full-stack/pat-024-full-stack-feature-slice.md
    problem: Features that cross several application layers need one adaptable delivery path so requirements, contracts, authorization, behavior, user states, and verification do not drift.
    use_when:
      - a new or materially changed user-facing feature crosses frontend and backend boundaries
      - a requirement must be traced through an API contract, implementation, and tests
      - persistence, migration, authorization, ownership, or generated artifacts may apply and need explicit decisions
      - writes may affect backend or frontend cached data
      - target dependencies may be unavailable and need explicit contract-compatible substitutes
      - several focused patterns need to be coordinated as one reviewable delivery slice
    do_not_use_when:
      - the change is isolated copy, documentation, styling, static content, or a single-layer adjustment
      - the work is only a scaffold or placeholder and does not deliver usable end-to-end behavior
      - data ownership, authorization, API behavior, or required outcomes are too unclear to define the slice
