    required_decision_points:
      - build context and ignore rules
      - runtime configuration and secret injection
      - non-root, non-privileged runtime posture
      - image scan and deployment readiness evidence
    adr_triggers:
      - baking configuration or secrets into a container image
      - skipping deployment review for shared or production work
      - skipping image scanning or equivalent review before production use
      - using privileged containers or a different deployment model

  gc-web-release-readiness:
    description: Government of Canada web application baseline assessment, control evidence, open risks, and release readiness.
    applies_when:
