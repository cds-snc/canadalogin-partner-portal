      - ARCH-SCHEMA-PAT-024-FULL-STACK-FEATURE-SLICE
      - ARCH-SCHEMA-PAT-025-DEPENDENCY-SUBSTITUTION
      - ARCH-SCHEMA-PAT-026-OUTBOUND-SERVICE-ADAPTER
      - ARCH-SCHEMA-GC-WEB-007-SECURITY
    required_decision_points:
      - service boundary and dependency ownership
      - dependency availability, authorized access, selected mode, and remaining real-integration gaps
      - outbound adapter, timeout, retry, safe error translation, and test behavior when applicable
      - cache applicability and coherent invalidation or update after writes
      - authorization, validation, and safe failure behavior
      - tests for meaningful success and failure paths
      - external system, secret, or production data involvement
    adr_triggers:
      - keeping nontrivial business logic in route handlers
      - deferring authorization, validation, or safe error review
      - materially selecting or changing external-system architecture without an applicable standard, pattern, project architecture, or decision
      - silently falling back to a development or test substitute

  database-persistence-change:
    description: Database model, repository, migration, seed data, retention, delete semantics, or persisted CRUD behavior.
    applies_when:
      - adding or changing relational persistence, SQLAlchemy models, repositories, Alembic migrations, indexes, constraints, or seed data
      - deciding ownership, retention, soft delete, hard delete, or public identifier behavior for stored records
      - changing a write path that affects cached data or reviewing Alembic revision identifier storage
    candidate_standards:
      - STD-008
      - STD-009
      - STD-010
      - STD-012
      - STD-013
      - STD-020
    candidate_patterns:
