      - GC-WEB-007
      - GC-WEB-008
      - GC-WEB-010
    candidate_baselines:
      - BAS-001
    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-002-WORK-CONTEXTS
      - ARCH-SCHEMA-STD-004-FRONTEND-REACT-TYPESCRIPT
      - ARCH-SCHEMA-STD-008-BACKEND-FASTAPI
      - ARCH-SCHEMA-STD-009-API-REST
      - ARCH-SCHEMA-STD-010-API-RESPONSE-ERROR-MODELS
      - ARCH-SCHEMA-STD-012-TESTING-BASICS
      - ARCH-SCHEMA-STD-013-SECURITY-PRIVACY-BASICS
      - ARCH-SCHEMA-STD-020-DATABASE-PERSISTENCE
      - ARCH-SCHEMA-PAT-002-API-QUERY-MUTATION
      - ARCH-SCHEMA-PAT-004-PROTECTED-ROUTE
      - ARCH-SCHEMA-PAT-005-ROUTER-SERVICE-SCHEMA
      - ARCH-SCHEMA-PAT-006-CRUD-RESOURCE
      - ARCH-SCHEMA-PAT-009-OIDC-BACKEND-SESSION
      - ARCH-SCHEMA-PAT-010-RBAC-POLICY-CHECK
      - ARCH-SCHEMA-PAT-012-ALEMBIC-POSTGRES-CHANGE
      - ARCH-SCHEMA-PAT-020-STATUS-FEEDBACK
      - ARCH-SCHEMA-PAT-024-FULL-STACK-FEATURE-SLICE
      - ARCH-SCHEMA-PAT-025-DEPENDENCY-SUBSTITUTION
      - ARCH-SCHEMA-PAT-026-OUTBOUND-SERVICE-ADAPTER
    required_decision_points:
      - requirement, user outcome, and success and failure scenarios
      - API behavior and canonical serialized JSON field naming
      - applicability of persistence, migration, authorization, ownership scope, cache effects, outbound adapters, empty states, and generated artifacts
      - coherent cache invalidation or update behavior and stale-cache verification when a write changes cached data
      - target dependencies, availability and authorized access, selected modes, and remaining real-integration gaps
      - cross-layer tests, contract evidence, context-appropriate verification, skipped checks, and remaining risks
    adr_triggers:
      - varying materially from selected frontend, backend, persistence, or authorization patterns
      - introducing a breaking serialized API field-name or casing change
      - deferring a required layer, unresolved ownership boundary, authorization decision, or high-risk scenario
      - permitting a development or test substitute in production without an explicit architecture and operational decision

  external-dependency-change:
    description: External or runtime dependency whose real target may be unavailable or outside authorized access in the declared work context.
    applies_when:
      - adding or changing an identity provider, external API, queue, object store, notification service, database, cache, secret store, or other dependency adapter
      - selecting a stub, fake, simulator, local service, or other substitute
      - recording substitute coverage and remaining real-integration verification
    candidate_standards:
      - STD-002
      - STD-012
      - STD-013
      - STD-014
    candidate_patterns:
      - PAT-025
    candidate_controls: []
    candidate_baselines: []
    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-002-WORK-CONTEXTS
      - ARCH-SCHEMA-STD-012-TESTING-BASICS
      - ARCH-SCHEMA-STD-013-SECURITY-PRIVACY-BASICS
      - ARCH-SCHEMA-STD-014-SECRETS-CONFIGURATION
      - ARCH-SCHEMA-PAT-025-DEPENDENCY-SUBSTITUTION
    required_decision_points:
      - work context and solution target as separate decisions
      - target dependency contract, availability, and authorized access
      - explicit real, local, substituted, or unavailable mode and configuration boundary
      - contract and failure parity, production rejection, and remaining real-integration gaps
    adr_triggers:
      - varying a material application contract or required invariant by dependency mode
      - permitting a development or test substitute in production
      - introducing an intentional production alternate implementation or degraded mode
      - durably omitting required real-integration verification

  outbound-service-integration-change:
    description: Backend call to an external API, platform, provider, or hosted service through an application-owned adapter.
    applies_when:
      - adding or changing a backend integration with an external API, platform, provider, or hosted service
      - changing provider requests, responses, authentication, timeouts, retries, error translation, or integration tests
    candidate_standards:
      - STD-002
      - STD-008
      - STD-010
      - STD-011
      - STD-012
      - STD-013
      - STD-014
    candidate_patterns:
      - PAT-005
      - PAT-007
      - PAT-024
      - PAT-025
      - PAT-026
    candidate_controls:
      - GC-WEB-007
      - GC-WEB-010
      - GC-WEB-011
    candidate_baselines:
      - BAS-001
    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-002-WORK-CONTEXTS
      - ARCH-SCHEMA-STD-008-BACKEND-FASTAPI
      - ARCH-SCHEMA-STD-010-API-RESPONSE-ERROR-MODELS
      - ARCH-SCHEMA-STD-011-LOGGING-OBSERVABILITY
      - ARCH-SCHEMA-STD-012-TESTING-BASICS
      - ARCH-SCHEMA-STD-013-SECURITY-PRIVACY-BASICS
      - ARCH-SCHEMA-STD-014-SECRETS-CONFIGURATION
      - ARCH-SCHEMA-PAT-005-ROUTER-SERVICE-SCHEMA
      - ARCH-SCHEMA-PAT-024-FULL-STACK-FEATURE-SLICE
      - ARCH-SCHEMA-PAT-025-DEPENDENCY-SUBSTITUTION
      - ARCH-SCHEMA-PAT-026-OUTBOUND-SERVICE-ADAPTER
      - ARCH-SCHEMA-GC-WEB-007-SECURITY
    required_decision_points:
      - application-owned adapter contract, injection boundary, and service orchestration
      - explicit bounded timeouts and per-operation retry or no-retry behavior
      - idempotency, deduplication, or compensation for retried side effects when applicable
      - stable safe error translation and reviewed allowlist for any upstream fields retained
      - mocked service tests, adapter tests, integration evidence, unavailable checks, and residual risk
    adr_triggers:
      - passing raw upstream error bodies to clients or logs
      - retrying non-idempotent side effects without an idempotency, deduplication, or compensation design
      - coupling domain services directly to a provider SDK or transport model without an application boundary
      - durably omitting required real-provider verification

