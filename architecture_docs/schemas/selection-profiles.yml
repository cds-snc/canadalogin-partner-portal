      - ARCH-SCHEMA-PAT-010-RBAC-POLICY-CHECK
      - ARCH-SCHEMA-PAT-025-DEPENDENCY-SUBSTITUTION
      - ARCH-SCHEMA-GC-WEB-007-SECURITY
    required_decision_points:
      - auth boundary and backend authorization behavior
      - documented local browser hostname and compatible frontend/backend origins, preferring same-origin proxy behavior when appropriate
      - cookie, credentials, CORS, CSRF, login, callback, logout, and redirect verification under the documented hostname
      - role, tenant, workspace, or access context rules
      - identity and role-source availability, selected mode, local role simulation limits, and remaining real-provider verification
      - safe unauthorized and forbidden user feedback
    adr_triggers:
      - selecting or materially changing identity, session, or cloud-security architecture beyond established guidance
      - relying on frontend-only access control
      - using local role simulation outside local development or tests
      - permitting an identity or role substitute in production without an explicit architecture and operational decision

  secrets-or-config-change:
    description: Environment variables, runtime config, CI settings, deployment settings, secrets, or secret lifecycle changes.
