profiles_version: 1
scope: architecture_schema_selection_profiles
description: >
  Common starting points for selecting standards, patterns, controls, baselines,
  and schema contracts. Profiles help agents search faster, but the actual task
  and human-readable guidance still decide what applies.

profiles:
  ui-page-change:
    description: User-facing React or GC Design System page, route, layout, navigation, or shell change.
    applies_when:
      - adding or changing a user-facing page, route, page shell, navigation path, language toggle, or visible UI state
      - selecting a page pattern such as service home, task hub, dashboard, direct task page, form page, or data table page
      - adding a nested TanStack Router child route beneath an existing page route
    candidate_standards:
      - STD-004
      - STD-005
      - STD-006
      - STD-007
      - STD-012
      - STD-017
      - STD-018
    candidate_patterns:
      - PAT-001
      - PAT-013
      - PAT-014
      - PAT-015
      - PAT-020
      - PAT-022
    candidate_controls:
      - GC-WEB-002
      - GC-WEB-003
      - GC-WEB-004
      - GC-WEB-005
    candidate_baselines:
      - BAS-001
    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-004-FRONTEND-REACT-TYPESCRIPT
      - ARCH-SCHEMA-STD-005-FRONTEND-GC-DESIGN-SYSTEM
      - ARCH-SCHEMA-STD-006-GC-UI-PAGE-LAYOUT-RULES
      - ARCH-SCHEMA-STD-007-UI-ACCESSIBILITY-BASICS
      - ARCH-SCHEMA-STD-018-FRONTEND-CSS-DESIGN-SYSTEM-BOUNDARY
      - ARCH-SCHEMA-PAT-001-UI-PAGE-PATTERNS
      - ARCH-SCHEMA-PAT-013-GCDS-REACT-APP-SHELL
      - ARCH-SCHEMA-PAT-014-BILINGUAL-ROUTE-I18N
      - ARCH-SCHEMA-PAT-020-STATUS-FEEDBACK
      - ARCH-SCHEMA-GC-WEB-003-ACCESSIBILITY
    required_decision_points:
      - selected page pattern and route path
      - nested-route parent layout, index render path, and generated route-tree regeneration when applicable
      - shared navigation, breadcrumb, and language-toggle behavior
      - accessibility and design-system review evidence
      - custom UI or layout exceptions
    adr_triggers:
      - not using an applicable page pattern
      - replacing GC Design System shell or components with custom UI
      - intentionally omitting accessibility, bilingual, or page-shell evidence

  frontend-form-change:
    description: User-facing form page, validation, submit behavior, field errors, or form API change.
    applies_when:
      - adding or changing a page that collects user input
      - changing validation, error summary, field-level errors, submit behavior, or server validation handling
    candidate_standards:
