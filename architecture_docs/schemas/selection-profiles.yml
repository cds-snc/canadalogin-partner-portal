      - ARCH-SCHEMA-GC-WEB-007-SECURITY
    required_decision_points:
      - API behavior and contract before implementation
      - canonical serialized JSON field naming across backend, OpenAPI, frontend types, and API clients
      - route, service, schema, dependency, and error boundary
      - outbound adapter, timeout, retry, and safe upstream-error behavior when an external provider is involved
      - authorization and safe error behavior
      - success and failure path tests
    adr_triggers:
      - changing API behavior in a breaking way
      - omitting OpenAPI or contract evidence for meaningful API behavior
      - varying from FastAPI, REST, response, or safe error guidance

  backend-service-change:
    description: Backend service logic, route/service/schema boundary, business behavior, dependencies, or service tests.
    applies_when:
