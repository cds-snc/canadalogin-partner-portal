    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-004-FRONTEND-REACT-TYPESCRIPT
      - ARCH-SCHEMA-STD-007-UI-ACCESSIBILITY-BASICS
      - ARCH-SCHEMA-STD-012-TESTING-BASICS
      - ARCH-SCHEMA-STD-018-FRONTEND-CSS-DESIGN-SYSTEM-BOUNDARY
      - ARCH-SCHEMA-PAT-001-UI-PAGE-PATTERNS
      - ARCH-SCHEMA-PAT-002-API-QUERY-MUTATION
      - ARCH-SCHEMA-PAT-020-STATUS-FEEDBACK
      - ARCH-SCHEMA-PAT-023-FRONTEND-DATA-TABLE
      - ARCH-SCHEMA-GC-WEB-003-ACCESSIBILITY
      - ARCH-SCHEMA-GC-WEB-006-PRIVACY-PERSONAL-INFORMATION
    required_decision_points:
      - whether the data is genuinely tabular
      - table implementation choice
      - sort, filter, pagination, and responsive behavior
      - sensitive data visibility, masking, export, and retention rules
    adr_triggers:
      - using a custom data grid or mixing GCDS and WET or GCWeb table behavior
      - client-side controls for a dataset too large or sensitive for the browser
      - mobile comparison requirements conflict with responsive table behavior

  full-stack-feature-change:
    description: End-to-end user-facing feature that crosses API, backend, optional persistence and authorization, frontend behavior, and verification.
    applies_when:
      - adding or materially changing a user-facing feature backed by an API
      - coordinating requirements, API contracts, backend layers, persistence, authorization, frontend data access, routes, user states, and tests
      - deciding which optional layers, cache effects, outbound integrations, and generated artifacts apply to a feature slice
