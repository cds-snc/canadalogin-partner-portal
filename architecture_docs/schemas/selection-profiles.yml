      - PAT-020
      - PAT-022
    candidate_controls:
      - GC-WEB-003
      - GC-WEB-006
      - GC-WEB-010
    candidate_baselines:
      - BAS-001
    candidate_schema_contracts:
      - ARCH-SCHEMA-STD-004-FRONTEND-REACT-TYPESCRIPT
      - ARCH-SCHEMA-STD-007-UI-ACCESSIBILITY-BASICS
      - ARCH-SCHEMA-STD-010-API-RESPONSE-ERROR-MODELS
      - ARCH-SCHEMA-STD-012-TESTING-BASICS
      - ARCH-SCHEMA-STD-013-SECURITY-PRIVACY-BASICS
      - ARCH-SCHEMA-PAT-001-UI-PAGE-PATTERNS
      - ARCH-SCHEMA-PAT-002-API-QUERY-MUTATION
      - ARCH-SCHEMA-PAT-003-FORM-PAGE
      - ARCH-SCHEMA-PAT-020-STATUS-FEEDBACK
      - ARCH-SCHEMA-GC-WEB-003-ACCESSIBILITY
      - ARCH-SCHEMA-GC-WEB-006-PRIVACY-PERSONAL-INFORMATION
    required_decision_points:
      - form page pattern and whether the form should be split
      - validation and server-side error behavior
      - personal information or secret handling
      - accessibility, mobile, and submit-state evidence
    adr_triggers:
      - collecting personal information without clear handling rules
      - using custom form or error behavior instead of the selected pattern
      - shipping a meaningful form without accessibility or submit verification

  frontend-data-table-change:
    description: User-facing table, sortable/filterable record list, pagination, or table responsive behavior.
    applies_when:
      - showing records with shared attributes in a frontend table
      - adding sorting, filtering, pagination, row actions, missing value behavior, or responsive table behavior
    candidate_standards:
      - STD-004
      - STD-005
