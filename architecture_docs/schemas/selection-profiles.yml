      - ARCH-SCHEMA-STD-020-DATABASE-PERSISTENCE
      - ARCH-SCHEMA-PAT-006-CRUD-RESOURCE
      - ARCH-SCHEMA-PAT-012-ALEMBIC-POSTGRES-CHANGE
      - ARCH-SCHEMA-PAT-024-FULL-STACK-FEATURE-SLICE
      - ARCH-SCHEMA-GC-WEB-006-PRIVACY-PERSONAL-INFORMATION
      - ARCH-SCHEMA-GC-WEB-007-SECURITY
    required_decision_points:
      - data ownership, sensitivity, retention, audit, and delete behavior
      - migration, rollback, backfill, and deployment sequencing
      - configured Alembic version_num capacity, revision lookup, and truncation verification
      - cache applicability, coherent invalidation or update, and stale-cache prevention
      - API schema versus ORM model separation
      - tenant or workspace ownership enforcement
    adr_triggers:
      - skipping migrations for shared or production database state
      - exposing internal IDs in public APIs
      - using hard delete where retention or audit review would normally apply
      - proceeding with unknown data ownership or retention behavior

  auth-or-access-change:
    description: Authentication, authorization, roles, access checks, protected routes, identity data, or privileged actions.
    applies_when:
      - changing sign-in, sessions, roles, authorization, protected UI, access-scoped data, or privileged actions
      - changing identity or access behavior in shared or production contexts
      - changing local cookie-session frontend or backend hostnames, credentials, CORS, CSRF posture, or redirects
    candidate_standards:
