schema_id: ARCH-SCHEMA-PAT-024-FULL-STACK-FEATURE-SLICE
schema_version: "0.3"
title: Full-Stack Feature Slice Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-024
owner_doc_type: pattern
owner_doc_path: docs/patterns/full-stack/pat-024-full-stack-feature-slice.md

summary: >
  Helps agents and reviewers keep requirements, API contracts, backend layers,
  persistence, authorization, frontend behavior, write-path cache consistency,
  user states, tests, generated artifacts, dependency modes, and
  context-appropriate verification coherent for an end-to-end feature slice.

categories:
  - full-stack
  - frontend
  - backend
  - api
  - data
  - security
  - testing
search_keywords:
  - full stack feature
  - vertical slice
  - feature slice
  - api contract
  - serialized json
  - repository
  - migration
  - authorization
  - typed api client
  - query hook
  - generated artifact
  - contract test
  - dependency availability
  - dependency substitution
  - adapter
  - context appropriate verification
  - cache invalidation
  - stale cache
applies_when:
  - a new or materially changed user-facing feature crosses frontend and backend boundaries
  - requirements, API contracts, persistence, authorization, and user states need coordinated delivery
  - several layer-specific patterns must be applied as one reviewable slice
do_not_use_when:
  - the change is isolated copy, documentation, styling, static content, or a single-layer adjustment
  - the work is only a scaffold or placeholder and does not deliver usable end-to-end behavior
  - data ownership, authorization, API behavior, or required outcomes are too unclear to define the slice

work_contexts:
  - local_developer
  - shared_non_production
  - production
