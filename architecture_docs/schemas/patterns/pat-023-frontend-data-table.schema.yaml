  - BAS-001

required_inputs:
  - id: table_decision_scope
    description: Table purpose, records, columns, row identity, implementation choice, controls, responsive behavior, and privacy rules.
    required: true
    source: design note, implementation plan, PR, issue, table component, or changed files
  - id: table_review_evidence
    description: Tests, screenshots, keyboard review, screen-reader review, responsive review, and custom styling review.
    required: true
    source: test output, Storybook fixture, screenshots, accessibility review, or verification note

checks:
  - id: tabular-data-decision
    description: The data is genuinely tabular and the project records why a table, not a card group or summary display, fits the task.
    required: true
    check_type: human_review
    evidence:
      - Table decision, design note, implementation note, PR description, or verification note.
    failure_means: A table may be used for layout, navigation, or non-tabular content.
    adr_required_when: A custom table or data-grid alternative is selected for a standard tabular task.
    waiver_allowed: true

  - id: implementation-choice-recorded
    description: The table uses GCDS table where it fits, or records an approved semantic table, WET, GCWeb, or data-grid decision.
    required: true
    check_type: content_review
    evidence:
      - Component review, implementation choice note, ADR, custom CSS review, or verification note.
    failure_means: Table styling or behavior may drift from Government of Canada and accessibility expectations.
    adr_required_when: The project intentionally uses custom table styling, WET/GCWeb behavior in a GCDS app, or a complex grid.
    waiver_allowed: true

  - id: table-anatomy-accessible
    description: Table anatomy includes accessible caption or heading, headers, row identity, missing value text, meaningful links or actions, and no images of tabular data.
    required: true
    check_type: human_review
    evidence:
      - Component review, screenshot, accessibility checklist, screen-reader review, or verification note.
    failure_means: Users may not understand table relationships or missing values.
    adr_required_when: Complex headers, merged cells, nested tables, or unusual structure are used.
    waiver_allowed: true

  - id: controls-fit-task-and-data-size
    description: Sorting, filtering, pagination, page size, URL state, and server-side controls are included only when they support the user task and data size.
    required: true
    check_type: content_review
    evidence:
      - Table control design, query behavior, tests, route state review, or verification note.
    failure_means: Controls may create inaccessible, slow, or privacy-risky data behavior.
    adr_required_when: The dataset is too large for client-side controls or an All page-size option without review.
    waiver_allowed: true

  - id: responsive-accessibility-privacy-evidence
    description: Desktop, mobile, keyboard, screen-reader, custom styling, and privacy review evidence exists for meaningful user-facing tables.
    required: true
    check_type: evidence_required
    evidence:
      - Desktop screenshot, mobile screenshot, keyboard review, screen-reader review, privacy review, Storybook fixture, or verification note.
    failure_means: Tables may clip content, hide needed columns, expose sensitive data, or break keyboard and screen-reader behavior.
    adr_required_when: Mobile users must compare columns hidden by responsive behavior or sensitive table data lacks visibility rules.
    waiver_allowed: true

outputs:
  - id: frontend_data_table_review_summary
    description: Review result showing table decision, implementation choice, table anatomy, controls, responsive behavior, accessibility, privacy, screenshots, and tests.

evidence_expectations:
  - Screenshots show desktop and mobile behavior with no clipped headers, overlapping controls, or unreadable cells.
  - Keyboard and screen-reader review covers controls, row links, row actions, headers, and accessible name.
  - Sensitive table data has visibility, masking, export, and retention expectations before implementation proceeds.

adr_triggers:
  - Project needs complex data-grid behavior.
  - Project mixes GCDS and WET or GCWeb table behavior without an approved frontend architecture decision.
  - Mobile comparison needs conflict with responsive table behavior.
  - Sensitive, personal, security, audit, or financial fields lack visibility or masking rules.

waiver_guidance:
  - Delivery waivers for deferred table tests, screenshots, accessibility review, or privacy review belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-023. PAT-023 remains the source of truth.
