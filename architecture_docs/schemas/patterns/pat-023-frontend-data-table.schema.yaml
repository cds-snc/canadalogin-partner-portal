schema_id: ARCH-SCHEMA-PAT-023-FRONTEND-DATA-TABLE
schema_version: "0.1"
title: Frontend Data Table Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-023
owner_doc_type: pattern
owner_doc_path: docs/patterns/design/pat-023-frontend-data-table.md

summary: >
  Helps agents and reviewers check tabular data decisions, GC Design System or
  approved table implementation, table anatomy, row and column behavior,
  filtering, sorting, pagination, responsive behavior, accessibility, privacy,
  screenshots, and tests.

categories:
  - design-system
  - frontend
  - accessibility
  - testing
search_keywords:
  - data table
  - frontend data table
  - gcds table
  - table
  - sort
  - filter
  - pagination
  - row action
  - responsive table
  - accessibility
applies_when:
  - a user-facing frontend shows records with shared attributes
  - users need to scan, compare, sort, filter, or page through related data
  - a table includes links, row actions, status text, missing values, or responsive behavior that needs review
do_not_use_when:
  - the page shows facts about one item or a short item summary
  - the repeated values are editable in place
  - the component is a complex data grid with row selection, bulk actions, inline editing, virtual scrolling, frozen columns, or spreadsheet-like navigation
  - data model, labels, mobile task, privacy, visibility, masking, export, or retention rules are unclear

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - css
artifact_types:
  - data_table
  - frontend_component
  - table_columns
  - table_controls
  - storybook_fixture
  - frontend_test
  - screenshot
  - verification_note
  - adr

