schema_id: ARCH-SCHEMA-PAT-013-GCDS-REACT-APP-SHELL
schema_version: "0.1"
title: GC Design System React App Shell Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-013
owner_doc_type: pattern
owner_doc_path: docs/patterns/frontend/pat-013-gcds-react-app-shell.md

summary: >
  Helps agents and reviewers check a shared React GC Design System app shell,
  CSS import, route metadata, header, footer, top navigation, language toggle,
  breadcrumbs, main content target, authenticated account summary, screenshots,
  keyboard review, and accessibility evidence.

categories:
  - frontend
  - design-system
  - accessibility
search_keywords:
  - gc design system
  - gcds
  - react app shell
  - header
  - footer
  - top navigation
  - language toggle
  - breadcrumbs
  - route metadata
  - skip link
applies_when:
  - a React frontend uses GC Design System React components
  - scaffolding or regenerating a React frontend that needs a Government of Canada page shell
  - adding or changing shared navigation, language behavior, breadcrumbs, layout structure, or account summary
do_not_use_when:
  - the project intentionally uses GCWeb, WET, or another approved shell and has recorded the decision
  - the page is not user-facing and does not need Government of Canada page structure

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - canada.ca
artifact_types:
  - app_shell
  - root_layout
  - header
  - footer
  - route_metadata
  - navigation
  - screenshot
  - verification_note
  - adr

related_standards:
  - STD-004
  - STD-005
  - STD-006
  - STD-007
  - STD-018
related_patterns:
  - PAT-001
  - PAT-014
  - PAT-015
  - PAT-020
related_controls:
  - GC-WEB-002
  - GC-WEB-003
  - GC-WEB-004
  - GC-WEB-005
related_baselines:
  - BAS-001

required_inputs:
  - id: shell_scope
    description: Shared layout, header, footer, route metadata, top navigation, language behavior, breadcrumbs, account summary, and affected routes.
    required: true
    source: implementation plan, route file, layout files, PR, issue, or changed files
  - id: shell_review_evidence
    description: Screenshots, keyboard review, accessibility review, route reachability, and hidden-route exceptions.
    required: true
    source: screenshots, tests, Storybook fixture, accessibility checklist, or verification note

checks:
  - id: single-gcds-css-import-and-providers
    description: The frontend imports GC Design System CSS once and mounts routes inside the required application providers.
    required: true
    check_type: file_review
    evidence:
      - frontend entry point, provider tree, route mount, code review, or verification note.
    failure_means: Design-system styling or route context may be inconsistent.
    adr_required_when: A project intentionally loads design-system CSS or application providers through a different shell pattern.
    waiver_allowed: true

  - id: shared-shell-owns-chrome
    description: Shared layout owns header, footer, top navigation, language toggle, skip target, breadcrumbs when needed, and main content container.
    required: true
    check_type: content_review
    evidence:
      - RootLayout, Header, TopNav, Footer, screenshots, or verification note.
    failure_means: Pages may rebuild shell behavior inconsistently.
    adr_required_when: A project intentionally puts shared shell controls in page bodies or uses a different shell structure.
    waiver_allowed: true

  - id: route-metadata-and-reachability
    description: User-facing routes have route metadata and are reachable through Home, shared navigation, parent task area, or a recorded hidden-route exception.
    required: true
    check_type: content_review
    evidence:
      - Route metadata, navigation links, route tests, screenshots, or hidden-route exception.
    failure_means: Pages may be undiscoverable or inconsistent with breadcrumbs and analytics.
    adr_required_when: The navigation model cannot expose Home or primary tasks without an information-architecture decision.
    waiver_allowed: true

  - id: language-and-account-behavior-safe
    description: Language toggle behavior and authenticated account summary are safe, useful, and avoid tokens, raw claims, internal IDs, and sensitive personal information.
    required: true
    check_type: human_review
    evidence:
      - Header review, account summary review, route tests, screenshots, or verification note.
    failure_means: Language switching or account context may confuse users or expose sensitive details.
    adr_required_when: Language switching can lose unsaved input or account context is intentionally omitted when it affects the experience.
    waiver_allowed: true

  - id: shell-accessibility-and-screenshot-evidence
    description: Desktop, mobile, keyboard, and accessibility review evidence shows header, menu, language toggle, content, account summary when applicable, and footer.
    required: true
    check_type: evidence_required
    evidence:
      - Desktop screenshot, mobile screenshot, keyboard review, accessibility review, test output, or verification note.
    failure_means: Shared navigation, focus order, language behavior, or shell layout issues may be missed.
    adr_required_when: Meaningful app shell review evidence is intentionally omitted.
    waiver_allowed: true

outputs:
  - id: gcds_react_shell_review_summary
    description: Review result showing CSS import, shared shell, route metadata, navigation, language behavior, account summary, screenshots, keyboard review, and accessibility evidence.

evidence_expectations:
  - Screenshots show shared shell behavior on desktop and mobile.
  - Keyboard and accessibility review cover skip link, navigation, language toggle, content, account controls, and footer.
  - Hidden-route exceptions and single-page rationales are recorded.

adr_triggers:
  - Project uses GCWeb, WET, or another shell instead of the GCDS React shell.
  - Navigation cannot expose Home or primary tasks without an information-architecture decision.
  - Language switching can lose unsaved user input without selected mitigation.

waiver_guidance:
  - Delivery waivers for deferred screenshots, keyboard review, or accessibility evidence belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-013. PAT-013 remains the source of truth.
