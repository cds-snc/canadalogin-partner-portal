schema_id: ARCH-SCHEMA-PAT-026-OUTBOUND-SERVICE-ADAPTER
schema_version: "0.1"
title: Outbound Service Adapter Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-026
owner_doc_type: pattern
owner_doc_path: docs/patterns/backend/pat-026-outbound-service-adapter.md

summary: >
  Helps agents and reviewers check product-neutral outbound adapter boundaries,
  dependency injection, service orchestration, timeout and retry decisions,
  safe provider-error translation, allowlisted upstream fields, tests, and
  integration verification.

categories:
  - backend
  - api
  - operations
  - security
  - testing
search_keywords:
  - outbound service
  - external api
  - provider adapter
  - gateway
  - dependency injection
  - timeout
  - retry
  - idempotency
  - upstream error
  - error allowlist
  - mock adapter
applies_when:
  - a backend service calls an external API, platform, provider, or hosted service
  - provider-specific requests, responses, authentication, errors, timeouts, or retries need an application boundary
  - business behavior that depends on an external service needs isolated unit tests
do_not_use_when:
  - the dependency is an in-process library with no network or provider boundary
  - the work only accesses the application's own database through its persistence boundary
  - a browser calls a third party directly and needs a separate browser trust and cross-origin review

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - backend
  - external_api
  - http
artifact_types:
  - outbound_adapter
  - service
  - dependency
  - error_translation
  - backend_test
  - integration_test
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-008
  - STD-010
  - STD-011
  - STD-012
  - STD-013
  - STD-014
related_patterns:
  - PAT-005
  - PAT-007
  - PAT-024
  - PAT-025
related_controls:
  - GC-WEB-007
  - GC-WEB-010
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: outbound_operation_scope
    description: Application operations, provider calls, data, credentials, work context, and external side effects in scope.
    required: true
    source: implementation plan, API contract, architecture note, issue, or changed files
  - id: resilience_decisions
    description: Explicit timeout and per-operation retry or no-retry decisions, including idempotency, deduplication, or compensation where relevant.
    required: true
    source: adapter configuration, service design, tests, ADR, or verification note
  - id: upstream_error_review
    description: Stable application error mapping and any specifically reviewed, allowlisted upstream fields.
    required: true
    source: error contract, adapter review, security review, tests, or verification note

checks:
  - id: injected-adapter-service-boundary
    description: Provider access is behind a small adapter that is injected into a service, while business rules and orchestration remain outside provider-specific code.
    required: true
    check_type: file_review
    evidence:
      - Adapter interface and implementation, service constructor or provider, dependency wiring, or architecture review note.
    failure_means: Business behavior may be coupled to a provider SDK, wire contract, or network dependency.
    adr_required_when: A project intentionally couples nontrivial business behavior directly to a provider client.
    waiver_allowed: true

  - id: timeouts-and-retry-decision
    description: Outbound operations have explicit bounded timeouts and a reviewed retry or no-retry decision based on transient-failure and duplicate-effect safety.
    required: true
    check_type: evidence_required
    evidence:
      - Client configuration, operation policy, retry limits, idempotency design, tests, ADR, or verification note.
    failure_means: Requests may hang, overload a provider, or duplicate external side effects.
    adr_required_when: A project intentionally uses unbounded calls or retries a non-idempotent operation without a duplicate-safety mechanism.
    waiver_allowed: false

  - id: centralized-safe-error-translation
    description: One reviewed adapter boundary maps provider failures to stable application errors and prohibits raw upstream error-body pass-through.
    required: true
    check_type: content_review
    evidence:
      - Error translator, application error types, handler review, API tests, log review, or verification note.
    failure_means: Clients or logs may expose secrets, personal information, internal identifiers, or unstable provider details.
    adr_required_when: A project proposes exposing upstream-provided error detail beyond specifically reviewed and allowlisted fields.
    waiver_allowed: false

  - id: upstream-fields-reviewed-and-allowlisted
    description: Each upstream-provided field exposed through an application error is named, reviewed for safety and stability, and explicitly allowlisted.
    required: true
    applies_when:
      - an application error includes detail derived from an upstream response
    check_type: human_review
    evidence:
      - Field allowlist, error contract, security or privacy review, tests, or verification note.
    failure_means: Raw or unreviewed provider data may cross the application trust boundary.
    adr_required_when: A project intentionally exposes an upstream field with unresolved sensitivity or contract-stability risk.
    waiver_allowed: false

  - id: isolated-service-and-adapter-tests
    description: Service tests use a mock, fake, or stub adapter, and adapter tests cover mapping, timeout, retry or no-retry, malformed response, and safe failure behavior as applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Unit tests, mock or fake adapter, adapter tests, test output, or verification note.
    failure_means: Business behavior may require a real provider to test, or provider failure behavior may regress.
    adr_required_when: A project intentionally ships a meaningful outbound integration without isolated service and adapter verification.
    waiver_allowed: true

  - id: real-integration-scope-controlled
    description: Real-provider checks are separate from unit tests and run only with an approved target, credentials, data, side-effect, and cleanup scope.
    required: true
    check_type: evidence_required
    evidence:
      - Marked integration test, sandbox target note, skipped-check reason, cleanup record, or verification note.
    failure_means: Tests may mutate an external system or expose credentials and data without clear authorization.
    adr_required_when: Real-provider verification proceeds with unresolved target, credential, data, or side-effect ownership.
    waiver_allowed: false

outputs:
  - id: outbound_adapter_review_summary
    description: Review result showing adapter and service boundaries, resilience decisions, safe error translation, allowlisted fields, tests, and integration scope.

evidence_expectations:
  - Provider-specific calls and translations stay behind an injected adapter boundary.
  - Timeout and retry or no-retry decisions are visible for meaningful operations.
  - Raw upstream error bodies are not returned or logged; exposed upstream fields are specifically reviewed and allowlisted.
  - Service tests run without network access and adapter failure paths have focused verification.
  - Unavailable or skipped real-provider checks and remaining risks are recorded.

adr_triggers:
  - Project couples business behavior directly to a provider SDK or raw HTTP client.
  - Project uses unbounded outbound calls or retries non-idempotent writes without duplicate safety.
  - Project proposes raw upstream error-body pass-through or exposes upstream fields without a reviewed allowlist.
  - Real-provider work proceeds with unresolved credentials, data, side effects, or external-system ownership.

waiver_guidance:
  - Delivery waivers for unavailable provider integration checks belong in the project-local Delorean evidence process when a gate requires one.
  - Waivers must not permit raw upstream error-body exposure, secret leakage, or unbounded outbound calls.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-026. PAT-026 remains the source of truth.
  - Adapter placement is project-defined; this contract does not require a repositories directory or a specific provider, SDK, or framework.
