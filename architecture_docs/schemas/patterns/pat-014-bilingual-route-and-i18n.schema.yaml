schema_id: ARCH-SCHEMA-PAT-014-BILINGUAL-ROUTE-I18N
schema_version: "0.1"
title: Bilingual Route and I18n Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-014
owner_doc_type: pattern
owner_doc_path: docs/patterns/frontend/pat-014-bilingual-route-and-i18n.md

summary: >
  Helps agents and reviewers check English and French route parity, typed route
  helpers, aligned i18n resources, page title and metadata parity, breadcrumb
  and navigation labels, language-toggle behavior, html language updates, and
  unsaved-input mitigation.

categories:
  - frontend
  - design-system
  - accessibility
search_keywords:
  - bilingual
  - i18n
  - official languages
  - language toggle
  - english
  - french
  - route parity
  - page title
  - breadcrumbs
  - locale resources
applies_when:
  - a frontend has English and French routes or content
  - the page shell includes a Government of Canada language toggle
  - page titles, breadcrumbs, navigation labels, forms, errors, or success messages need translation
do_not_use_when:
  - the application is intentionally single-language and has recorded that decision
  - language is controlled by an upstream platform and routes cannot include a language segment

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - i18n
artifact_types:
  - route_metadata
  - i18n_resource
  - language_toggle
  - breadcrumb
  - frontend_test
  - screenshot
  - verification_note
  - adr

related_standards:
  - STD-004
  - STD-005
  - STD-006
  - STD-007
  - STD-012
related_patterns:
  - PAT-001
  - PAT-013
  - PAT-015
  - PAT-020
related_controls:
  - GC-WEB-002
  - GC-WEB-003
  - GC-WEB-004
related_baselines:
  - BAS-001

required_inputs:
  - id: bilingual_route_scope
    description: English and French routes, route IDs, route helpers, language toggle behavior, and equivalent or parent fallback pages.
    required: true
    source: route metadata, route helpers, Header component, implementation plan, PR, or changed files
  - id: i18n_resource_scope
    description: Locale namespaces, page titles, breadcrumbs, navigation labels, form labels, errors, success messages, and missing-key review.
    required: true
    source: locale files, i18n setup, screenshots, tests, or verification note

checks:
  - id: english-french-route-parity
    description: English and French routes exist for bilingual pages, or a documented parent fallback exists when a direct equivalent page does not.
    required: true
    check_type: content_review
    evidence:
      - Route metadata, route tests, language-toggle mapping, screenshots, or verification note.
    failure_means: Users may lose context or reach missing pages when switching languages.
    adr_required_when: Equivalent route behavior is ambiguous or intentionally incomplete.
    waiver_allowed: true

  - id: route-helper-source-of-truth
    description: Links use route IDs or a typed path helper instead of hard-coded bilingual paths scattered through components.
    required: true
    check_type: file_review
    evidence:
      - Route helper, route metadata, link review, tests, or documented exception.
    failure_means: Bilingual links may drift across pages and languages.
    adr_required_when: A project intentionally uses a different route-linking pattern.
    waiver_allowed: true

  - id: locale-resources-aligned
    description: English and French locale resources are aligned for page titles, breadcrumbs, navigation labels, forms, errors, success messages, and status states.
    required: true
    check_type: content_review
    evidence:
      - Locale files, missing-key tests, i18n review, screenshots, or verification note.
    failure_means: Users may see missing, mismatched, or untranslated interface text.
    adr_required_when: Translation ownership or review responsibility is unknown.
    waiver_allowed: true

  - id: language-toggle-and-html-lang
    description: Header language toggle reaches the equivalent route or documented parent, and route changes update html language.
    required: true
    check_type: evidence_required
    evidence:
      - Header tests, route tests, screenshots, DOM review, or verification note.
    failure_means: Assistive technology, language switching, and official-language behavior may be incorrect.
    adr_required_when: Language is controlled by an upstream platform or cannot be represented in routes.
    waiver_allowed: true

  - id: unsaved-input-mitigation
    description: Flows that can lose unsaved user input during language switching have a selected mitigation.
    required: true
    check_type: human_review
    evidence:
      - Form review, mitigation note, ADR, test, or verification note.
    failure_means: Users may lose entered data or personal information when switching languages.
    adr_required_when: Language switching can lose unsaved personal information and no mitigation is selected.
    waiver_allowed: false

outputs:
  - id: bilingual_i18n_review_summary
    description: Review result showing route parity, route helpers, locale resource alignment, metadata parity, language-toggle behavior, html language updates, and unsaved-input mitigation.

evidence_expectations:
  - Screenshots cover at least one English route and one French route with the language toggle.
  - Missing translation keys are visible in tests or review.
  - Parent fallbacks and unsaved-input mitigations are recorded when needed.

adr_triggers:
  - Application is intentionally single-language.
  - Equivalent route behavior is ambiguous or intentionally incomplete.
  - Language switching can lose unsaved personal information without mitigation.
  - Translation ownership or review responsibility is unknown.

waiver_guidance:
  - Delivery waivers for deferred bilingual screenshots, missing-key checks, or language-toggle tests belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-014. PAT-014 remains the source of truth.
