schema_id: ARCH-SCHEMA-PAT-012-ALEMBIC-POSTGRES-CHANGE
schema_version: "0.3"
title: Alembic PostgreSQL Change Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-012
owner_doc_type: pattern
owner_doc_path: docs/patterns/data/pat-012-alembic-postgres-change.md

summary: >
  Helps agents and reviewers check PostgreSQL schema-change ownership,
  SQLAlchemy model updates, Alembic migrations, data-loss and rollback review,
  revision identifier storage and lookup, seed data safety, deployment
  sequencing, and test evidence.

categories:
  - data
  - backend
  - operations
  - testing
search_keywords:
  - migration
  - alembic
  - postgres
  - sqlalchemy
  - database
  - rollback
  - downgrade
  - data loss
  - backfill
  - deployment order
  - revision identifier
  - version_num
  - alembic_version
  - truncation
applies_when:
  - changing PostgreSQL schema with Alembic
  - adding, modifying, or removing tables, columns, indexes, constraints, seed data, or reference data
  - coordinating backend models, migrations, tests, deployment notes, rollback, or data conversion
  - reviewing revision identifier capacity, storage, or migration graph resolution
do_not_use_when:
  - the backend is intentionally database-free
  - the project does not use PostgreSQL or Alembic
  - destructive, large, or high-risk data migration needs a separate rollout decision first

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - postgres
  - sqlalchemy
  - alembic
  - fastapi
artifact_types:
  - database_model
  - migration
  - seed_data
  - repository
  - backend_test
  - deployment_note
  - verification_note
  - adr

related_standards:
  - STD-008
  - STD-012
  - STD-013
  - STD-014
  - STD-020
related_patterns:
  - PAT-006
  - PAT-008
  - PAT-024
related_controls:
  - GC-WEB-006
  - GC-WEB-007
  - GC-WEB-009
related_baselines:
  - BAS-001

required_inputs:
  - id: migration_scope
    description: Tables, columns, indexes, constraints, seed data, data conversion, revision identifiers, model updates, and service behavior changed.
    required: true
    source: implementation plan, migration file, model files, PR, issue, or architecture note
  - id: safety_review_scope
    description: Ownership, retention, data loss, downgrade or rollback, backfill, and deployment order assumptions.
    required: true
    source: migration review note, ADR, deployment note, verification note, or PR description
  - id: revision_storage_scope
    description: Configured Alembic version table, version_num capacity, new revision identifier, and migration graph resolution evidence.
    required: true
    source: Alembic configuration, migration environment, database metadata, migration file, command output, or verification note

checks:
  - id: data-model-ownership-recorded
    description: Data model ownership, retention, sensitivity, and lifecycle expectations are visible before the migration is accepted.
    required: true
    check_type: human_review
    evidence:
      - Architecture note, ADR, data handling record, model review, or verification note.
    failure_means: Schema changes may conflict with privacy, audit, retention, or ownership expectations.
    adr_required_when: Data model ownership, retention, or delete behavior is unclear or materially changing.
    waiver_allowed: false

  - id: migration-file-reviewed
    description: Alembic migration code is reviewed for indexes, foreign keys, unique constraints, nullability, seed data, and unintended changes.
    required: true
    check_type: file_review
    evidence:
      - Migration file, model diff, migration review note, or verification note.
    failure_means: Generated migration code may not match intended database behavior.
    adr_required_when: A project intentionally skips migration review for shared or production database changes.
    waiver_allowed: true

  - id: revision-identifier-capacity-and-resolution
    description: Every new Alembic revision identifier fits the configured capacity of alembic_version.version_num or the corresponding version_num column in a customized version table, and migration verification proves that the full identifier is stored and resolves without truncation or revision lookup failures.
    required: true
    check_type: evidence_required
    evidence:
      - Migration file, version-table configuration or database metadata, representative migration application or graph-resolution result, exact stored revision, or verification note.
    failure_means: Migration application may reject or truncate the identifier, or Alembic may be unable to locate the stored revision.
    adr_required_when: A project changes version-table storage or revision identifier conventions as a durable migration-system decision.
    waiver_allowed: false

  - id: data-loss-backfill-rollback-considered
    description: Data loss, destructive operations, non-null additions, backfills, seed cleanup, downgrade, and rollback expectations are considered.
    required: true
    check_type: human_review
    evidence:
      - Migration review note, deployment note, ADR, test output, or verification note.
    failure_means: Migration may fail, lose data, or block rollback in shared or production environments.
    adr_required_when: Destructive, large, or high-risk data change proceeds without a separate rollout decision.
    waiver_allowed: true

  - id: migration-and-model-tests
    description: Tests or verification cover migration application, full revision storage and lookup, model constraints, service behavior, ownership checks, and seed idempotency when applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Pytest output, migration application result, repository tests, service tests, API tests, or verification note.
    failure_means: Database behavior may drift from application behavior or fail during deployment.
    adr_required_when: A meaningful schema change ships without model, migration, or service verification.
    waiver_allowed: true

  - id: deployment-order-notes
    description: Deployment sequencing notes exist for destructive, large, backfilled, or shared and production database changes.
    required: true
    check_type: evidence_required
    evidence:
      - Deployment note, expand/backfill/contract plan, release note, ADR, or verification note.
    failure_means: Application code and database state may become incompatible during rollout.
    adr_required_when: Shared or production migration order is risky or intentionally deferred.
    waiver_allowed: true

outputs:
  - id: alembic_postgres_review_summary
    description: Review result showing data ownership, migration code review, configured revision capacity and resolution, rollback or downgrade consideration, tests, and deployment sequencing.

evidence_expectations:
  - Migration review notes cover constraints, nullability, indexes, data conversion, data loss, and downgrade or rollback expectations.
  - Revision verification records the configured version_num capacity and proves the full identifier is stored and resolves without truncation or lookup failure.
  - Tests or verification cover model and service behavior affected by the schema change.
  - Destructive or large changes have a rollout decision before release.

adr_triggers:
  - Data ownership, retention, rollback, or data conversion rules are unclear.
  - Destructive, large, or backfilled changes proceed without a normal safe rollout.
  - Project skips Alembic migrations for shared or production database state.

waiver_guidance:
  - Delivery waivers for deferred migration tests, review notes, or deployment sequencing evidence belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-012. PAT-012 remains the source of truth.
