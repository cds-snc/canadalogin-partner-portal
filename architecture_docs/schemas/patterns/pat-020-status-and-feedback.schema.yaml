schema_id: ARCH-SCHEMA-PAT-020-STATUS-FEEDBACK
schema_version: "0.2"
title: Status and Feedback Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-020
owner_doc_type: pattern
owner_doc_path: docs/patterns/design/pat-020-status-and-feedback.md

summary: >
  Helps agents and reviewers check loading, empty, error, warning, success,
  unauthorized, and service-disruption state decisions, placement, safe copy,
  recovery actions, accessibility, bilingual evidence, and tests.

categories:
  - design-system
  - frontend
  - accessibility
  - testing
search_keywords:
  - status message
  - feedback
  - loading state
  - empty state
  - error state
  - success message
  - unauthorized
  - service disruption
  - error summary
  - recovery action
applies_when:
  - a page reads, creates, updates, deletes, submits, refreshes, or shows asynchronous state
  - a user action needs success, warning, error, unauthorized, service disruption, or next-step feedback
  - loading, empty, error, status, recovery, or bilingual feedback states change
do_not_use_when:
  - the message is ordinary instructional content that belongs in the page body
  - the issue is only a field-level validation problem covered by a form pattern
  - safe error wording or disclosure rules are unclear for a sensitive state

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - i18n
artifact_types:
  - frontend_component
  - status_state
  - notice
  - error_summary
  - storybook_fixture
  - frontend_test
  - screenshot
  - verification_note
  - adr

related_standards:
  - STD-004
  - STD-005
  - STD-006
  - STD-007
  - STD-010
  - STD-012
  - STD-013
related_patterns:
  - PAT-001
  - PAT-002
  - PAT-003
  - PAT-004
  - PAT-010
  - PAT-015
  - PAT-019
  - PAT-021
  - PAT-022
  - PAT-024
related_controls:
  - GC-WEB-003
  - GC-WEB-006
  - GC-WEB-007
related_baselines:
  - BAS-001

required_inputs:
  - id: status_state_scope
    description: Loading, empty, error, warning, success, unauthorized, disruption, recovery, and next-step states changed.
    required: true
    source: implementation plan, UI design, page code, Storybook fixture, PR, or changed files
  - id: safe_copy_and_placement
    description: State classification, message placement, safe wording, recovery action, and bilingual copy when applicable.
    required: true
    source: content review, screenshots, i18n resources, accessibility review, or verification note

checks:
  - id: state-classified-before-component-choice
    description: Loading, empty, info, warning, danger, success, unauthorized, and disruption states are classified before selecting component and placement.
    required: true
    check_type: content_review
    evidence:
      - State decision, implementation note, page review, Storybook fixture, or verification note.
    failure_means: Feedback may be over-prominent, under-prominent, or placed at the wrong scope.
    adr_required_when: A sensitive or service-wide state uses a custom feedback pattern.
    waiver_allowed: true

  - id: placement-and-recovery-clear
    description: Messages are placed at the affected scope and include a meaningful heading, concise explanation, and recovery action or next step when one exists.
    required: true
    check_type: human_review
    evidence:
      - Screenshot, content review, component review, accessibility review, or verification note.
    failure_means: Users may not understand what happened or how to recover.
    adr_required_when: A state intentionally lacks a recovery path, owner, or next-step decision.
    waiver_allowed: true

  - id: safe-error-wording
    description: Error, unauthorized, security, privacy, and service-disruption messages use safe wording that does not reveal sensitive implementation details.
    required: true
    check_type: human_review
    evidence:
      - Error copy review, safe error model, security/privacy review, screenshot, or verification note.
    failure_means: Feedback may expose sensitive details or mislead users.
    adr_required_when: Safe wording is unclear for a security, privacy, authorization, or disruption state.
    waiver_allowed: false

  - id: state-tests-and-review-fixtures
    description: Meaningful loading, empty, error, unauthorized, and success states have tests, Storybook fixtures, screenshots, or verification evidence.
    required: true
    check_type: evidence_required
    evidence:
      - Frontend tests, Storybook fixture, screenshots, Playwright check, or verification note.
    failure_means: Important UI states may be unreachable, stale, or unreviewed.
    adr_required_when: A meaningful user-facing state ships without test or review evidence.
    waiver_allowed: true

  - id: accessibility-and-bilingual-review
    description: Keyboard, screen-reader, mobile, and bilingual behavior is reviewed for meaningful user-facing status states when applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Keyboard review, screen-reader review, mobile screenshot, locale files, bilingual screenshot, or verification note.
    failure_means: Users may miss or misunderstand important state changes.
    adr_required_when: Bilingual or accessibility evidence is intentionally deferred for a meaningful user-facing status state.
    waiver_allowed: true

outputs:
  - id: status_feedback_review_summary
    description: Review result showing state classification, placement, safe copy, recovery action, stale notice handling, tests, accessibility, and bilingual evidence.

evidence_expectations:
  - Meaningful states are shown in screenshots, Storybook fixtures, tests, or verification notes.
  - Sensitive states have safe wording and escalation where needed.
  - Recovery links and actions are tested or reviewed.

adr_triggers:
  - Safe error wording is unclear for security, privacy, authorization, or service-disruption states.
  - A service disruption needs operational approval or service-wide communication decision.
  - A state changes data or access and lacks audit, recovery, or confirmation rules.

waiver_guidance:
  - Delivery waivers for deferred status-state tests, screenshots, or accessibility evidence belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-020. PAT-020 remains the source of truth.
