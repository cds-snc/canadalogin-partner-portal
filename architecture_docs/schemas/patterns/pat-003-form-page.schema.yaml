schema_id: ARCH-SCHEMA-PAT-003-FORM-PAGE
schema_version: "0.1"
title: Form Page Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-003
owner_doc_type: pattern
owner_doc_path: docs/patterns/frontend/pat-003-form-page.md

summary: >
  Helps agents and reviewers check form page selection, validation, error
  summary and field-level error behavior, submit behavior, safe server errors,
  input preservation, accessibility evidence, and tests.

categories:
  - frontend
  - design-system
  - accessibility
  - api
  - testing
search_keywords:
  - form
  - form page
  - validation
  - error summary
  - field error
  - submit behavior
  - react hook form
  - zod
  - accessibility
  - gc design system
applies_when:
  - a user-facing page collects input and submits it to an API
  - validation, error recovery, confirmation, or input preservation matters to the user
  - form components, submit requests, server validation errors, or form tests change
do_not_use_when:
  - the page only displays content
  - the form is part of a larger multi-step workflow that needs a separate flow decision

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - react-hook-form
  - zod
artifact_types:
  - form_page
  - frontend_component
  - validation_schema
  - api_client
  - frontend_test
  - screenshot
  - verification_note
  - adr

related_standards:
  - STD-004
  - STD-005
  - STD-006
  - STD-007
  - STD-010
  - STD-012
  - STD-013
related_patterns:
  - PAT-001
  - PAT-002
  - PAT-019
  - PAT-020
  - PAT-022
related_controls:
  - GC-WEB-003
  - GC-WEB-006
related_baselines:
  - BAS-001

required_inputs:
  - id: form_scope
    description: Fields, validation rules, submit endpoint, success state, failure states, and personal or sensitive data handled by the form.
    required: true
    source: implementation plan, form design, API contract, PR, issue, or changed files
  - id: validation_and_error_behavior
    description: Client validation, server validation, error summary, field-level errors, and preservation behavior.
    required: true
    source: validation schema, form component, tests, screenshots, or verification note

checks:
  - id: form-pattern-decision-recorded
    description: The form page pattern and any decision to split or keep the form on one page are recorded.
    required: true
    check_type: evidence_required
    evidence:
      - Page pattern decision, implementation note, ADR, PR description, or verification note.
    failure_means: Form length, validation recovery, and page structure may be unclear.
    adr_required_when: A long, conditional, sensitive, or consequential form intentionally avoids a multi-step or split-page decision.
    waiver_allowed: true

  - id: validation-defined
    description: Required fields and invalid values have client-side validation where useful and server-side validation remains authoritative.
    required: true
    check_type: content_review
    evidence:
      - Validation schema, form code, server validation behavior, tests, or verification note.
    failure_means: Users may submit invalid data or receive inconsistent validation feedback.
    adr_required_when: Validation rules are intentionally deferred or policy-sensitive validation is undefined.
    waiver_allowed: true

  - id: error-summary-field-errors
    description: Submit failures display an accessible error summary and field-level errors where applicable.
    required: true
    check_type: human_review
    evidence:
      - Form component review, screenshot, accessibility checklist, test, Storybook fixture, or verification note.
    failure_means: Users may not understand which fields failed or how to recover.
    adr_required_when: The project intentionally uses a different error presentation pattern for forms.
    waiver_allowed: true

  - id: submit-behavior-safe-and-reviewable
    description: Submission sends the expected payload, handles server validation safely, preserves input on failure, and reaches the expected success state.
    required: true
    check_type: evidence_required
    evidence:
      - API helper test, form test, server validation test, screenshot, or verification note.
    failure_means: Form submissions may lose user input, expose unsafe errors, or send the wrong payload.
    adr_required_when: A project intentionally drops input on failure or changes consequential submit behavior without recovery.
    waiver_allowed: true

  - id: accessibility-review-evidence
    description: Meaningful user-facing forms have accessibility review evidence for labels, grouping, focus behavior, errors, keyboard access, and mobile layout.
    required: true
    check_type: evidence_required
    evidence:
      - Accessibility checklist, keyboard review, screenshots, automated scan, Storybook fixture, or verification note.
    failure_means: The form may be difficult or impossible to complete for some users.
    adr_required_when: Accessibility evidence is intentionally omitted for a meaningful user-facing form.
    waiver_allowed: true

outputs:
  - id: form_page_review_summary
    description: Review result showing form pattern decision, validation, error handling, submit behavior, accessibility evidence, and tests.

evidence_expectations:
  - Validation and submit behavior have tests or verification evidence.
  - Error summary and field-level behavior are visible in screenshots or review notes.
  - Personal information or secrets in forms have data-handling evidence.

adr_triggers:
  - Project intentionally varies from GC Design System form components or error behavior.
  - A sensitive, consequential, long, or conditional form skips a flow or split decision.
  - Validation rules, personal information handling, or recovery behavior are unclear.

waiver_guidance:
  - Delivery waivers for missing form tests, screenshots, or accessibility evidence belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-003. PAT-003 remains the source of truth.
