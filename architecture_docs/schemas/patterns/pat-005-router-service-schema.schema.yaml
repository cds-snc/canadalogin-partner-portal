schema_id: ARCH-SCHEMA-PAT-005-ROUTER-SERVICE-SCHEMA
schema_version: "0.3"
title: Router, Service, Schema Pattern Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-005
owner_doc_type: pattern
owner_doc_path: docs/patterns/backend/pat-005-router-service-schema.md

summary: >
  Helps agents and reviewers check backend route, service, schema, dependency,
  error, OpenAPI, and test boundaries for endpoint work.

categories:
  - backend
  - api
  - testing
search_keywords:
  - router service schema
  - fastapi
  - router
  - service layer
  - pydantic
  - dependency
  - outbound adapter
  - response model
  - safe error
  - openapi
  - pytest
applies_when:
  - adding or changing a backend endpoint or endpoint group
  - route behavior, request models, response models, dependencies, service logic, or error handling need a clear boundary
  - backend route tests, service tests, or OpenAPI output change
do_not_use_when:
  - the route is a one-line health check with no behavior or dependency needs
  - the project has an approved alternate backend structure decision

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - fastapi
  - pydantic
  - python
  - openapi
artifact_types:
  - backend_router
  - service
  - pydantic_model
  - dependency
  - api_endpoint
  - openapi_contract
  - backend_test
  - verification_note
  - adr

related_standards:
  - STD-008
  - STD-009
  - STD-010
  - STD-012
  - STD-013
related_patterns:
  - PAT-002
  - PAT-006
  - PAT-024
  - PAT-026
related_controls:
  - GC-WEB-007
  - GC-WEB-010
related_baselines:
  - BAS-001

required_inputs:
  - id: endpoint_scope
    description: Endpoint group, request and response models, dependencies, service behavior, errors, auth expectations, and tests changed.
    required: true
    source: implementation plan, API contract, PR, issue, or changed files
  - id: boundary_decision
    description: Router, service, schema, dependency, and error boundary evidence or documented reason the full split does not apply.
    required: true
    source: code review, implementation note, ADR, OpenAPI output, tests, or verification note

checks:
  - id: router-service-schema-boundaries
    description: Backend work uses clear router, service, and schema boundaries for nontrivial endpoint behavior.
    required: true
    check_type: file_review
    evidence:
      - Router file, service file, Pydantic schema file, code review, or documented exception.
    failure_means: HTTP concerns, business behavior, and API contracts may be hard to review and test.
    adr_required_when: A project intentionally keeps nontrivial service behavior or schema contracts inside route handlers.
    waiver_allowed: true

  - id: dependency-and-auth-boundaries
    description: Dependencies, authorization expectations, and service providers are visible and not hidden inside page-specific route code.
    required: true
    check_type: content_review
    evidence:
      - Dependency module, route dependencies, service provider, authorization note, tests, or verification note.
    failure_means: Auth, ownership, or dependency behavior may be unclear.
    adr_required_when: Authorization, data ownership, or dependency semantics are unclear or intentionally varied.
    waiver_allowed: false

  - id: outbound-adapter-selected-when-applicable
    description: Endpoint behavior that calls an external API or provider delegates through an injected adapter and service boundary described by PAT-026.
    required: true
    applies_when:
      - endpoint or service behavior calls an external API, platform, provider, or hosted service
    check_type: file_review
    evidence:
      - Route-to-service handoff, injected adapter, dependency wiring, tests, or documented exception.
    failure_means: Provider-specific calls, failure behavior, or credentials may leak into route and business logic.
    adr_required_when: A project intentionally calls a provider SDK or raw HTTP client directly from a nontrivial route.
    waiver_allowed: true

  - id: response-and-error-contracts
    description: Expected responses and safe client errors are represented through response models, error handlers, examples, or OpenAPI evidence.
    required: true
    check_type: evidence_required
    evidence:
      - Response model, error model, OpenAPI output, endpoint tests, or verification note.
    failure_means: API consumers may receive inconsistent or unsafe responses.
    adr_required_when: A project intentionally omits response or safe error contracts for meaningful endpoints.
    waiver_allowed: true

  - id: route-service-tests
    description: Tests or verification cover route response behavior, core service behavior, expected client errors, and important failure paths.
    required: true
    check_type: evidence_required
    evidence:
      - Pytest output, route tests, service tests, failure path tests, or verification note.
    failure_means: Endpoint behavior and error paths may regress.
    adr_required_when: A meaningful backend endpoint ships without route or service verification.
    waiver_allowed: true

  - id: openapi-refreshed-when-needed
    description: OpenAPI output or API contract evidence is refreshed when routes, models, or error shapes change.
    required: true
    check_type: evidence_required
    evidence:
      - OpenAPI diff, exported contract, API examples, PR note, or verification note.
    failure_means: API clients and reviewers may rely on stale contract information.
    adr_required_when: A project intentionally changes route shape without OpenAPI or equivalent contract evidence.
    waiver_allowed: true

outputs:
  - id: router_service_schema_review_summary
    description: Review result showing router, service, schema, dependency, error, OpenAPI, and test boundaries.

evidence_expectations:
  - Nontrivial endpoints show route, service, schema, and dependency ownership.
  - Outbound provider calls use the PAT-026 adapter boundary when applicable.
  - Expected responses, safe errors, and OpenAPI evidence are visible where applicable.
  - Authorization, data ownership, and external systems are clarified before implementation proceeds.

adr_triggers:
  - Project intentionally varies from router, service, and schema separation.
  - Authorization, data ownership, or error semantics are unclear but work proceeds.
  - The route touches real external systems or secrets without a separate decision.

waiver_guidance:
  - Delivery waivers for missing route tests, service tests, or contract evidence belong in the project-local Delorean evidence process.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports PAT-005. PAT-005 remains the source of truth.
