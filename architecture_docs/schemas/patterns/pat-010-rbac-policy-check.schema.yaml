schema_id: ARCH-SCHEMA-PAT-010-RBAC-POLICY-CHECK
schema_version: "0.1"
title: RBAC Policy Check Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-010
owner_doc_type: pattern
owner_doc_path: docs/patterns/security/pat-010-rbac-policy-check.md

summary: >
  Helps agents and reviewers check policy definition, policy-store
  initialization, server-side enforcement, object or tenant boundaries, safe
  failures, and positive and negative authorization tests.

categories:
  - security
  - backend
  - api
  - testing
search_keywords:
  - rbac
  - authorization
  - policy
  - permission
  - role
  - seed
  - bootstrap
  - tenant boundary
  - ownership
  - object level authorization
applies_when:
  - a protected resource or action introduces or changes a role, permission, policy, or ownership rule
  - policy seed, bootstrap, migration, or configuration data may be required
  - object-level, tenant-level, workspace-level, or ownership access is reviewed
do_not_use_when:
  - the route is public
  - authentication alone is sufficient and no role, permission, or resource scope applies

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - fastapi
  - rest
artifact_types:
  - authorization_policy
  - policy_seed
  - backend_dependency
  - service
  - api_endpoint
  - backend_test
  - verification_note
  - adr

related_standards:
  - STD-008
  - STD-012
  - STD-013
  - STD-020
related_patterns:
  - PAT-004
  - PAT-008
  - PAT-009
  - PAT-018
  - PAT-024
related_controls:
  - GC-WEB-007
  - GC-WEB-008
related_baselines:
  - BAS-001

required_inputs:
  - id: authorization_scope
    description: Protected resources and actions, subjects, roles or permissions, policy owner, and enforcement boundary.
    required: true
    source: API contract, architecture note, ADR, implementation plan, issue, or policy definition
  - id: resource_scope
    description: Applicability decision for object, tenant, workspace, or ownership boundaries, including trusted enforcement attributes or the reason no resource scope applies.
    required: true
    source: data model, service rules, policy definition, or authorization design

checks:
  - id: policy-definition-complete
    description: The protected resource, action, role or permission, policy owner, and decision semantics are defined.
    required: true
    check_type: content_review
    evidence:
      - Policy definition, API contract, architecture note, ADR, or implementation plan.
    failure_means: Enforcement may depend on scattered or ambiguous role logic.
    adr_required_when: The project intentionally uses a different access-control model or decision boundary.
    waiver_allowed: false

  - id: policy-store-initialization-considered
    description: Seed, bootstrap, migration, or configuration data is added when the selected policy store requires it, or is explicitly not applicable.
    required: true
    check_type: file_review
    evidence:
      - Idempotent seed, bootstrap, migration, policy configuration, initializer output, or not-applicable rationale.
    failure_means: Deployed enforcement may deny every request or omit the intended policy.
    adr_required_when: Required policy data is intentionally managed through a different reviewed lifecycle.
    waiver_allowed: false

  - id: server-side-enforcement-present
    description: The selected service, dependency, or route boundary enforces the policy before protected data or behavior is exposed.
    required: true
    check_type: file_review
    evidence:
      - Authorization dependency, service check, route enforcement, or policy adapter.
    failure_means: A defined policy may not protect the actual resource or action.
    adr_required_when: Never; protected resources and actions require server-side enforcement.
    waiver_allowed: false

  - id: resource-boundaries-enforced
    description: Object, tenant, workspace, and ownership boundaries are enforced where applicable, rather than relying only on coarse role membership.
    required: true
    check_type: human_review
    evidence:
      - Scoped query, ownership check, tenant key, trusted policy attributes, and wrong-owner or wrong-tenant tests.
    failure_means: A user with a valid role may access another user's or tenant's resource.
    adr_required_when: A project intentionally uses role-only access where resource scope would normally apply.
    waiver_allowed: false

  - id: safe-authorization-failures
    description: Missing authentication and denied authorization fail closed with safe responses that do not reveal sensitive resource details.
    required: true
    check_type: content_review
    evidence:
      - Error models, service or route behavior, and tests for missing and denied access.
    failure_means: Authorization may fail open or disclose protected resource existence or details.
    adr_required_when: Never; authorization failures must remain safe.
    waiver_allowed: false

  - id: authorization-tests-complete
    description: Tests cover anonymous, insufficient permission, wrong resource scope, allowed access, and untrusted client-supplied role or ownership values when applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Authorization test output, policy tests, API tests, service tests, or verification note.
    failure_means: Policy definition, initialization, and enforcement may drift or regress.
    adr_required_when: A meaningful protected resource or action ships without positive and negative authorization tests.
    waiver_allowed: true

outputs:
  - id: rbac_policy_review_summary
    description: Review result showing policy definition, initialization, enforcement, resource scope, safe failures, and authorization tests.

evidence_expectations:
  - Every new protected resource or action has a visible policy and enforcement path.
  - Policy initialization is present or explicitly not applicable for the selected policy implementation.
  - Positive and negative tests cover role and resource-scope decisions.

adr_triggers:
  - Project selects a different access-control model or policy lifecycle.
  - Project relies on coarse roles despite object, tenant, workspace, or ownership scope.
  - Policy ownership or source of truth materially changes.

waiver_guidance:
  - Delivery waivers for deferred non-critical evidence belong in the project-local Delorean evidence process.
  - Waivers must not permit missing server enforcement, fail-open behavior, or unclear ownership boundaries.

notes:
  - This pattern is implementation-neutral; a project may use a policy engine, application policy module, or another reviewed approach.
  - This schema contract supports PAT-010. PAT-010 remains the source of truth.
