schema_id: ARCH-SCHEMA-PAT-009-OIDC-BACKEND-SESSION
schema_version: "0.1"
title: OIDC Backend Session Schema Contract
status: active
schema_type: pattern

owner_doc_id: PAT-009
owner_doc_type: pattern
owner_doc_path: docs/patterns/security/pat-009-oidc-backend-session.md

summary: >
  Helps agents and reviewers check an OIDC browser-to-backend session boundary,
  server-side token and session handling, cookie security, local hostname
  consistency, credentials, CORS, CSRF posture, redirects, logout, provider and
  session-store modes, and verification.

categories:
  - security
  - backend
  - frontend
  - operations
  - testing
search_keywords:
  - oidc
  - backend session
  - server-side session
  - session cookie
  - HttpOnly
  - SameSite
  - Secure cookie
  - localhost
  - 127.0.0.1
  - local hostname
  - same origin
  - development proxy
  - credentials include
  - credentialed CORS
  - CSRF
  - login redirect
  - logout
  - session store
  - provider simulator
applies_when:
  - browser users authenticate through OIDC and the backend owns the application session
  - access, refresh, or ID tokens must remain outside browser-managed storage
  - frontend and backend local origins, cookie behavior, credentials, CORS, CSRF posture, or auth redirects are designed or changed
  - provider or session-store implementations are selected or substituted
do_not_use_when:
  - the caller is a machine-to-machine client with no browser session
  - the application is static and has no backend session boundary
  - only simulated local roles are needed and OIDC protocol behavior is not in scope

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - oidc
  - browser
  - backend-session
  - rest
artifact_types:
  - auth_route
  - session_store
  - session_cookie_configuration
  - cors_configuration
  - api_client
  - frontend_test
  - backend_test
  - integration_test
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-003
  - STD-004
  - STD-008
  - STD-012
  - STD-013
  - STD-014
related_patterns:
  - PAT-004
  - PAT-010
  - PAT-011
  - PAT-018
  - PAT-024
  - PAT-025
related_controls:
  - GC-WEB-007
  - GC-WEB-008
related_baselines:
  - BAS-001

required_inputs:
  - id: oidc_session_scope
    description: Provider boundary, browser and backend responsibilities, token handling, session endpoints, roles, expiry, logout, and protected backend behavior.
    required: true
    source: auth design, implementation plan, route and service code, configuration, tests, or verification note
  - id: provider_and_session_store_decision
    description: Selected provider and session-store modes, topology assumptions, explicit substitutions, and real-integration behavior that remains unverified.
    required: true
    source: architecture note, configuration, dependency composition, deployment design, tests, or verification note
  - id: cookie_and_local_origin_plan
    description: Cookie attributes and the documented browser-facing frontend, API, login, callback, logout, and post-authentication redirect origins, including a local not-applicable rationale when local browser sessions are not used.
    required: true
    source: auth design, local setup documentation, frontend API configuration, backend CORS and cookie configuration, or verification note
  - id: csrf_and_redirect_posture
    description: CSRF controls for state-changing cookie-authenticated requests and the allowed redirect behavior for login, callback, logout, and post-authentication navigation.
    required: true
    source: security review, request validation, cookie and origin configuration, redirect allowlist, tests, or verification note

checks:
  - id: sensitive-tokens-remain-server-side
    description: Sensitive OIDC access, refresh, and ID tokens remain in trusted backend handling and are not stored in browser local storage or exposed through the session response.
    required: true
    check_type: file_review
    evidence:
      - Provider callback and session implementation, response models, browser storage inspection, frontend tests, or verification note.
    failure_means: Sensitive provider tokens may be exposed to browser script, persistence, or unintended clients.
    adr_required_when: Never; the backend-session pattern requires sensitive provider tokens to remain outside browser-managed storage.
    waiver_allowed: false

  - id: oidc-validation-and-provider-mode-fail-closed
    description: The backend validates issuer, audience, state, nonce, redirect URI, and provider responses, while provider modes and substitutes are selected explicitly and cannot activate after missing configuration or runtime failure.
    required: true
    check_type: content_review
    evidence:
      - OIDC library configuration, callback validation, provider composition, negative tests, substitution configuration, or verification note.
    failure_means: Login may accept an invalid response or silently use an unintended identity implementation.
    adr_required_when: A project intentionally varies from required OIDC validation or provider fail-closed behavior.
    waiver_allowed: false

  - id: server-side-session-store-and-cookie-policy
    description: The backend owns session state, selects a store whose expiry, revocation, concurrency, and topology fit the target, and applies explicit HttpOnly, SameSite, Secure, domain, path, and lifetime cookie decisions.
    required: true
    check_type: human_review
    evidence:
      - Session middleware, store configuration, deployment topology, cookie settings, expiry and revocation tests, or architecture note.
    failure_means: Sessions may leak, persist unexpectedly, fail across instances, or use cookie attributes that do not match the environment.
    adr_required_when: The project selects a materially different session or cookie security boundary.
    waiver_allowed: false

  - id: local-cookie-session-hostnames-compatible
    description: Local browser-visible frontend, API, login, callback, logout, and post-authentication redirect URLs use one documented hostname or an explicitly compatible cookie-domain design, without localhost and 127.0.0.1 drift.
    required: true
    applies_when:
      - a cookie-backed browser session is run or verified in local development
    check_type: evidence_required
    evidence:
      - Local setup documentation, API base URL, dev-server or proxy configuration, cookie configuration, redirect configuration, browser test, or verification note.
    failure_means: The browser may accept a cookie for one host but omit it from session, protected-route, callback, or logout requests made to the other host.
    adr_required_when: A project intentionally uses multiple local browser-facing hosts and documents a compatible cookie and origin design.
    waiver_allowed: false

  - id: same-origin-or-credentialed-cors-aligned
    description: Local development uses same-origin or proxy behavior when appropriate; otherwise the browser request mode, exact allowed frontend origin, backend credential support, and cookie attributes are configured as one cross-origin session design.
    required: true
    applies_when:
      - browser requests participate in the backend cookie-session design
    check_type: content_review
    evidence:
      - Development proxy or same-origin configuration, frontend request helper, exact CORS origin and credential settings, cookie settings, tests, or verification note.
    failure_means: Session cookies may be omitted or rejected, or credentialed requests may be exposed through an unsafe or incompatible CORS policy.
    adr_required_when: The project selects a different reviewed browser-to-backend session transport.
    waiver_allowed: false

  - id: credentials-limited-to-cookie-session-requests
    description: Cross-origin requests participating in the cookie-session design use the required credential mode, while unrelated API clients are not required to include browser credentials.
    required: true
    check_type: file_review
    evidence:
      - Shared session request helper, client configuration, request tests, or documented same-origin behavior.
    failure_means: Session requests may omit their cookie, or unrelated clients may send ambient browser credentials unnecessarily.
    adr_required_when: A project intentionally applies browser credentials beyond its documented cookie-session boundary.
    waiver_allowed: false

  - id: csrf-posture-and-auth-redirects-verified
    description: State-changing cookie-authenticated requests have a reviewed CSRF posture, and login, callback, logout, and post-authentication redirects use reviewed destinations under the documented origin design.
    required: true
    check_type: human_review
    evidence:
      - SameSite and origin policy, CSRF control, redirect URI configuration or allowlist, negative tests, browser verification, or security review.
    failure_means: Ambient cookies may authorize unintended state changes or authentication redirects may leave the reviewed trust boundary.
    adr_required_when: The project accepts a materially different CSRF or redirect risk posture.
    waiver_allowed: false

  - id: logout-expiry-and-backend-enforcement
    description: Logout clears or invalidates the application session, expiry and revocation work with the selected store, and protected backend routes reject missing, expired, revoked, or insufficient sessions.
    required: true
    check_type: evidence_required
    evidence:
      - Logout, expiry, revocation, session endpoint, and protected backend route tests.
    failure_means: Sessions may remain usable after logout or expiry, or protected behavior may rely on frontend checks.
    adr_required_when: Never; backend session invalidation and protected-resource enforcement remain authoritative.
    waiver_allowed: false

  - id: local-and-target-session-verification-recorded
    description: Verification records the exercised provider and session-store modes and, when local browser sessions apply, proves cookie acceptance, credentialed requests, CORS, CSRF posture, and redirects under the documented hostname.
    required: true
    check_type: evidence_required
    evidence:
      - Frontend and backend auth tests, browser or integration result, cookie inspection, verification note, skipped checks, and remaining real-provider or deployed-store risks.
    failure_means: A locally working login path may hide hostname, cookie, origin, provider, or deployed-session gaps.
    adr_required_when: A project intentionally ships a material session change without reviewable verification.
    waiver_allowed: true

outputs:
  - id: oidc_backend_session_review_summary
    description: Review result showing the provider and session boundary, token handling, store and cookie decisions, local origin consistency, credentials, CORS, CSRF posture, redirects, enforcement, tests, and remaining risks.

evidence_expectations:
  - Sensitive provider tokens remain outside browser-managed storage and session responses.
  - Provider validation, explicit implementation modes, session-store behavior, and fail-closed substitution are reviewable.
  - When a local cookie-backed browser session is used, verification uses the documented hostname and covers cookie set, send, expiry, and clear behavior.
  - Same-origin or cross-origin credential and CORS behavior, CSRF posture, and auth redirects are verified together.
  - Skipped real-provider, shared-environment, or deployed-store checks and their remaining risks are recorded.

adr_triggers:
  - Sensitive provider tokens are exposed to browser-managed storage.
  - The project materially varies from the backend-owned session, cookie security, CSRF, redirect, expiry, revocation, or provider validation boundary.
  - Multiple local browser-facing hosts require a deliberate cookie-domain and origin design.
  - A provider or session-store substitute is selected for a target where its limitations materially affect the architecture.

waiver_guidance:
  - A project-local waiver may cover a specifically deferred browser, real-provider, shared-environment, or deployed-store verification item when the remaining risk and owner are recorded.
  - Waivers must not permit browser token storage, silent provider fallback, unsafe credentialed CORS, frontend-only enforcement, or unresolved CSRF and redirect boundaries.

notes:
  - Credential inclusion applies only to browser requests participating in this cookie-session design.
  - Localhost and 127.0.0.1 are separate cookie hosts even when both resolve to loopback.
  - This schema contract supports PAT-009. PAT-009 remains the source of truth.
