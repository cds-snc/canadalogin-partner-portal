schema_id: ARCH-SCHEMA-STD-013-SECURITY-PRIVACY-BASICS
schema_version: "0.2"
title: Security and Privacy Basics Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-013
owner_doc_type: standard
owner_doc_path: docs/standards/std-013-security-and-privacy-basics.md

summary: >
  Helps agents and reviewers check sensitive data handling, input validation,
  authorization, safe errors, privacy impact, audit and logging review, local
  exposure, security-sensitive dependency substitution, and decision points for
  material security, privacy, or production-impacting work.

categories:
  - security-privacy
  - backend
  - frontend
  - api
  - data
  - operations
search_keywords:
  - security
  - privacy
  - sensitive data
  - personal information
  - input validation
  - authorization
  - safe errors
  - audit
  - logging
  - dependency substitution
  - identity simulator
  - explicit configuration
  - fail closed
  - production data
  - human decision
applies_when:
  - changing authentication, authorization, API access, user data, sensitive data, logging, dependencies, or verification
  - reviewing privacy impact, safe errors, local network exposure, audit behavior, or sensitive data handling records
  - using a substitute for an identity, session, database, policy, secret, or cloud-security dependency
  - deciding whether a security-sensitive or privacy-sensitive change needs a human architecture decision
do_not_use_when:
  - the change has no security, privacy, data, auth, logging, dependency, network exposure, or verification impact
  - a deeper project-specific security or privacy review already records equivalent evidence for the selected standard

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - fastapi
  - postgres
  - containers
artifact_types:
  - sensitive_data_record
  - api_endpoint
  - authorization_rule
  - error_model
  - log_event
  - database_model
  - dependency_adapter
  - configuration
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-010
  - STD-011
  - STD-013
  - STD-014
  - STD-016
  - STD-020
related_patterns:
  - PAT-002
  - PAT-005
  - PAT-006
  - PAT-008
  - PAT-009
  - PAT-011
  - PAT-012
  - PAT-018
  - PAT-025
related_controls:
  - GC-WEB-006
  - GC-WEB-007
  - GC-WEB-008
  - GC-WEB-009
  - GC-WEB-010
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: security_privacy_change_scope
    description: Description of changed auth, authorization, API, UI, data, logging, dependency, local exposure, or verification behavior.
    required: true
    source: implementation plan, PR, issue, standards impact note, or changed files
  - id: sensitive_data_handling
    description: Sensitive data handling record or documented reason one is not needed.
    required: true
    source: sensitive data record, architecture note, ADR, privacy review, implementation note, or verification note
  - id: selected_security_architecture_and_modes
    description: Applicable standard, pattern, project architecture, or decision plus any explicitly configured real, substituted, or unavailable security-sensitive dependency modes.
    required: false
    source: project architecture, implementation plan, configuration, dependency provider, ADR, or verification note

checks:
  - id: sensitive-data-identified
    description: Sensitive data elements are identified, classified, and recorded when the change introduces or changes them.
    required: true
    check_type: human_review
    evidence:
      - Sensitive data handling record, architecture note, privacy review, ADR, or verification note.
    failure_means: Personal information, secrets, audit records, or identifiers may be mishandled.
    adr_required_when: The project accepts unknown classification, retention, or handling behavior for sensitive data.
    waiver_allowed: false

  - id: input-validation-reviewed
    description: External input is validated at trust boundaries and unsafe values are rejected or normalized before use.
    required: true
    check_type: content_review
    evidence:
      - API model review, form validation review, service checks, validation tests, or verification note.
    failure_means: Invalid or malicious input may reach business logic, persistence, logs, or downstream systems.
    adr_required_when: A project intentionally relies on downstream validation for an exposed boundary.
    waiver_allowed: true

  - id: authorization-reviewed
    description: Access to data and actions is authorized before exposure, mutation, export, or privileged operation.
    required: true
    check_type: human_review
    evidence:
      - Authorization rule review, service tests, API tests, role matrix, ADR, or verification note.
    failure_means: Users, services, or jobs may access data or actions they should not.
    adr_required_when: A project intentionally defers or varies authorization behavior for a protected action or record.
    waiver_allowed: false

  - id: safe-errors-reviewed
    description: Client-facing errors and validation errors do not expose stack traces, secrets, internals, or sensitive personal information.
    required: true
    check_type: content_review
    evidence:
      - Error handler review, response model review, tests, examples, or verification note.
    failure_means: Error responses may disclose sensitive information or implementation details.
    adr_required_when: A project intentionally exposes additional diagnostic detail to clients for a narrowed approved purpose.
    waiver_allowed: false

  - id: privacy-impact-considered
    description: Privacy impact is considered for changes involving personal information, sensitive identifiers, logs, exports, or shared and production data.
    required: true
    check_type: human_review
    evidence:
      - Privacy review, standards impact note, sensitive data handling record, ADR, or verification note.
    failure_means: Privacy risks, retention needs, and collection limits may be hidden.
    adr_required_when: A project intentionally accepts a privacy trade-off or uses production data in local or test environments.
    waiver_allowed: false

  - id: audit-and-logging-reviewed
    description: Audit, logging, and operational diagnostics are reviewed for both usefulness and protection of sensitive data.
    required: true
    check_type: human_review
    evidence:
      - Logging review, audit record review, tests, sample events, runbook note, or verification note.
    failure_means: Security-relevant events may be missing or logs may disclose sensitive information.
    adr_required_when: The project accepts a known audit or logging gap for security-relevant behavior.
    waiver_allowed: true

  - id: local-services-not-broadly-exposed-by-default
    description: Local development servers and local container host ports bind to 127.0.0.1 by default unless broader exposure is intentionally needed.
    required: true
    applies_when:
      - context_type is local_developer and a local service or host port is started
    check_type: file_review
    evidence:
      - Dev server config, Docker run command, compose file, Makefile, script review, or verification note.
    failure_means: Local development services may be exposed to the network without a decision.
    adr_required_when: A project intentionally exposes local services beyond loopback for a durable workflow.
    waiver_allowed: true

  - id: security-sensitive-substitutes-preserve-boundaries
    description: Substituted identity, session, database, policy, secret, or cloud-security dependencies preserve the selected application-owned trust, authorization, validation, audit, and failure boundaries and cannot activate silently outside approved contexts.
    required: true
    applies_when:
      - a security-sensitive dependency uses a stub, fake, simulator, local service, or other substitute
    check_type: human_review
    evidence:
      - Selected architecture, dependency adapter, session or policy boundary, configuration, contract and authorization tests, production rejection test, and remaining real-integration gaps.
    failure_means: A substitute may bypass a security or privacy invariant, conceal an outage, or leak into shared or production behavior.
    adr_required_when: A project intentionally weakens a selected security boundary or permits an alternate production implementation or degraded mode.
    waiver_allowed: false

  - id: sensitive-or-production-impact-human-decision
    description: Material changes to security, privacy, identity, session, database, cloud-security, or production behavior identify the applicable standard, pattern, project architecture, decision, or approval. Implementing an already selected architecture does not require a new ADR solely because real integration code is added.
    required: true
    check_type: human_review
    evidence:
      - Applicable standard or pattern, project architecture, ADR, standards impact note, approval record, baseline assessment, verification note, or project-local waiver when a gate requires it.
    failure_means: High-risk changes may proceed without visible ownership or decision records.
    adr_required_when: The change selects or materially varies identity, session, database, cloud-security, production-data, or privacy architecture beyond established guidance.
    waiver_allowed: true

outputs:
  - id: security_privacy_review_summary
    description: Review result showing sensitive data handling, validation, authorization, safe errors, privacy impact, audit/logging review, local exposure, dependency substitution, and decision records.

evidence_expectations:
  - Sensitive data handling records are present when the change introduces or changes sensitive data.
  - Security-relevant success and failure paths have tests or verification notes.
  - Security-sensitive substitutes and remaining real-integration gaps are visible when used.
  - Established guidance or human decisions are visible for material identity, session, database, cloud-security, production-data, or privacy architecture changes.

adr_triggers:
  - Project uses production data in local or test environments.
  - Project intentionally varies from expected authorization, validation, safe error, sensitive data, or local exposure behavior.
  - Project accepts privacy, audit, logging, identity, data retention, or production-impact risk.
  - Project selects or materially changes identity, session, database, or cloud-security architecture beyond established standards, patterns, or project architecture.
  - Production intentionally permits a security-sensitive substitute or degraded mode.

waiver_guidance:
  - Delivery waivers for deferred security, privacy, test, or approval evidence belong in the project-local Delorean evidence process.
  - Waivers must not hide sensitive data, production data, authorization, privacy, audit risk, or silent substitute activation.
  - This schema contract does not define runtime waiver records.

notes:
  - Accessing real providers, credentials, data, or infrastructure remains governed by STD-002 even when implementation of the selected architecture is in scope.
  - This schema contract supports STD-013. STD-013 remains the source of truth.
