schema_id: ARCH-SCHEMA-STD-008-BACKEND-FASTAPI
schema_version: "0.3"
title: Backend FastAPI Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-008
owner_doc_type: standard
owner_doc_path: docs/standards/std-008-backend-fastapi.md

summary: >
  Helps agents and reviewers check FastAPI backend structure, routers,
  Pydantic request and response models, thin handlers, service boundaries,
  outbound adapter boundaries, safe and explicit dependency configuration,
  substitute boundaries, local role simulation limits, OpenAPI output, and
  success and failure path tests.

categories:
  - backend
  - api
  - data
  - security-privacy
  - testing
search_keywords:
  - fastapi
  - pydantic
  - response model
  - router
  - service layer
  - outbound adapter
  - external api
  - timeout
  - upstream error
  - openapi
  - configuration
  - dependency availability
  - dependency substitution
  - adapter
  - simulator
  - local role simulation
  - success path
  - failure path
applies_when:
  - adding or changing FastAPI routes, services, models, dependencies, or config
  - changing backend error handling, OpenAPI output, persistence, auth boundaries, or outbound integrations
  - a selected backend dependency may be unavailable or outside authorized access
  - reviewing backend tests or service structure
do_not_use_when:
  - the backend does not use FastAPI and has a different approved backend framework decision
  - the change has no backend route, service, model, config, OpenAPI, auth, persistence, or test impact

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - fastapi
  - pydantic
  - python
artifact_types:
  - backend_router
  - api_endpoint
  - pydantic_model
  - service
  - outbound_adapter
  - config
  - openapi_contract
  - backend_test
  - dependency_adapter
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-003
  - STD-008
  - STD-009
  - STD-010
  - STD-012
  - STD-013
  - STD-020
related_patterns:
  - PAT-005
  - PAT-006
  - PAT-009
