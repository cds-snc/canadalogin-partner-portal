schema_id: ARCH-SCHEMA-STD-007-UI-ACCESSIBILITY-BASICS
schema_version: "0.1"
title: UI Accessibility Basics Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-007
owner_doc_type: standard
owner_doc_path: docs/standards/std-007-ui-accessibility-basics.md

summary: >
  Helps agents and reviewers record accessibility checks for headings, labels,
  keyboard behavior, focus, errors, status messages, contrast, semantic review,
  and exception or verification triggers for user-facing UI work.

categories:
  - accessibility
  - frontend
  - design-system
  - governance
search_keywords:
  - accessibility
  - headings
  - labels
  - keyboard
  - focus
  - errors
  - status messages
  - contrast
  - screen reader
  - semantic html
  - form
  - verification
applies_when:
  - reviewing labels, headings, keyboard behavior, focus, contrast, errors, or status messages
  - changing user-facing UI content or layout
  - checking accessibility for pages, forms, controls, or navigation
do_not_use_when:
  - the change has no user-facing UI, content, interaction, document, media, or navigation impact

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - html
artifact_types:
  - frontend_page
  - frontend_component
  - form
  - accessibility_review
  - verification_note
  - adr

related_standards:
  - STD-005
  - STD-006
  - STD-007
  - STD-017
  - STD-018
related_patterns:
  - PAT-001
  - PAT-003
  - PAT-013
  - PAT-014
  - PAT-015
  - PAT-019
  - PAT-020
related_controls:
  - GC-WEB-003
  - GC-WEB-005
related_baselines:
  - BAS-001

required_inputs:
  - id: accessibility_scope
    description: Description of user-facing UI, content, controls, forms, errors, status messages, or navigation changed.
    required: true
    source: plan, PR, issue, screenshots, review fixture, or changed files
  - id: accessibility_evidence
    description: Review evidence such as keyboard check, labels review, focus review, contrast review, semantic review, screenshots, or verification note.
    required: false
    source: verification note, accessibility review, screenshots, or tests

checks:
  - id: headings-and-structure-reviewed
    description: Page or component headings are clear, ordered, and support the page structure.
    required: true
    check_type: content_review
    evidence:
      - Screenshot, DOM review, semantic review, or verification note naming H1 and section headings.
    failure_means: Users may not understand page structure or assistive technology navigation.
    adr_required_when: The project intentionally varies from expected heading structure.
    waiver_allowed: true

  - id: labels-and-accessible-names-reviewed
    description: Inputs, buttons, links, and interactive controls have visible labels or accessible names.
    required: true
    check_type: content_review
    evidence:
      - Form review, component review, accessibility notes, or test evidence.
    failure_means: Controls may be unclear or unusable with assistive technologies.
    adr_required_when: A control intentionally lacks visible label behavior and relies on an alternate accessible name.
    waiver_allowed: true

  - id: keyboard-behavior-reviewed
    description: The main path and interactive controls can be used with keyboard navigation.
    required: true
    check_type: human_review
    evidence:
      - Keyboard-only review note, test result, or verification note.
    failure_means: Keyboard users may be blocked from completing the task.
    adr_required_when: Keyboard support is intentionally incomplete for a meaningful user-facing path.
    waiver_allowed: true

  - id: focus-behavior-reviewed
    description: Focus order and visible focus behavior are reviewed for changed interactive UI.
    required: true
    check_type: human_review
    evidence:
      - Focus review note, screenshots, test result, or verification note.
    failure_means: Users may lose context or be unable to operate interactive elements.
    adr_required_when: Focus behavior intentionally varies from expected component or page behavior.
    waiver_allowed: true

  - id: errors-and-status-reviewed
    description: Errors and status messages are specific, helpful, and available to assistive technologies when relevant.
    required: true
    check_type: content_review
    evidence:
      - Error state screenshots, status message review, form validation review, or verification note.
    failure_means: Users may miss errors, status, or recovery instructions.
    adr_required_when: Error or status behavior is intentionally deferred for a meaningful interaction.
    waiver_allowed: true

  - id: contrast-and-visual-review
    description: Important text, controls, status indicators, and custom visual treatments have contrast or visual accessibility review.
    required: true
    check_type: human_review
    evidence:
      - Contrast check, screenshot review, design review note, or verification note.
    failure_means: Visual content may be unreadable or rely on color alone.
    adr_required_when: The project intentionally accepts visual accessibility risk.
    waiver_allowed: true

  - id: screen-reader-or-semantic-review
    description: Screen-reader or semantic HTML review is captured when the change affects meaningful structure, forms, custom controls, status, or navigation.
    required: true
    check_type: human_review
    evidence:
      - Semantic review, screen-reader note, accessibility test, or verification note.
    failure_means: Assistive technology behavior may be unverified for meaningful changes.
    adr_required_when: The project intentionally skips semantic or assistive technology review for custom or complex UI.
    waiver_allowed: true

outputs:
  - id: accessibility_review_summary
    description: Review result showing accessibility checks, evidence, exceptions, and follow-up.

evidence_expectations:
  - Meaningful user-facing UI changes include keyboard, focus, label, error/status, and visual review evidence where applicable.
  - Custom or complex UI includes semantic or assistive technology review where meaningful.
  - Exceptions are visible in a verification note or local ADR.

adr_triggers:
  - Accessibility behavior is intentionally incomplete, deferred, or replaced by a project-specific approach.
  - Custom UI introduces keyboard, focus, label, contrast, semantic, or screen-reader risk.

waiver_guidance:
  - A project-local waiver may be needed when accessibility evidence is intentionally deferred for a delivery gate.
  - Waivers do not remove the need to make accessibility risk visible.

notes:
  - This schema contract supports STD-007. STD-007 remains the source of truth.
