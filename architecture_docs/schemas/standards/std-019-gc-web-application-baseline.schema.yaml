schema_id: ARCH-SCHEMA-STD-019-GC-WEB-APPLICATION-BASELINE
schema_version: "0.1"
title: Government of Canada Web Application Baseline Governance Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-019
owner_doc_type: standard
owner_doc_path: docs/standards/std-019-government-of-canada-web-application-baseline.md

summary: >
  Helps agents and reviewers confirm when the active Government of Canada web
  application baseline applies, whether controls were assessed, and whether
  evidence, deferred controls, exceptions, risks, and ADRs are visible before
  release.

categories:
  - governance
  - design-system
  - accessibility
  - security-privacy
  - frontend
  - backend
  - api
  - data
  - operations
  - deployment
  - testing
search_keywords:
  - baseline
  - BAS-001
  - Government of Canada web application
  - baseline assessment
  - controls
  - release evidence
  - deferred control
  - exception
  - open risk
  - reference architecture
applies_when:
  - creating, changing, reviewing, or releasing a Government of Canada web application
  - meaningful service changes affect baseline controls
  - baseline assessment evidence, deferred controls, exceptions, or release readiness need review
do_not_use_when:
  - the work is not a Government of Canada web application and no baseline controls apply
  - the change is local documentation-only work with no service, control, release, or evidence impact

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - fastapi
  - postgres
  - containers
artifact_types:
  - baseline_assessment
  - standards_impact
  - release_note
  - verification_note
  - adr
  - reference_architecture

related_standards:
  - STD-005
  - STD-006
  - STD-007
  - STD-009
  - STD-010
  - STD-011
  - STD-013
  - STD-014
  - STD-016
  - STD-017
  - STD-018
  - STD-019
  - STD-020
related_patterns: []
related_controls:
  - GC-WEB-001
  - GC-WEB-002
  - GC-WEB-003
  - GC-WEB-004
  - GC-WEB-005
  - GC-WEB-006
  - GC-WEB-007
  - GC-WEB-008
  - GC-WEB-009
  - GC-WEB-010
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: application_scope
    description: Description of the Government of Canada web application, audience, release, or meaningful service change.
    required: true
    source: implementation plan, baseline assessment, release record, or PR
  - id: active_baseline
    description: Active baseline profile and version used for assessment.
    required: true
    source: baseline document or baseline assessment record
  - id: control_assessment
    description: Control status and evidence for applicable baseline controls.
    required: true
    source: baseline assessment record

checks:
  - id: baseline-selected
    description: The active baseline is identified for the web application or service change.
    required: true
    check_type: content_review
    evidence:
      - Baseline assessment, standards impact block, or release note names BAS-001 or the applicable baseline.
    failure_means: Reviewers cannot tell which baseline profile was used.
    adr_required_when: A project selects a different baseline or decides BAS-001 does not apply despite apparent scope.
    waiver_allowed: false

  - id: applicable-controls-reviewed
    description: Applicable controls from the active baseline are reviewed and have a recorded status.
    required: true
    check_type: evidence_required
    evidence:
      - Baseline assessment record lists controls as applies, not_applicable, deferred, or exception.
    failure_means: Baseline coverage and control status are incomplete.
    adr_required_when: A project intentionally omits a control from assessment or changes how baseline controls are interpreted.
    waiver_allowed: true

  - id: assessment-record-exists-when-needed
    description: A baseline assessment record exists before first release or meaningful service changes affecting baseline controls.
    required: true
    check_type: evidence_required
    evidence:
      - Completed baseline assessment record or equivalent review artifact.
    failure_means: Release readiness cannot be assessed against the active baseline.
    adr_required_when: A project intentionally releases or materially changes a service without a baseline assessment record.
    waiver_allowed: true

  - id: evidence-for-applicable-controls
    description: Controls marked applies include evidence before the baseline gate passes.
    required: true
    check_type: evidence_required
    evidence:
      - Evidence entries for applicable controls, such as tests, screenshots, review notes, CI results, accessibility checks, security checks, or standards impact evidence.
    failure_means: A control may be marked applicable without proof.
    adr_required_when: A project intentionally accepts missing evidence for applicable controls.
    waiver_allowed: true

  - id: open-risks-deferred-controls-and-exceptions-visible
    description: Open risks, deferred controls, exceptions, skipped checks, and residual risks are visible with owners and follow-up conditions.
    required: true
    check_type: human_review
    evidence:
      - Baseline assessment records deferred controls, exceptions, open risk, owner, approval path, target, or follow-up condition.
    failure_means: Release risk may be hidden or unowned.
    adr_required_when: Open baseline risk is accepted as an architecture or governance decision.
    waiver_allowed: true

  - id: release-readiness-evidence-identified
    description: Release readiness evidence is identified when the baseline gate is in scope.
    required: true
    check_type: evidence_required
    evidence:
      - Gate result, release owner, verification notes, CI results, screenshots, accessibility checks, security checks, or standards impact evidence.
    failure_means: The release decision lacks visible supporting evidence.
    adr_required_when: A project intentionally releases without expected readiness evidence.
    waiver_allowed: true

  - id: material-variation-adrs-visible
    description: Local ADRs exist for material variation from a baseline, reference architecture, deferred control, exception, or accepted baseline risk.
    required: true
    check_type: content_review
    evidence:
      - ADR links or baseline assessment references for material variations, accepted risks, deferred controls, or exceptions.
    failure_means: Durable baseline or architecture decisions may be hidden in release notes or checklists.
    adr_required_when: A material variation exists without a durable ADR.
    waiver_allowed: false

outputs:
  - id: baseline_assessment_result
    description: Baseline assessment record or equivalent review artifact with control statuses and evidence.
  - id: baseline_gate_summary
    description: Release readiness summary with open risk, release owner, and required follow-up.

evidence_expectations:
  - Baseline assessment exists before first release and meaningful service changes affecting controls.
  - Applicable controls include evidence.
  - Deferred controls and exceptions include owner, reason, risk, approval path, target, and follow-up condition as applicable.
  - Material variations link to local ADRs.

adr_triggers:
  - A project varies from an active baseline or reference architecture.
  - A project accepts open baseline risk, deferred controls, or exceptions.
  - A project decides the active baseline does not apply despite apparent Government of Canada web application scope.

waiver_guidance:
  - A project-local waiver may be needed when a delivery gate allows a time-limited exception for missing evidence, deferred controls, or open baseline risk.
  - Waiver records belong in the project-local Delorean evidence process.

notes:
  - This schema contract supports STD-019. STD-019 remains the source of truth.
  - Current Government of Canada policy instruments may still need human review when compliance risk matters.
