schema_id: ARCH-SCHEMA-STD-016-CONTAINER-BUILD-DEPLOYMENT
schema_version: "0.1"
title: Container Build and Deployment Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-016
owner_doc_type: standard
owner_doc_path: docs/standards/std-016-container-build-and-deployment.md

summary: >
  Helps agents and reviewers check container build context, ignore rules,
  runtime configuration, secret handling, image scanning or review evidence,
  runtime service contracts, and deployment readiness for shared or production
  environments.

categories:
  - deployment
  - operations
  - backend
  - security-privacy
search_keywords:
  - container
  - docker
  - dockerfile
  - dockerignore
  - deployment
  - image scan
  - runtime config
  - secrets
  - environment variables
  - ecs
  - ecr
  - health check
applies_when:
  - adding or changing container images, Dockerfiles, .dockerignore files, build commands, runtime config, image scanning, or deployment notes
  - preparing backend services for shared, staging, production, AWS, ECS, ECR, or other approved container deployment
  - reviewing runtime service contracts, health endpoints, logging, secrets, ports, base images, or deployment readiness
do_not_use_when:
  - the change has no container image, Dockerfile, ignore rule, runtime config, secret, scan, deployment, or operational readiness impact
  - the service is not deployed as a container and has a separate approved deployment model

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - containers
  - docker
  - fastapi
  - aws
  - ecs
  - ecr
artifact_types:
  - dockerfile
  - dockerignore
  - container_image
  - runtime_service_contract
  - deployment_config
  - image_scan
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-011
  - STD-013
  - STD-014
  - STD-016
related_patterns: []
related_controls:
  - GC-WEB-007
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: container_change_scope
    description: Description of changed Dockerfile, .dockerignore, build command, runtime configuration, port, health endpoint, secret source, image scan, or deployment note.
    required: true
    source: implementation plan, PR, issue, changed files, runtime service contract, or verification note
  - id: deployment_context
    description: Target context for local, shared non-production, production, AWS, ECS, ECR, or equivalent deployment when deployment is in scope.
    required: false
    source: architecture note, runtime service contract, deployment note, ADR, or verification note

checks:
  - id: build-context-reviewed
    description: Container build context includes only runtime files and needed dependencies.
    required: true
    check_type: file_review
    evidence:
      - Dockerfile review, build context review, image contents note, or verification note.
    failure_means: Images may contain unnecessary files, local state, secrets, or generated output.
    adr_required_when: A project intentionally includes broad source, build, test, or generated output in the runtime image.
    waiver_allowed: true

  - id: ignore-rules-reviewed
    description: .dockerignore or equivalent ignore rules exclude local env files, keys, certificates, caches, coverage, build output, node_modules, and .git.
    required: true
    check_type: file_review
    evidence:
      - .dockerignore review, build context review, PR review, or verification note.
    failure_means: Local files, secrets, caches, or source history may be copied into the image.
    adr_required_when: A project intentionally omits ignore rules or includes normally excluded paths.
    waiver_allowed: false

  - id: runtime-config-and-secrets-not-baked-in
    description: Runtime configuration uses environment variables or platform injection, and secrets are not baked into Dockerfiles, build args, image layers, or committed config.
    required: true
    check_type: human_review
    evidence:
      - Dockerfile review, deployment config review, runtime service contract, secret reference, image review, or verification note.
    failure_means: Images may expose configuration or secrets and become unsafe to promote across environments.
    adr_required_when: A project intentionally bakes configuration into a container image or uses a different secret injection pattern.
    waiver_allowed: false

  - id: runtime-service-contract-recorded
    description: Containerized services have a runtime service contract when deployment or handoff is meaningful.
    required: true
    check_type: evidence_required
    evidence:
      - Runtime service contract, architecture note, deployment note, verification note, or PR description.
    failure_means: Port, health, env var, secret, filesystem, logging, and readiness expectations may be unclear.
    adr_required_when: A project intentionally omits runtime service contract evidence for a shared or production container.
    waiver_allowed: true

  - id: runtime-posture-reviewed
    description: Runtime posture covers non-root execution where practical, non-privileged mode, documented port, health endpoint, stdout/stderr logs, and no important state inside the container filesystem.
    required: true
    check_type: content_review
    evidence:
      - Dockerfile review, runtime service contract, container run command, deployment config, tests, or verification note.
    failure_means: Container behavior may be unsafe, hard to operate, or incompatible with the platform.
    adr_required_when: A project intentionally uses privileged mode, root runtime, stateful container filesystem behavior, or a non-standard health pattern.
    waiver_allowed: true

  - id: image-scanning-or-review-evidence
    description: Image scanning or security review evidence is recorded when available or when production use is in scope.
    required: true
    check_type: evidence_required
    evidence:
      - Image scan result, security review, dependency review, CI result, skipped-scan reason, or verification note.
    failure_means: Container vulnerabilities or base image risks may be hidden.
    adr_required_when: A project intentionally skips image scanning or equivalent review before production use.
    waiver_allowed: true

  - id: deployment-readiness-notes
    description: Shared or production container work records deployment readiness notes covering registry, platform, runtime secrets, health checks, logs, IAM or task roles, and skipped checks when applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Deployment note, runtime service contract, standards impact note, baseline assessment, CI result, or verification note.
    failure_means: Shared or production deployment may proceed without visible operational readiness.
    adr_required_when: A project intentionally skips deployment review for shared or production work.
    waiver_allowed: true

outputs:
  - id: container_deployment_review_summary
    description: Review result showing build context, ignore rules, secret handling, runtime contract, runtime posture, image review, and deployment readiness.

evidence_expectations:
  - Dockerfile and ignore rules are reviewed together.
  - Runtime service contracts are visible for meaningful shared or production handoffs.
  - Image scan, skipped-scan reason, or equivalent review evidence is recorded when production use is in scope.

adr_triggers:
  - Project bakes configuration or secrets into a container image.
  - Project intentionally skips deployment review for shared or production work.
  - Project skips image scanning or equivalent review before production use.
  - Project uses privileged containers, root runtime, stateful container filesystem behavior, or a different deployment model.

waiver_guidance:
  - Delivery waivers for deferred image scans, deployment readiness evidence, or container review belong in the project-local Delorean evidence process.
  - Waivers must not hide baked secrets, unsafe runtime posture, or skipped shared and production deployment review.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports STD-016. STD-016 remains the source of truth.
