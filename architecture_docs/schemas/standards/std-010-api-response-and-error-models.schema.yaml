schema_id: ARCH-SCHEMA-STD-010-API-RESPONSE-ERROR-MODELS
schema_version: "0.2"
title: API Response And Error Models Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-010
owner_doc_type: standard
owner_doc_path: docs/standards/std-010-api-response-and-error-models.md

summary: >
  Helps agents and reviewers check typed API response and error models,
  serialized JSON field naming, cross-stack response-contract alignment, safe
  validation error shapes, sensitive-data protection, examples, tests, and
  OpenAPI evidence for success and failure responses.

categories:
  - api
  - backend
  - frontend
  - security-privacy
search_keywords:
  - api response
  - response model
  - error model
  - validation error
  - correlation id
  - error code
  - sensitive data
  - openapi
  - success envelope
  - list response
  - failure path
  - json field naming
  - serialization
  - wire name
  - field casing
  - contract test
applies_when:
  - defining typed API response models
  - changing frontend API client types or backend response models
  - changing success envelopes, list responses, validation errors, safe error shapes, error codes, or API examples
  - changing serialized response or error field names, aliases, or casing
do_not_use_when:
  - the change does not affect API response, error, validation, OpenAPI, or client type behavior
  - an endpoint intentionally uses a different external protocol contract and records the reason

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - fastapi
  - pydantic
  - openapi
  - rest
artifact_types:
  - response_model
  - error_model
  - validation_error
  - openapi_contract
  - serialization_contract
  - frontend_type
  - api_test
  - verification_note
  - adr

related_standards:
  - STD-008
  - STD-009
  - STD-010
  - STD-011
  - STD-013
related_patterns:
  - PAT-002
  - PAT-005
  - PAT-006
  - PAT-024
related_controls:
  - GC-WEB-007
  - GC-WEB-010
related_baselines:
  - BAS-001

required_inputs:
  - id: response_change_scope
    description: Description of success, list, error, validation, or OpenAPI response behavior changed.
    required: true
    source: endpoint contract, model file, OpenAPI output, tests, or PR
  - id: safety_review
    description: Review of whether response and error fields can reveal internals, secrets, stack traces, or sensitive personal information.
    required: true
    source: code review, security review, tests, or verification note
  - id: json_serialization_contract
    description: Canonical serialized JSON field names for success, list, validation, and error models across backend, OpenAPI, frontend types, and API clients.
    required: true
    source: endpoint contract, response models, OpenAPI output, frontend types, API helpers, or contract tests

checks:
  - id: typed-response-models
    description: Meaningful success responses use typed response models where practical.
    required: true
    check_type: file_review
    evidence:
      - Pydantic response model, OpenAPI schema, frontend API type, or documented exception.
    failure_means: Clients and reviewers may not have a reliable response contract.
    adr_required_when: A project intentionally avoids typed response models for meaningful API responses.
    waiver_allowed: true

  - id: typed-error-models
    description: Expected client errors and important failure paths use a consistent typed safe error shape.
    required: true
    check_type: file_review
    evidence:
      - Error model, exception handler, OpenAPI schema, or tests.
    failure_means: Error behavior may be inconsistent or hard for clients to handle.
    adr_required_when: A project intentionally uses inconsistent error response shapes.
    waiver_allowed: true

  - id: response-serialization-aligned
    description: Success, list, validation, and error models use one canonical set of serialized JSON wire names across backend output, OpenAPI, frontend types, and API clients.
    required: true
    check_type: evidence_required
    evidence:
      - Representative serialized responses, OpenAPI schemas, frontend types, API helpers, and contract-test output.
    failure_means: Clients may misread otherwise valid responses because field names or casing differ across layers.
    adr_required_when: A project intentionally varies serialized field names across clients or changes existing wire casing.
    waiver_allowed: false

  - id: safe-validation-error-shape
    description: Validation errors include only safe field-level details and avoid hidden authorization, secret, or sensitive upstream information.
    required: true
    check_type: human_review
    evidence:
      - Validation error model, example response, test, or security review note.
    failure_means: Validation errors may leak sensitive or internal details.
    adr_required_when: A project intentionally exposes validation details outside the safe shape.
    waiver_allowed: false

  - id: no-sensitive-internals-in-errors
    description: Error responses do not expose stack traces, internal fields, secrets, or sensitive personal information.
    required: true
    check_type: human_review
    evidence:
      - Error handler review, failure path tests, log correlation behavior, or verification note.
    failure_means: Clients may see sensitive internals or personal information.
    adr_required_when: A project intentionally exposes internal error details for a controlled non-production context.
    waiver_allowed: false

  - id: examples-for-meaningful-responses
    description: Meaningful success, list, error, and validation responses include examples when useful for review or client use.
    required: true
    check_type: evidence_required
    evidence:
      - OpenAPI examples, endpoint contract examples, test fixtures, or verification note.
    failure_means: Response behavior may be hard for clients and reviewers to understand.
    adr_required_when: Examples are intentionally omitted for meaningful public or service-facing response models.
    waiver_allowed: true

  - id: success-and-failure-shape-tests
    description: Tests cover actual serialized keys for important success shapes, expected client errors, validation errors, and failure paths.
    required: true
    check_type: evidence_required
    evidence:
      - API tests, serialization tests, frontend contract tests, unit tests for handlers, OpenAPI checks, or verification note.
    failure_means: Response and error shapes may regress.
    adr_required_when: A project intentionally ships response shape changes without tests or verification.
    waiver_allowed: true

  - id: openapi-updated-for-response-behavior
    description: OpenAPI, tests, and verification are updated when response behavior changes.
    required: true
    check_type: evidence_required
    evidence:
      - OpenAPI export, schema diff, tests, or verification note.
    failure_means: API documentation may drift from implementation.
    adr_required_when: A project intentionally omits OpenAPI evidence for meaningful response changes.
    waiver_allowed: true

outputs:
  - id: api_response_review_summary
    description: Review result showing response models, error models, safety review, examples, tests, and OpenAPI evidence.

evidence_expectations:
  - Meaningful response changes include typed model and example evidence.
  - Representative success, list, validation, and error responses use the same wire names in backend serialization, OpenAPI, frontend types, and API helpers.
  - Important failure paths include safe error shape tests or review notes.
  - Sensitive-data and internal-detail risks are reviewed.

adr_triggers:
  - Project uses a response envelope, error model, or validation shape that varies from the standard.
  - Existing serialized response or error field names or casing change.
  - Project intentionally exposes internal IDs, stack traces, sensitive fields, or hidden validation details.
  - Project skips expected tests or OpenAPI evidence for meaningful response behavior changes.

waiver_guidance:
  - Delivery waivers for deferred examples, tests, or OpenAPI evidence belong in the project-local Delorean evidence process.
  - Waivers must not permit leaking secrets, stack traces, or sensitive personal information.

notes:
  - This schema contract supports STD-010. STD-010 remains the source of truth.
