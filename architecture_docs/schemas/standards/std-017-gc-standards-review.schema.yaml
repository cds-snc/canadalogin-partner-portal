schema_id: ARCH-SCHEMA-STD-017-GC-STANDARDS-REVIEW
schema_version: "0.1"
title: Government of Canada Standards Review Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-017
owner_doc_type: standard
owner_doc_path: docs/standards/std-017-gc-standards-review.md

summary: >
  Helps agents and reviewers record standards impact for meaningful Government
  of Canada service changes, including UI, accessibility, official languages,
  security, privacy, identity, information management, verification, and baseline
  applicability.

categories:
  - governance
  - design-system
  - accessibility
  - security-privacy
  - frontend
  - api
  - data
  - operations
search_keywords:
  - standards impact
  - Government of Canada
  - GC Design System
  - accessibility
  - official languages
  - security
  - privacy
  - identity
  - information management
  - verification
  - baseline
applies_when:
  - planning, designing, implementing, or reviewing Government of Canada service work
  - meaningful service changes affect UI, content, APIs, data, identity, security, privacy, information management, deployment, or verification
  - a standards impact block or equivalent review is needed
do_not_use_when:
  - the work clearly has no Government of Canada service impact
  - a narrower standard fully covers a local-only non-service documentation change

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - gcds
  - fastapi
  - postgres
  - containers
artifact_types:
  - standards_impact
  - implementation_plan
  - pull_request
  - architecture_note
  - verification_note
  - baseline_assessment
  - adr

related_standards:
  - STD-005
  - STD-006
  - STD-007
  - STD-013
  - STD-017
  - STD-019
related_patterns:
  - PAT-001
  - PAT-013
  - PAT-014
  - PAT-015
related_controls: []
related_baselines:
  - BAS-001

required_inputs:
  - id: change_description
    description: Description of the service change and affected user, data, API, identity, security, privacy, deployment, or verification scope.
    required: true
    source: user request, implementation plan, issue, or PR
  - id: standards_impact_record
    description: Standards impact block or equivalent review record for the change.
    required: false
    source: plan, PR, architecture note, or verification note

checks:
  - id: standards-reviewed-before-work
    description: Applicable standards are identified during planning, not only during final review.
    required: true
    check_type: content_review
    evidence:
      - Plan, PR, or verification note lists applicable standards or explains why none apply.
    failure_means: Standards risks may be discovered too late for safe design or implementation changes.
    adr_required_when: A project intentionally does not use local standards review for meaningful service changes.
    waiver_allowed: false

  - id: ui-and-branding-reviewed
    description: UI and branding impact is recorded when the work touches pages, components, forms, content, navigation, buttons, links, or layout.
    required: true
    check_type: content_review
    evidence:
      - Standards impact area records applies, decision, evidence, and exceptions for UI and branding.
    failure_means: GC Design System, page shell, navigation, or custom UI expectations may be missed.
    adr_required_when: The project intentionally uses custom UI or varies from an approved page pattern.
    waiver_allowed: true

  - id: accessibility-reviewed
    description: Accessibility impact is recorded for user-facing UI, content, forms, status, errors, and navigation.
    required: true
    check_type: evidence_required
    evidence:
      - Accessibility decision and evidence such as keyboard, focus, headings, labels, errors, contrast, zoom, or screen reader notes.
    failure_means: Accessibility obligations may be untested or invisible.
    adr_required_when: The project intentionally defers or varies from applicable accessibility expectations.
    waiver_allowed: true

  - id: official-languages-reviewed
    description: Official languages impact is recorded when users see text, labels, errors, alt text, placeholders, URLs, dates, or numbers.
    required: true
    check_type: content_review
    evidence:
      - English/French parity, locale files, route behavior, or language toggle review is recorded.
    failure_means: Bilingual content and route expectations may be missed.
    adr_required_when: The project intentionally defers or varies from official languages expectations.
    waiver_allowed: true

  - id: security-and-privacy-reviewed
    description: Security and privacy impact is recorded when work accepts input, exposes data, calls APIs, logs data, or uses configuration.
    required: true
    check_type: human_review
    evidence:
      - Validation, authorization, safe error, logging, secret, and personal information checks are named.
    failure_means: Sensitive data, secrets, validation, authorization, or logging risks may be invisible.
    adr_required_when: The project intentionally accepts security or privacy risk.
    waiver_allowed: true

  - id: identity-and-access-reviewed
    description: Identity and access impact is recorded when work touches login, logout, sessions, roles, permissions, scopes, or protected routes.
    required: true
    check_type: human_review
    evidence:
      - Session, cookie, RBAC, scope, role, logout, or protected route review is recorded.
    failure_means: Access control or identity assumptions may be unclear.
    adr_required_when: The project changes identity or authorization posture.
    waiver_allowed: true

  - id: information-management-reviewed
    description: Information management impact is recorded when work creates, updates, stores, archives, deletes, exports, or audits business records.
    required: true
    check_type: human_review
    evidence:
      - Metadata, audit, retention, soft delete, disposition, or record lifecycle expectations are named.
    failure_means: Records, audit, retention, or disposition expectations may be missed.
    adr_required_when: The project changes information management or retention posture.
    waiver_allowed: true

  - id: verification-reviewed
    description: Verification evidence is named for meaningful service changes.
    required: true
    check_type: evidence_required
    evidence:
      - Tests, local commands, screenshots, review notes, or skipped-check rationale are recorded.
    failure_means: Reviewers cannot tell how the standard was verified.
    adr_required_when: A project intentionally omits expected verification for a meaningful service change.
    waiver_allowed: true

  - id: gc-web-baseline-reviewed-when-applicable
    description: GC web application baseline applicability is recorded when the work creates, changes, reviews, or releases a Government of Canada web application.
    required: true
    check_type: content_review
    evidence:
      - Standards impact area references STD-019 or BAS-001 assessment status when applicable.
    failure_means: Baseline controls or release evidence may be missed.
    adr_required_when: The project decides the baseline does not apply despite apparent Government of Canada web application scope.
    waiver_allowed: true

outputs:
  - id: standards_impact_result
    description: Standards impact block or equivalent review record with decisions, evidence, and exceptions.
  - id: baseline_applicability_result
    description: Result showing whether STD-019 and BAS-001 apply.

evidence_expectations:
  - Meaningful service changes include standards impact or equivalent review evidence.
  - Exceptions, skipped checks, or deferred reviews are visible.
  - Baseline assessment evidence is linked when STD-019 applies.

adr_triggers:
  - A project does not follow an applicable standard or page pattern.
  - A project intentionally accepts architecture, delivery, security, privacy, accessibility, identity, data, or user-facing risk.
  - A project decides the GC web application baseline does not apply when scope suggests it may.

waiver_guidance:
  - A project-local waiver may be needed when a delivery gate expects evidence that is intentionally deferred or skipped.
  - Waivers belong in the project-local Delorean evidence process, not this architecture schema contract.

notes:
  - This schema contract supports STD-017. STD-017 remains the source of truth.
