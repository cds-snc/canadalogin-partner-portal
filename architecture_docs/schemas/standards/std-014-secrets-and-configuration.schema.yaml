schema_id: ARCH-SCHEMA-STD-014-SECRETS-CONFIGURATION
schema_version: "0.1"
title: Secrets and Configuration Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-014
owner_doc_type: standard
owner_doc_path: docs/standards/std-014-secrets-and-configuration.md

summary: >
  Helps agents and reviewers check that secrets stay out of source, examples,
  logs, frontend bundles, and generated output; configuration and secret sources
  are separated; local defaults are safe; and deployed secret handling,
  rotation, and lifecycle notes are visible when needed.

categories:
  - security-privacy
  - operations
  - frontend
  - backend
  - deployment
search_keywords:
  - secrets
  - configuration
  - environment variables
  - env example
  - config
  - VITE
  - frontend public config
  - ci secrets
  - secret store
  - rotation
  - sensitive data
applies_when:
  - adding or changing environment variables, local config, CI settings, deployment settings, generated config, or secret handling
  - reviewing examples, logs, frontend bundles, backend config, container config, or deployment notes for leaked secrets
  - documenting configuration entries or deployed secret handling
do_not_use_when:
  - the change has no configuration, environment variable, secret, logging, frontend build-time config, CI, container, or deployment impact
  - project-local platform guidance already records equivalent deployed secret handling evidence

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - fastapi
  - containers
  - ci
artifact_types:
  - env_example
  - config_file
  - ci_config
  - deployment_config
  - container_config
  - verification_note
  - adr

related_standards:
  - STD-002
  - STD-011
  - STD-013
  - STD-014
  - STD-016
related_patterns: []
related_controls:
  - GC-WEB-007
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: configuration_change_scope
    description: Description of changed environment variables, config files, CI settings, deployment settings, secret sources, example values, or logs.
    required: true
    source: implementation plan, PR, issue, changed files, or verification note
  - id: secret_source_record
    description: Record of secret source, owner, lifecycle, rotation, and deployed handling when backend, CI, platform, or managed secrets are in scope.
    required: false
    source: configuration entry, deployment note, platform record, ADR, or verification note

checks:
  - id: no-real-secrets-in-source
    description: Real secrets, tokens, passwords, private keys, connection strings, credentials, and real local .env files are not committed.
    required: true
    check_type: file_review
    evidence:
      - Changed-file review, secret scan result, .gitignore review, PR review, or verification note.
    failure_means: Source history or generated artifacts may expose secrets.
    adr_required_when: A project intentionally commits a protected value or cannot rotate an exposed secret.
    waiver_allowed: false

  - id: env-and-secret-configuration-separated
    description: Deploy-specific non-secret configuration is separated from secret values, and secret values come from approved runtime, CI, platform, or managed secret sources.
    required: true
    check_type: content_review
    evidence:
      - Configuration entry, settings file, CI config, deployment config, platform note, or verification note.
    failure_means: Config may be unsafe, hard to rotate, or environment-specific in source.
    adr_required_when: A project intentionally uses a different secret management pattern.
    waiver_allowed: false

  - id: examples-use-fake-values
    description: Example environment and configuration files use safe placeholders or fake values only.
    required: true
    check_type: file_review
    evidence:
      - "`.env.example`, `.env.template`, docs, test config, generated example, or verification note."
    failure_means: Examples may train users or agents to copy real secrets or private values into source.
    adr_required_when: A project intentionally includes sensitive-adjacent example values for a narrowed approved reason.
    waiver_allowed: false

  - id: local-config-safe-by-default
    description: Local configuration defaults are safe by default and do not expose services broadly or use shared or production secrets.
    required: true
    check_type: file_review
    evidence:
      - Local env example, dev server config, container run command, Makefile, setup docs, or verification note.
    failure_means: Local development may leak data, expose services, or connect to unsafe shared resources.
    adr_required_when: A project intentionally uses production data or shared secrets in local or test environments.
    waiver_allowed: false

  - id: frontend-public-config-not-secret
    description: Frontend public build-time configuration, including VITE_* values, does not contain private or secret values.
    required: true
    check_type: content_review
    evidence:
      - Frontend env example, build config, frontend source review, deployment config, or verification note.
    failure_means: Secret values may be bundled into client-side assets.
    adr_required_when: A project intentionally exposes a sensitive-adjacent value in frontend public config.
    waiver_allowed: false

  - id: deployed-secret-handling-recorded
    description: Deployed secret handling is recorded when backend, CI, platform, container, or production secrets are in scope.
    required: true
    check_type: evidence_required
    evidence:
      - Configuration entry, CI secret reference, platform secret reference, deployment note, runtime service contract, or verification note.
    failure_means: Shared or production secret ownership, injection, and rotation may be unclear.
    adr_required_when: A project intentionally uses a non-standard secret source or deployment secret pattern.
    waiver_allowed: true

  - id: rotation-or-lifecycle-notes-when-needed
    description: Rotation, lifecycle, or leak-response notes exist when secrets are added, changed, leaked, or have operational ownership.
    required: true
    check_type: evidence_required
    evidence:
      - Rotation plan, owner note, incident note, verification note, or ADR.
    failure_means: Exposed or operational secrets may remain valid or ownerless.
    adr_required_when: A leaked or shared secret cannot be rotated promptly or has unclear ownership.
    waiver_allowed: true

outputs:
  - id: secrets_configuration_review_summary
    description: Review result showing source safety, config separation, fake examples, frontend public config, deployed secret handling, and rotation or lifecycle notes.

evidence_expectations:
  - Example files contain only safe placeholders.
  - Deployed secret sources, owners, and lifecycle notes are visible when in scope.
  - Secret leaks have rotation evidence or an explicit risk decision.

adr_triggers:
  - Project uses a different secret management pattern.
  - Project uses production data or shared secrets in local or test environments.
  - Project intentionally exposes sensitive-adjacent values in examples or frontend public config.
  - Project cannot rotate an exposed or operational secret promptly.

waiver_guidance:
  - Delivery waivers for deferred secret review, rotation evidence, or deployment evidence belong in the project-local Delorean evidence process.
  - Waivers must not hide committed secrets, leaked secrets, or unclear secret ownership.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports STD-014. STD-014 remains the source of truth.
