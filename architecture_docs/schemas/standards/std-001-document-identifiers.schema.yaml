schema_id: ARCH-SCHEMA-STD-001-DOCUMENT-IDENTIFIERS
schema_version: "0.1"
title: Document Identifiers Schema Contract
status: active
schema_type: standard

owner_doc_id: STD-001
owner_doc_type: standard
owner_doc_path: docs/standards/std-001-document-identifiers.md

summary: >
  Helps agents and reviewers confirm reusable architecture guidance has a stable
  identifier, matching filename, heading, and metadata before it is published or
  referenced.

categories:
  - documentation
  - foundation
search_keywords:
  - document id
  - stable identifier
  - filename
  - heading
  - metadata
  - schema contract id
applies_when:
  - creating reusable architecture guidance
  - renaming or moving guidance documents
  - referencing standards, patterns, controls, baselines, ADRs, templates, or schema contracts
do_not_use_when:
  - creating project-local runtime records that do not need shared architecture document IDs
  - creating generated evidence output owned by a project repo

work_contexts:
  - local_developer
stack_profiles: []
artifact_types:
  - standard
  - pattern
  - control
  - baseline
  - reference_architecture
  - adr
  - template
  - schema_contract

related_standards:
  - STD-001
related_patterns: []
related_controls: []
related_baselines: []

required_inputs:
  - id: target_document
    description: The reusable guidance document or schema contract being created, moved, renamed, or referenced.
    required: true
    source: project files
  - id: document_type
    description: The intended document type or control namespace.
    required: true
    source: owner document

checks:
  - id: stable-id-present
    description: The reusable guidance artifact has a stable document or schema contract ID.
    required: true
    check_type: file_review
    evidence:
      - Document header, schema_id, or catalog entry includes the stable ID.
    failure_means: The artifact cannot be reliably referenced by agents, tools, or reviewers.
    adr_required_when: A published reusable artifact intentionally lacks a stable ID.
    waiver_allowed: false

  - id: filename-matches-id
    description: The filename starts with the lowercase ID and uses the expected Markdown or YAML extension.
    required: true
    check_type: deterministic
    evidence:
      - File path matches the document or schema contract ID.
    failure_means: The artifact may be hard to find or may not follow repository routing conventions.
    adr_required_when: A filename intentionally diverges from the stable ID after publication.
    waiver_allowed: false

  - id: heading-or-schema-id-matches
    description: Markdown H1 headings or YAML schema_id fields match the assigned stable ID.
    required: true
    check_type: deterministic
    evidence:
      - H1 starts with the stable ID or YAML schema_id matches the catalog ID.
    failure_means: The artifact may be misidentified in catalogs, reviews, or generated architecture_docs.
    adr_required_when: A published document intentionally keeps a mismatched heading or schema_id.
    waiver_allowed: false

  - id: metadata-present
    description: Markdown guidance includes Type and Status metadata, or schema contracts include status and schema_type.
    required: true
    check_type: file_review
    evidence:
      - Type and Status fields, or schema_type and status fields, are present.
    failure_means: Agents and reviewers cannot reliably route or interpret the artifact lifecycle.
    adr_required_when: Required metadata is intentionally omitted for a reusable artifact.
    waiver_allowed: false

  - id: references-remain-stable
    description: Moving, renaming, deprecating, or superseding the artifact preserves existing references where needed.
    required: true
    check_type: content_review
    evidence:
      - Updated links, deprecation note, supersession note, or catalog update.
    failure_means: Existing projects or generated architecture_docs may reference stale guidance.
    adr_required_when: A referenced artifact is deleted or replaced without preserving a stable reference path.
    waiver_allowed: false

outputs:
  - id: identifier_review_result
    description: Review result showing the artifact ID, filename, metadata, and references are stable.

evidence_expectations:
  - File path and heading or schema_id can be inspected.
  - Catalog entry is updated when the artifact is indexed.
  - Deprecation or supersession is visible when replacing published guidance.

adr_triggers:
  - Published reusable guidance intentionally diverges from the ID, filename, or metadata rules.
  - Existing references cannot be preserved during a move, rename, or replacement.

waiver_guidance:
  - Do not use a project-local delivery waiver to bypass shared document ID rules.

notes:
  - This schema contract supports STD-001. STD-001 remains the source of truth.
