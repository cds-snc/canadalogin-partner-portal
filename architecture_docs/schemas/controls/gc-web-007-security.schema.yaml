schema_id: ARCH-SCHEMA-GC-WEB-007-SECURITY
schema_version: "0.1"
title: GC-WEB-007 Security Schema Contract
status: active
schema_type: control

owner_doc_id: GC-WEB-007
owner_doc_type: control
owner_doc_path: docs/controls/gc-web/gc-web-007-security.md

summary: >
  Helps agents and reviewers check security assessment evidence for input
  validation, authorization, safe errors, secrets, secure transport, sensitive
  URLs, dependency, container, CI, deployment security, threat decisions, tests,
  and residual risk.

categories:
  - security-privacy
  - backend
  - api
  - deployment
  - operations
  - testing
search_keywords:
  - security
  - control assessment
  - authorization
  - input validation
  - safe errors
  - secrets
  - secure transport
  - dependency scan
  - image scan
  - threat model
applies_when:
  - assessing web application, API, deployment, CI, container, operational, or security-sensitive behavior against GC-WEB-007
  - changing input validation, authorization, safe errors, secrets, transport, request URLs, dependencies, containers, CI, deployment, or threat decisions
  - recording security evidence, accepted residual risk, deferred controls, exceptions, or baseline assessment notes
do_not_use_when:
  - the work has no security, API, auth, dependency, container, CI, deployment, operational, or sensitive data impact
  - a deeper project security review already records equivalent control evidence

work_contexts:
  - local_developer
  - shared_non_production
  - production
stack_profiles:
  - react
  - fastapi
  - postgres
  - containers
  - ci
artifact_types:
  - control_assessment
  - security_review
  - threat_model
  - dependency_scan
  - image_scan
  - api_test
  - verification_note
  - baseline_assessment
  - adr

related_standards:
  - STD-013
  - STD-014
  - STD-016
  - STD-017
  - STD-019
related_patterns:
  - PAT-005
  - PAT-006
  - PAT-009
  - PAT-010
  - PAT-011
  - PAT-012
  - PAT-020
related_controls:
  - GC-WEB-006
  - GC-WEB-007
  - GC-WEB-008
  - GC-WEB-010
  - GC-WEB-011
related_baselines:
  - BAS-001

required_inputs:
  - id: security_assessment_scope
    description: Validation, authorization, safe errors, secrets, transport, URLs, dependencies, containers, CI, deployment, operations, and threat decisions assessed.
    required: true
    source: baseline assessment, security review, implementation plan, PR, or issue
  - id: security_evidence
    description: Security review, threat model or mapping note, dependency or image scan, tests, and accepted residual risk.
    required: true
    source: security review note, scan result, test output, threat model, verification note, or baseline assessment

checks:
  - id: validation-authorization-safe-errors
    description: Input validation, authorization before data or action exposure, and safe client-facing errors are reviewed and tested where applicable.
    required: true
    check_type: evidence_required
    evidence:
      - API tests, service tests, validation review, authorization review, safe error review, or verification note.
    failure_means: Users or systems may access unsafe behavior, data, or internal details.
    adr_required_when: The project intentionally defers validation, authorization, or safe error controls for protected behavior.
    waiver_allowed: false

  - id: secrets-transport-and-url-safety
    description: Secrets, credentials, tokens, security configuration, secure transport, and sensitive data in request URLs are reviewed.
    required: true
    check_type: human_review
    evidence:
      - Secret review, config review, deployment review, URL review, transport note, or verification note.
    failure_means: Security-sensitive values or data may be exposed.
    adr_required_when: The project intentionally uses a different secret management pattern or exposes sensitive-adjacent data in URLs.
    waiver_allowed: false

  - id: dependency-container-ci-deployment-reviewed
    description: Dependency, container, CI, and deployment security are reviewed when applicable.
    required: true
    check_type: evidence_required
    evidence:
      - Dependency scan, image scan, CI review, deployment review, skipped-check rationale, or verification note.
    failure_means: Supply chain, container, or deployment risks may be hidden.
    adr_required_when: Important dependency, image, CI, or deployment security review is intentionally skipped.
    waiver_allowed: true

  - id: threat-and-risk-recorded
    description: Security risks, threat model decisions, accepted residual risk, owner, and review trigger are recorded when risk warrants it.
    required: true
    check_type: human_review
    evidence:
      - Threat model, threat mapping note, security review, ADR, baseline assessment, or project-local waiver when a gate requires it.
    failure_means: Security risk ownership and acceptance may be unclear.
    adr_required_when: Material residual security risk is accepted, deferred, or treated as not applicable.
    waiver_allowed: true

  - id: production-impact-human-review
    description: Shared or production-impacting security changes have human review evidence before release.
    required: true
    check_type: human_review
    evidence:
      - Security review, approval record, standards impact note, baseline assessment, or verification note.
    failure_means: High-impact security changes may proceed without visible review.
    adr_required_when: Project skips security review for shared or production-impacting work.
    waiver_allowed: true

outputs:
  - id: security_control_assessment_summary
    description: Assessment result showing validation, authorization, safe errors, secrets, transport, URL safety, scans, deployment review, threat decisions, and residual risk.

evidence_expectations:
  - Validation, authorization, and safe failure paths have tests or verification evidence.
  - Dependency, image, CI, and deployment review evidence is present when applicable.
  - Accepted residual risk is recorded with owner and review trigger.

adr_triggers:
  - Project treats GC-WEB-007 as not applicable for a web application, API, deployment path, or operational context.
  - Project intentionally defers validation, authorization, safe error, secret, transport, scan, or deployment review.
  - Project accepts material residual security risk.

waiver_guidance:
  - Delivery waivers for deferred security scans, tests, review, or control evidence belong in the project-local Delorean evidence process.
  - Waivers must not hide secrets, authorization risk, production impact, or accepted residual security risk.
  - This schema contract does not define runtime waiver records.

notes:
  - This schema contract supports GC-WEB-007. GC-WEB-007 remains the source of truth.
