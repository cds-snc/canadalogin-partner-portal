catalog_version: 1
scope: architecture_schema_contracts
description: >
  Searchable registry of shared architecture schema contracts. Schema contracts
  support standards, patterns, controls, baselines, decisions, and architecture
  review evidence shapes. They do not replace the human-readable guidance they
  support.

search_fields:
  - id
  - title
  - schema_type
  - owner_doc_id
  - categories
  - applies_when
  - search_keywords
  - stack_profiles
  - artifact_types

schema_types:
  standard: Supports a STD document.
  pattern: Supports a PAT document.
  control: Supports a GC-WEB or other control document.
  baseline: Supports a BAS document.
  decision: Supports ADR-style decisions about following, varying from, or not following guidance.
  evidence: Supports architecture review evidence shapes.

entry_fields:
  - id
  - title
  - schema_type
  - status
  - path
  - owner_doc_id
  - owner_doc_type
  - owner_doc_path
  - primary_category
  - categories
  - applies_when
  - do_not_use_when
  - search_keywords
  - work_contexts
  - stack_profiles
  - artifact_types
  - related_standards
  - related_patterns
  - related_controls
  - related_baselines

