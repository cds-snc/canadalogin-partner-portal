catalog_version: 1
scope: standards
description: >
  Machine-readable routing index for architecture standards. Use this file to
  find relevant standards by category, status, and task trigger. The standards
  documents remain the authoritative source for rules and checks.

categories:
  foundation:
    title: Foundation
    description: Baseline rules that apply across most architecture work.
  documentation:
    title: Documentation
    description: Guidance for creating, naming, referencing, and maintaining documents.
  architecture:
    title: Architecture
    description: System structure, stack choices, and cross-cutting architecture constraints.
  frontend:
    title: Frontend
    description: Browser UI, frontend structure, components, state, and client behavior.
  backend:
    title: Backend
    description: Backend service structure, runtime behavior, models, and service boundaries.
  api:
    title: API
    description: API contracts, REST behavior, request and response shapes, and OpenAPI.
  data:
    title: Data
    description: Data storage, data handling, persistence, and lifecycle concerns.
  design-system:
    title: Design System
    description: GC Design System usage, page shells, components, navigation, and UI consistency.
  accessibility:
    title: Accessibility
    description: Accessibility expectations for UI structure, content, navigation, and interaction.
  security-privacy:
    title: Security and Privacy
    description: Security, privacy, identity, authorization, sensitive data, and secret handling.
  operations:
    title: Operations
    description: Logging, observability, runtime configuration, deployment, and operational readiness.
  testing:
    title: Testing
    description: Test strategy, local checks, coverage expectations, and verification evidence.
  code-quality:
    title: Code Quality
    description: Linting, formatting, type checks, static checks, and generated-file handling.
  deployment:
    title: Deployment
    description: Containerization, runtime packaging, cloud readiness, and release constraints.
  governance:
    title: Governance
    description: Review expectations, compliance concerns, and standards impact checks.

