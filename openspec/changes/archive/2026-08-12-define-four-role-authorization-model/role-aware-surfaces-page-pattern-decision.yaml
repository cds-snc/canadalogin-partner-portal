ui_page_pattern_decision:
  page_role: role-aware authenticated partner and platform task surfaces
  page_type: existing service-home, basic task, form, and operational dashboard pages
  selected_pattern:
    - PAT-001: UI Page Patterns
    - PAT-013: GC Design System React App Shell
    - existing approved page decisions for Home, workspaces, and onboarding oversight
  source_reference:
    - STD-004: Frontend React and TypeScript
    - STD-005: Frontend GC Design System
    - STD-006: GC UI Page Layout Rules
    - STD-007: UI Accessibility Basics
    - openspec/changes/define-four-role-authorization-model/design.md
    - openspec/changes/add-authenticated-home-and-navigation-groups/authenticated-home-page-pattern-decision.yaml
    - openspec/changes/archive/2026-07-31-restore-workspace-and-application-info-management/workspaces-page-pattern-decision.yaml
    - openspec/changes/archive/2026-08-11-advance-onboarding-governance-and-reporting/onboarding-oversight-page-pattern-decision.yaml
  target_stack: Vite React with TanStack Router, i18next, and GC Design System wrappers
  task_structure:
    multiple_user_goals: true
    entry_page: /, owned by the dependent authenticated Home change
    destination_routes:
      - /your-applications
      - /your-applications/$rpApplicationUuid
      - /workspaces
      - /workspaces/$workspaceUuid
      - /workspaces/$workspaceUuid/settings
      - /workspaces/$workspaceUuid/members
      - /workspaces/$workspaceUuid/application-information
      - /workspaces/$workspaceUuid/applications/$rpApplicationUuid
      - /onboarding-oversight
      - /onboarding-oversight/queue
      - /onboarding-oversight/reports
      - /users
      - /departments
      - /roles
      - /tiers
      - /policies
      - /audit-logs
    home_page_or_service_home: /, owned by add-authenticated-home-and-navigation-groups
    single_page_rationale: null
  required_shell:
    header: existing shared AppShell header
    footer: existing shared AppShell footer
    main_content: existing AppShell main region and skip target
    skip_link: existing header skip link
    h1: retained on every existing route
    date_modified: provided by the existing AppShell
  navigation:
    primary_task_paths:
      - task: use partner workspace and RP application tasks
        entry_route: /
        navigation_elements:
          - dependent Home task links and partner-task navigation group
          - existing workspace and current-user application links
        destination_routes:
          - /your-applications
          - /workspaces
        return_path: shared Home link or existing parent-task link
      - task: use CL Admin oversight and platform governance tasks
        entry_route: /
        navigation_elements:
          - dependent Home oversight and platform-administration task groups
          - existing overview, queue, report, and administration links
        destination_routes:
          - /onboarding-oversight
          - /users
          - /departments
          - /roles
          - /tiers
          - /audit-logs
        return_path: shared Home link or existing parent-task link
    shared_menu:
      provided: true
      component: existing AppShell top navigation; grouping remains owned by the dependent Home change
      home_link: /
      new_page_or_parent_task_link: no new route; visibility consumes canonical server authorization context
      exclusion_reason: unavailable task groups are omitted when the canonical role lacks the capability
    breadcrumbs: retain existing route behavior; breadcrumbs do not replace Home or parent-task navigation
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route with translated content
      standalone_toggle_in_body: false
    search: retain existing page-specific behavior
    theme_topic_menu: none
    top_navigation: existing authenticated navigation; dependent Home change owns grouping
    side_navigation: retain existing page-specific behavior
  forms:
    required: existing workspace, application, invitation, configuration, and administration forms only
    pattern: retain each approved focused form pattern; disable no control as a substitute for server authorization
  component_plan:
    page_shell:
      - need: preserve headings, notices, route shell, and equivalent-language navigation
        gc_component: existing AppShell and GC Design System wrappers
        custom_exception: none
    navigation:
      - need: expose only task destinations allowed by canonical authorization context
        gc_component: existing GCDS-compatible navigation and Link wrappers
        custom_exception: none
    actions_and_forms:
      - need: hide unavailable mutations and invitations while preserving normal loading and error states
        gc_component: existing Button, Link, Input, Select, Textarea, Error, and Notice wrappers
        custom_exception: none
    status_and_content:
      - need: show canonical bilingual role and active workspace context without internal IDs or secret-bearing data
        gc_component: existing Text, Heading, Notice, summary, and table patterns
        custom_exception: none
  evidence_required:
    desktop_screenshot: required for representative CL Admin, RP Admin, RP User Edit, Read Only, and no-access states
    mobile_screenshot: required for representative partner and CL Admin states
    accessibility_result: required for changed role labels, unavailable states, focus, keyboard, and reflow
    design_system_checklist: required against retained existing page patterns
  exceptions:
    required: false
    approval_status: not needed for this slice
    notes: This change adds no page shell or route pattern. It changes typed authorization context, labels, and action visibility within previously approved surfaces; backend authorization remains authoritative.
