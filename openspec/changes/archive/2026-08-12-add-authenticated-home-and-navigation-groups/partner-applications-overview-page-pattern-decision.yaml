ui_page_pattern_decision:
  page_role: partner operational overview
  page_type: authenticated dashboard overview for accessible partner work
  selected_pattern:
    - "PAT-021: Dashboard Overview Page"
    - "PAT-002: API Query and Mutation"
    - "PAT-004: Protected Route"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-017: Itemized Data Display"
    - "PAT-020: Status and Feedback"
    - "PAT-022: Page Length and Splitting"
  source_reference:
    - "ADR-001: BFF and Server Session Authority"
    - "ADR-002: API Wire and Error Contract"
    - "ADR-003: Casbin Authorization Model"
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - openspec/changes/add-authenticated-home-and-navigation-groups/design.md
  supersedes:
    decision: openspec/changes/archive/2026-08-11-restore-dashboard-summary-surface/dashboard-page-pattern-decision.yaml
    scope: "`/your-applications` page role, Home ownership, navigation, profile-summary duplication, status states, and evidence expectations"
    reason: "`/` now owns service-home orientation while `/your-applications` remains a focused partner operational overview."
  target_stack: Vite React with TanStack Router and GC Design System React components
  audience_and_decisions:
    audience: authenticated partner users with one or more accessible applications or workspaces
    decisions_supported:
      - identify current application and onboarding status
      - resume the next permitted application task
      - move into the relevant workspace context
    generic_portal_home: false
  task_structure:
    multiple_user_goals: true
    entry_page: /your-applications
    destination_routes:
      - /your-applications/$rpApplicationUuid
      - /workspaces
      - /workspaces/$workspaceUuid
    home_page_or_service_home: /
    single_page_rationale: null
  data_sections:
    - name: Accessible RP applications
      purpose: scan current status and resume application work
      source: canonical accessible-application projection owned by the four-role change
      freshness: current response from the latest successful page load; retry refreshes the section
      next_action: open the selected current-user application route
      states:
        - loading
        - populated
        - empty
        - partial
        - error
        - unauthorized
    - name: Accessible workspaces
      purpose: enter the workspace that owns related partner work
      source: canonical authorized-workspace projection owned by the four-role change
      freshness: current response from the latest successful page load; retry refreshes the section
      next_action: open the selected workspace by its user-facing name
      states:
        - loading
        - populated
        - empty
        - partial
        - error
        - unauthorized
  data_architecture:
    server_state_owner: TanStack Query using typed fetch clients
    browser_receives_wider_scope_for_filtering: false
    stale_client_authorization_authoritative: false
    wire_contract: preserve each implemented endpoint contract while ADR-002 is Proposed
    generated_openapi_required_when_response_changes: true
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter through AppShell
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: one localized Your applications H1
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: inspect or resume an accessible RP application
        entry_route: /your-applications
        navigation_elements:
          - application summary link
        destination_routes:
          - /your-applications/$rpApplicationUuid
        return_path: breadcrumb or Partner work link to /your-applications
      - task: enter an accessible workspace
        entry_route: /your-applications
        navigation_elements:
          - workspace summary link using workspace name
        destination_routes:
          - /workspaces/$workspaceUuid
        return_path: Partner work link to /your-applications or /workspaces
    shared_menu:
      provided: true
      component: Your applications child inside the Partner work GcdsNavGroup
      home_link: /
      new_page_or_parent_task_link: /your-applications
      exclusion_reason: null
    breadcrumbs: Home then Your applications on nested detail routes; the overview may use Home then Your applications according to the shared route model
    language_toggle:
      provided_by_header: true
      equivalent_language_route: preserve the current application or overview route when safe
      standalone_toggle_in_body: false
    top_navigation: Partner work is active for /your-applications*
    side_navigation: none on the overview
  forms:
    required: false
    pattern: consequential tasks link to focused routes
  component_plan:
    page_shell:
      - need: operational overview shell
        gc_component: GcdsContainer, GcdsHeading, GcdsText, and shared AppShell
        custom_exception: none
    navigation:
      - need: application and workspace resume links
        gc_component: GcdsLink with semantic headings and PAT-017 itemized structure
        custom_exception: none
    actions_and_forms: []
    status_and_content:
      - need: lifecycle and current status
        gc_component: semantic status text and PAT-020 scoped feedback; GcdsNotice only when prominence is required
        custom_exception: none
      - need: related records when tabular comparison is justified
        gc_component: PAT-023 and GcdsTable if the final data shape is genuinely tabular
        custom_exception: none
  content_boundaries:
    includes:
      - accessible application summaries
      - accessible workspace summaries
      - current lifecycle or status values
      - one clear next or resume action per summary
    excludes:
      - duplicated account profile card
      - create or edit forms
      - credential values or secret actions
      - invitation management
      - full reports
      - cross-workspace internal oversight
      - platform administration
      - decorative charts or vanity metrics
  evidence_required:
    desktop_screenshot: populated operational overview and one error or partial state
    mobile_screenshot: first useful status and action without clipped content
    accessibility_result: headings, itemized summaries, links, status announcements, keyboard order, and focus review
    bilingual_result: English and French headings, statuses, empty/error copy, links, and accessible names
    design_system_checklist: required
    state_tests: loading, populated, empty, invitation-backed, partial, error, and unauthorized
    route_reachability_tests: required for application and workspace links
    capability_context_visibility_tests: required for representative partner and no-access contexts
  exceptions:
    required: false
    approval_status: not needed
    notes: PAT-021 is selected because the page supports repeat users scanning current work and resuming tasks; it must not degrade into a shortcut-only card grid or generic Home.
