ui_page_pattern_decision:
  page_role: platform administration parent area
  page_type: task hub with persistent section navigation
  selected_pattern:
    - "PAT-001: UI Page Patterns"
    - "PAT-004: Protected Route"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-022: Page Length and Splitting"
  patterns_not_selected:
    - pattern: "PAT-021: Dashboard Overview Page"
      reason: Administration branches to configuration and governance tasks; it does not provide an operational monitoring decision surface.
  source_reference:
    - "ADR-001: BFF and Server Session Authority"
    - "ADR-003: Casbin Authorization Model"
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - openspec/changes/add-authenticated-home-and-navigation-groups/design.md
  target_stack: Vite React with TanStack Router and GC Design System React components
  task_structure:
    multiple_user_goals: true
    entry_page: /administration
    destination_routes:
      - /users
      - /departments
      - /tiers
      - /audit-logs
      - /roles
    excluded_routes:
      - route: /policies
        reason: Authorization-policy CRUD is retired and this route is not an independent administration destination.
    home_page_or_service_home: /
    single_page_rationale: null
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter through AppShell
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: one localized Administration H1
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: manage users and canonical access assignments
        entry_route: /administration
        navigation_elements:
          - Users and access task link
          - Administration GcdsSideNav item
        destination_routes:
          - /users
        return_path: breadcrumb or side-navigation link to /administration
      - task: manage departments
        entry_route: /administration
        navigation_elements:
          - Departments task link
          - Administration GcdsSideNav item
        destination_routes:
          - /departments
        return_path: breadcrumb or side-navigation link to /administration
      - task: manage tiers
        entry_route: /administration
        navigation_elements:
          - Tiers task link
          - Administration GcdsSideNav item
        destination_routes:
          - /tiers
        return_path: breadcrumb or side-navigation link to /administration
      - task: inspect platform audit logs
        entry_route: /administration
        navigation_elements:
          - Audit logs task link
          - Administration GcdsSideNav item
        destination_routes:
          - /audit-logs
        return_path: breadcrumb or side-navigation link to /administration
      - task: review fixed product roles
        entry_route: /administration
        navigation_elements:
          - Role reference task link
          - Administration GcdsSideNav item
        destination_routes:
          - /roles
        return_path: breadcrumb or side-navigation link to /administration
    shared_menu:
      provided: true
      component: GcdsNavLink within GcdsTopNav
      home_link: /
      new_page_or_parent_task_link: /administration
      exclusion_reason: child modules are intentionally nested under the Administration parent in global navigation
    breadcrumbs:
      hub: Home then Administration
      children: Home then Administration then localized child label
      component: GcdsBreadcrumbs and GcdsBreadcrumbsItem
    language_toggle:
      provided_by_header: true
      equivalent_language_route: preserve the current hub or child route and safe parameters
      standalone_toggle_in_body: false
    top_navigation: Administration parent only; child modules are not first-level items
    side_navigation:
      component: GcdsSideNav
      items_from: translated route metadata filtered by canonical authorization context
      persistent_on_children: true
    active_state_families:
      administration:
        - /administration
        - /users*
        - /departments*
        - /tiers*
        - /audit-logs*
        - /roles*
  forms:
    required: false
    scope: no form is present on the hub
    pattern: forms stay on focused child routes
  component_plan:
    page_shell:
      - need: administration hub shell
        gc_component: GcdsContainer, GcdsHeading, GcdsText, and shared AppShell
        custom_exception: none
    navigation:
      - need: hub task links
        gc_component: semantic H2 sections with GcdsLink and short GcdsText descriptions
        custom_exception: none
      - need: persistent child navigation and location
        gc_component: GcdsSideNav, GcdsBreadcrumbs, and GcdsBreadcrumbsItem
        custom_exception: none
    actions_and_forms: []
    status_and_content:
      - need: unavailable or empty child area feedback
        gc_component: PAT-020 content or GcdsNotice at the affected scope
        custom_exception: none
  content_boundaries:
    hub_includes:
      - task names
      - short descriptions
      - authorized destination links
    hub_excludes:
      - user or audit tables
      - search and filters
      - department or tier forms
      - assignment controls
      - policy CRUD
  evidence_required:
    desktop_screenshot: hub and one child with side navigation and breadcrumbs
    mobile_screenshot: hub links and reflowed child navigation
    accessibility_result: keyboard order, visible focus, landmarks, H1, breadcrumbs, and side-navigation review
    bilingual_result: English and French hub, child labels, breadcrumbs, and accessible names
    design_system_checklist: required
    route_reachability_tests: required for every authorized child
    capability_context_visibility_tests: required for authorized and unauthorized contexts
  exceptions:
    required: false
    approval_status: not needed
    notes: The current project SideNav example is not assumed reusable; implementation must use a real translated GcdsSideNav driven by route metadata.
