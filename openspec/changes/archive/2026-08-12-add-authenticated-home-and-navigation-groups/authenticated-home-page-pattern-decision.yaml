ui_page_pattern_decision:
  page_role: authenticated service home
  page_type: task-oriented service home
  selected_pattern:
    - "PAT-001: UI Page Patterns"
    - "PAT-004: Protected Route"
    - "PAT-009: OIDC Backend Session"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-022: Page Length and Splitting"
  patterns_not_selected:
    - pattern: "PAT-021: Dashboard Overview Page"
      reason: Home orients users and branches to task areas; it does not support operational monitoring or triage.
  source_reference:
    - "ADR-001: BFF and Server Session Authority"
    - "ADR-002: API Wire and Error Contract"
    - "ADR-003: Casbin Authorization Model"
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - "STD-017: Government of Canada Standards Review"
    - openspec/changes/add-authenticated-home-and-navigation-groups/design.md
  target_stack: Vite React with TanStack Router and GC Design System React components
  task_structure:
    multiple_user_goals: true
    entry_page: /
    destination_routes:
      - /your-applications
      - /workspaces
      - /onboarding-oversight
      - /administration
    utility_routes:
      - /support
    home_page_or_service_home: /
    single_page_rationale: null
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter with Support utility link
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: one localized H1 naming the Partner Portal
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: review or resume partner applications
        entry_route: /
        navigation_elements:
          - Home task link for Your applications
          - Partner work GcdsNavGroup child
        destination_routes:
          - /your-applications
          - /your-applications/$rpApplicationUuid
        return_path: Home link or Partner work parent context
      - task: enter workspace work
        entry_route: /
        navigation_elements:
          - Home task link for Workspaces
          - Partner work GcdsNavGroup child
        destination_routes:
          - /workspaces
          - /workspaces/$workspaceUuid
        return_path: Home link or Workspaces parent route
      - task: monitor onboarding across workspaces
        entry_route: /
        navigation_elements:
          - authorized Home task link for Onboarding oversight
          - authorized direct top-navigation parent link
        destination_routes:
          - /onboarding-oversight
          - /onboarding-oversight/queue
          - /onboarding-oversight/reports
        return_path: Onboarding oversight parent route or Home
      - task: perform platform administration
        entry_route: /
        navigation_elements:
          - authorized Home task link for Administration
          - authorized direct top-navigation parent link
        destination_routes:
          - /administration
        return_path: Administration parent route or Home
      - task: get help
        entry_route: any user-facing route
        navigation_elements:
          - footer or utility Support link
        destination_routes:
          - /support
        return_path: Home link
    shared_menu:
      provided: true
      component:
        - GcdsTopNav
        - GcdsNavLink
        - GcdsNavGroup
      hierarchy:
        - Home
        - Partner work
        - Onboarding oversight when authorized
        - Administration when authorized
      partner_work_children:
        - Your applications when authorized
        - Workspaces when authorized
      empty_group_behavior: omit a group after capability filtering leaves no child
      account_behavior: current user, safe active context, and sign out remain in the separate user group
      home_link: /
      new_page_or_parent_task_link: /
      exclusion_reason: null
    breadcrumbs: none on Home; nested areas use their own recorded page decisions
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route and safe parameters with equivalent localized content
      standalone_toggle_in_body: false
      source_of_truth: shared application preference and i18n abstraction
    top_navigation: exact hierarchy above; Support is not a primary task item
    side_navigation: none on Home
    active_state_families:
      partner_work:
        - /your-applications*
        - /workspaces*
      onboarding_oversight:
        - /onboarding-oversight*
      administration:
        - /administration
        - /users*
        - /departments*
        - /tiers*
        - /audit-logs*
        - /roles*
    route_metadata:
      single_source: true
      generated_route_tree_edited_manually: false
      parent_source_routes_render_outlet: true
      owns:
        - route ID and localized label key
        - parent task area
        - capability-based discoverability
        - menu, Home, side-navigation, and breadcrumb visibility
        - active-path family
        - return route and hidden-route reason
  session_and_authorization:
    protected_route_revalidates_bff_session: true
    stale_browser_projection_authoritative: false
    route_visibility_is_authorization: false
    backend_authorization_per_request: true
    oidc_tokens_in_browser_storage: false
    intended_destination: allowlisted relative in-app route with no client-authored authority or copied sensitive token
  forms:
    required: false
    pattern: null
  component_plan:
    page_shell:
      - need: shared page chrome and constrained content
        gc_component: GcdsHeader, GcdsContainer, GcdsHeading, and GcdsFooter through AppShell
        custom_exception: none
    navigation:
      - need: primary task grouping
        gc_component: GcdsTopNav, GcdsNavGroup, and GcdsNavLink
        custom_exception: none
      - need: task links and short descriptions
        gc_component: semantic H2 sections with GcdsLink and GcdsText; GcdsGrid only for responsive layout
        custom_exception: none
    actions_and_forms: []
    status_and_content:
      - need: prerequisite, no-access, or temporary recovery context
        gc_component: GcdsNotice only when prominence is required by PAT-020
        custom_exception: none
  accessibility_behavior:
    keyboard: groups, links, account controls, and language control work without pointer or hover
    focus: visible focus and predictable document order from skip link to main content
    active_state: not communicated by colour alone
    responsive: no clipped controls or horizontal task-navigation scrolling at narrow widths or 200 percent zoom
  evidence_required:
    desktop_screenshot: authenticated Home and expanded Partner work group
    mobile_screenshot: collapsed or reflowed navigation and first useful Home action
    accessibility_result: keyboard, visible-focus, screen-reader landmark, H1, active-state, and zoom review
    bilingual_result: equivalent English and French routes, labels, accessible names, and descriptions
    design_system_checklist: required
    route_reachability_tests: required for every visible parent area
    capability_context_visibility_tests: required for representative authorization contexts
  exceptions:
    required: false
    approval_status: not needed
    notes: No custom mega-menu, dropdown, page shell, or body language toggle is planned.
