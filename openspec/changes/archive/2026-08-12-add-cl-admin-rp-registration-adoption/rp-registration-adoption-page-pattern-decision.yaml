ui_page_pattern_decision:
  page_role: CL Admin adoption of unassigned MVP1 RP registrations
  page_type: focused operational list followed by one-record administration form
  selected_pattern:
    - "PAT-001: UI Page Patterns"
    - "PAT-002: API Query and Mutation"
    - "PAT-003: Form Page"
    - "PAT-004: Protected Route"
    - "PAT-005: Router, Service, Schema"
    - "PAT-008: Audit Log"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-014: Bilingual Route and I18n"
    - "PAT-015: Storybook UI Review Fixture"
    - "PAT-017: Itemized Data Display"
    - "PAT-020: Status and Feedback"
    - "PAT-023: Frontend Data Table"
    - "PAT-024: Full-Stack Feature Slice"
    - "PAT-025: Dependency Substitution"
    - "PAT-026: Outbound Service Adapter"
  source_reference:
    - "ADR-001: BFF and Server Session Authority"
    - "ADR-002: API Wire and Error Contract"
    - "ADR-003: Casbin Authorization Model"
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - "STD-008: Backend FastAPI"
    - "STD-009: REST API"
    - "STD-010: API Response and Error Models"
    - "STD-013: Security and Privacy Basics"
    - "STD-020: Database Persistence"
    - openspec/changes/add-cl-admin-rp-registration-adoption/design.md
  dependency_status: backend slice follows the archived four-role contract; frontend routes rebase against the Home/navigation and workspace task-hub packages
  target_stack: Vite React with TanStack Router and GC Design System React components
  task_structure:
    multiple_user_goals: true
    entry_page: /workspaces/rp-registration-adoption
    parent_route: /workspaces
    destination_routes:
      - /workspaces/rp-registration-adoption
      - /workspaces/rp-registration-adoption/$rpApplicationUuid
    home_page_or_service_home: /
    single_page_rationale: null
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter through AppShell
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: one localized H1 for the candidate list and one focused H1 for the selected candidate
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: review unassigned RP registrations
        entry_route: /workspaces
        navigation_elements:
          - CL Admin-only Adopt existing RP registrations task link
        destination_routes:
          - /workspaces/rp-registration-adoption
        return_path: Workspaces parent task area
      - task: adopt one RP registration
        entry_route: /workspaces/rp-registration-adoption
        navigation_elements:
          - candidate name link in the adoption table
        destination_routes:
          - /workspaces/rp-registration-adoption/$rpApplicationUuid
        return_path: candidate list with safe list state preserved
    shared_menu:
      provided: true
      component: Workspaces child inside the global Partner work navigation group
      home_link: /
      new_page_or_parent_task_link: /workspaces
      exclusion_reason: the adoption flow is a CL Admin-only nested partner-bootstrap task, not a new primary task area
    breadcrumbs:
      path: Home then Workspaces then Adopt existing RP registrations then selected RP when applicable
      component: GcdsBreadcrumbs and GcdsBreadcrumbsItem
    language_toggle:
      provided_by_header: true
      equivalent_language_route: preserve the candidate/list route and warn before losing unsaved selection when necessary
      standalone_toggle_in_body: false
    top_navigation: Workspaces or its global Partner work group remains active
    side_navigation: not required for this two-route focused task
  forms:
    required: true
    pattern: focused PAT-003 form on the selected-candidate route
    fields:
      - active workspace
      - optional application information
      - CanadaLogin environment only when unresolved
    confirmation: explain that the retained RP becomes visible to authorized users in the selected workspace before final submission
  component_plan:
    page_shell:
      - need: list and focused-form page shell
        gc_component: shared AppShell, GcdsContainer, GcdsHeading, and GcdsText
        custom_exception: none
    navigation:
      - need: parent and candidate navigation
        gc_component: GcdsBreadcrumbs, GcdsBreadcrumbsItem, and GcdsLink
        custom_exception: none
    actions_and_forms:
      - need: workspace and optional portal-field selection
        gc_component: GcdsSelect, GcdsFieldset, GcdsHint, GcdsButton, GcdsErrorSummary, and GcdsErrorMessage
        custom_exception: none
      - need: explicit consequential confirmation
        gc_component: GcdsNotice, GcdsButton, and focused confirmation content
        custom_exception: none
    status_and_content:
      - need: comparable candidate records
        gc_component: PAT-023 with GcdsTable
        custom_exception: none
      - need: one candidate's local and IBM metadata comparison
        gc_component: PAT-023 responsive GcdsTable with localized column and row labels
        custom_exception: none
      - need: loading, empty, unavailable, conflict, validation, denied, and success states
        gc_component: PAT-020 content or GcdsNotice at the affected scope
        custom_exception: none
  security_and_privacy:
    backend_authorization_authoritative: true
    cl_admin_only: true
    owner_derived_access: false
    secret_values_displayed_or_imported: false
    raw_provider_payload_returned: false
    safe_error_content: no disclosure to non-CL Admin and no upstream body passthrough
  evidence_required:
    desktop_screenshot:
      - populated candidate list
      - selected candidate comparison and form
      - success state
    mobile_screenshot:
      - responsive candidate list
      - validation or provider-unavailable form state
    accessibility_result: keyboard, focus, responsive tables, form, error-summary, confirmation, and notice review
    bilingual_result: English and French labels, metadata states, warnings, errors, and confirmation
    design_system_checklist: required
    state_tests: loading, populated, empty, provider unavailable, malformed provider data, conflict, validation, unauthorized, and success
    authorization_tests: CL Admin allowed and every partner/no-access branch denied before provider calls
  exceptions:
    required: false
    approval_status: not needed
    notes: no custom shell, navigation, table grid, raw form control, or provider-facing browser call is planned
