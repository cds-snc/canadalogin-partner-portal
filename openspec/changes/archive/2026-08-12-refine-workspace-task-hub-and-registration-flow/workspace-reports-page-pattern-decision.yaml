ui_page_pattern_decision:
  page_role: selected workspace aggregate reporting
  page_type: focused report page with filters, exact results, and export
  selected_pattern:
    - "PAT-001: UI Page Patterns"
    - "PAT-002: API Query and Mutation"
    - "PAT-004: Protected Route"
    - "PAT-005: Router, Service, Schema"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-020: Status and Feedback"
    - "PAT-023: Frontend Data Table"
  patterns_not_selected:
    - pattern: "PAT-021: Dashboard Overview Page"
      reason: The route owns one selected-workspace reporting task with filters, results, and export; it is not an overview of several operational work areas.
  source_reference:
    - "ADR-001: BFF and Server Session Authority"
    - "ADR-002: API Wire and Error Contract"
    - "ADR-003: Casbin Authorization Model"
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - "STD-008: Backend FastAPI"
    - "STD-009: REST API"
    - "STD-010: API Response and Error Models"
    - openspec/changes/refine-workspace-task-hub-and-registration-flow/design.md
    - openspec/changes/define-four-role-authorization-model/specs/partner-portal-onboarding-oversight-and-reporting/spec.md
  dependency_status: rebase after define-four-role-authorization-model is archived before implementation
  target_stack: Vite React with TanStack Router and GC Design System React components
  task_structure:
    multiple_user_goals: false
    goal: filter, review, and export aggregate reporting for one selected authorized workspace
    entry_page: /workspaces/$workspaceUuid/reports
    parent_route: /workspaces/$workspaceUuid
    internal_comparison_route: /onboarding-oversight/reports
    home_page_or_service_home: /
    single_page_rationale: filters, exact aggregate results, and export support one coherent selected-workspace reporting task
  report_contract:
    source: aggregate report contract owned by partner-portal-onboarding-oversight-and-reporting after the four-role archive
    scope: selected workspace from the route plus current canonical authorization
    report_families: unchanged from the reporting capability
    filters: unchanged from the reporting capability and limited to values valid in selected workspace scope
    export: aggregate-only result for the selected workspace and current valid filters
    charts: none by default; a future chart requires a decision, interpretation, and equivalent exact data
    freshness: show the current successful load/filter context and any freshness cue supplied by the contract
    bff_read_endpoint: GET /api/v1/workspaces/{workspace_uuid}/reports
    bff_export_endpoint: GET /api/v1/workspaces/{workspace_uuid}/reports/export
    service_reuse: both workspace endpoints reuse the existing aggregate-report service and response/export models
    workspace_scope_source: authorized path resource only; no second workspace selector is accepted
    internal_route_use_by_browser: false
    client_side_cross_workspace_filtering: false
    api_compatibility: preserve the existing report filter naming and serialized response contract unless backend, OpenAPI, frontend, and tests migrate together
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter through AppShell
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: localized Reports H1 with selected workspace name in nearby context
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: open selected-workspace reports
        entry_route: /workspaces/$workspaceUuid
        navigation_elements:
          - authorized Reports hub link
          - authorized workspace GcdsSideNav item
        destination_routes:
          - /workspaces/$workspaceUuid/reports
        return_path: workspace side navigation or breadcrumb to the workspace hub
      - task: export current aggregate result
        entry_route: /workspaces/$workspaceUuid/reports
        navigation_elements:
          - Export current results action after a valid result loads
        destination_routes:
          - current selected-workspace report export behavior
        return_path: same report and filter context
    shared_menu:
      provided: true
      component: Workspaces child inside the global Partner work GcdsNavGroup
      home_link: /
      new_page_or_parent_task_link: /workspaces
      exclusion_reason: Reports is nested under the selected workspace and appears only when authorized
    breadcrumbs:
      path: Home then Workspaces then workspace name then Reports
      component: GcdsBreadcrumbs and GcdsBreadcrumbsItem
    language_toggle:
      provided_by_header: true
      equivalent_language_route: preserve selected workspace and safe valid filter state
      standalone_toggle_in_body: false
    top_navigation: Partner work remains active
    side_navigation:
      component: GcdsSideNav
      active_item: Reports
      items_from: translated workspace route metadata filtered by canonical authorization
  forms:
    required: true
    scope: report filters
    pattern: focused filter form with explicit Apply and Reset actions; route state stores only safe non-sensitive filter values
    validation: invalid or out-of-scope filters show clear errors and preserve the last valid report result
  component_plan:
    page_shell:
      - need: focused report shell and selected workspace context
        gc_component: shared AppShell, GcdsContainer, GcdsHeading, and GcdsText
        custom_exception: none
    navigation:
      - need: workspace location and return path
        gc_component: GcdsSideNav, GcdsBreadcrumbs, GcdsBreadcrumbsItem, and GcdsLink
        custom_exception: none
    actions_and_forms:
      - need: date, metric, grouping, Apply, Reset, and Export controls when supplied by the report contract
        gc_component: GcdsDateInput, GcdsSelect, GcdsFieldset, GcdsHint, GcdsButton, GcdsErrorSummary, and GcdsErrorMessage as applicable
        custom_exception: none
    status_and_content:
      - need: exact aggregate results
        gc_component: PAT-023 with GcdsTable or a recorded semantic-table implementation
        custom_exception: none
      - need: loading, empty, partial, stale, invalid-filter, error, and unauthorized states
        gc_component: PAT-020 content or GcdsNotice at the affected scope
        custom_exception: none
  scope_and_privacy:
    backend_authorization_authoritative: true
    selected_workspace_scope_required: true
    internal_workspace_selector: false
    cross_workspace_rows_or_export: false
    record_level_data: false unless separately authorized and specified outside this aggregate report
    secret_material: false
    last_valid_view_preserved_on_invalid_filter: true
  evidence_required:
    desktop_screenshot: populated report with filters and one empty/partial/error state
    mobile_screenshot: reflowed filters, exact results, and Export action without clipped content
    accessibility_result: keyboard, focus, filter labels, validation, table, status, export, and side-navigation review
    bilingual_result: English and French filters, headings, table labels, statuses, errors, export labels, and accessible names
    design_system_checklist: required
    state_tests: loading, populated, empty, partial, invalid filter, error, unauthorized, reset, and export
    scope_tests: selected-workspace success plus route, filter, request, and export cross-scope failures
  exceptions:
    required: false
    timing: before implementation
    approval_status: not needed
    notes: Exact report families and filters come from the archived reporting contract; this decision owns the focused page pattern and evidence, not new metrics.
