ui_page_pattern_decision:
  page_role: authenticated workspace management
  page_type: service home with supporting task and form pages
  selected_pattern:
    - PAT-001: UI Page Patterns
    - PAT-017: Detail Summary Pattern
    - PAT-023: Admin Data Table Pattern
  source_reference:
    - STD-005: Frontend GC Design System
    - STD-006: GC UI Page Layout Rules
    - openspec/changes/restore-workspace-and-application-info-management/design.md
  target_stack: Vite React with TanStack Router and GC Design System wrappers
  task_structure:
    multiple_user_goals: true
    entry_page: /workspaces
    destination_routes:
      - /workspaces/new
      - /workspaces/$workspaceUuid
      - /workspaces/$workspaceUuid/settings
      - /workspaces/$workspaceUuid/members
      - /workspaces/$workspaceUuid/application-information
      - /workspaces/$workspaceUuid/application-information/new
      - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid
      - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid/edit
    home_page_or_service_home: /workspaces
    single_page_rationale: null
  required_shell:
    header: existing shared app header
    footer: existing shared app footer
    main_content: existing AppShell main region
    skip_link: existing header skip link to main content
    h1: required on each route page
    date_modified: provided by AppShell
  navigation:
    primary_task_paths:
      - task: review accessible workspaces
        entry_route: /
        navigation_elements:
          - shared top navigation Workspaces item
        destination_routes:
          - /workspaces
        return_path: shared top navigation Home item or header back link
      - task: create a workspace
        entry_route: /workspaces
        navigation_elements:
          - primary create action on the workspaces list page
        destination_routes:
          - /workspaces/new
        return_path: header back link to /workspaces
      - task: review or edit workspace details
        entry_route: /workspaces
        navigation_elements:
          - workspace table action
          - detail page settings link
        destination_routes:
          - /workspaces/$workspaceUuid
          - /workspaces/$workspaceUuid/settings
        return_path: header back link to /workspaces or detail page link back from settings
      - task: manage workspace members
        entry_route: /workspaces/$workspaceUuid
        navigation_elements:
          - detail page manage members link
          - workspace members search and action controls
        destination_routes:
          - /workspaces/$workspaceUuid/members
        return_path: header back link to the workspace detail page
      - task: manage application information
        entry_route: /workspaces/$workspaceUuid
        navigation_elements:
          - detail page manage application information link
          - application-information list route create action
          - application-information detail route edit and contact actions
        destination_routes:
          - /workspaces/$workspaceUuid/application-information
          - /workspaces/$workspaceUuid/application-information/new
          - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid
          - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid/edit
        return_path: header back link to the workspace detail page or application-information list route
    shared_menu:
      provided: true

      component: shared header top navigation
      home_link: /
      new_page_or_parent_task_link: /workspaces
      exclusion_reason: null
    breadcrumbs: header back link context only
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route with translated content
      standalone_toggle_in_body: false
    search: none
    theme_topic_menu: none
    top_navigation: shared authenticated top navigation
    side_navigation: none for this slice
  forms:
    required: true
    pattern: single-page create and edit forms with inline notices and primary submit actions
  component_plan:
    page_shell:
      - need: page heading, summary, notices, and container
        gc_component: existing AppShell with Heading, Text, and Notice wrappers
        custom_exception: none
    navigation:
      - need: shared discovery and detail/settings actions
        gc_component: header top navigation plus GCDS link wrappers in page content
        custom_exception: none
    actions_and_forms:
      - need: create and settings forms
        gc_component: Button, Input, Select, Textarea, Link
        custom_exception: none
      - need: application-information create and edit forms plus nested contact management forms
        gc_component: Button, Input, Textarea, Link
        custom_exception: none
      - need: workspace member search, add, role change, and remove actions
        gc_component: Button, Input, Select, Link
        custom_exception: none
    status_and_content:
      - need: workspace list and detail summaries
        gc_component: DataTable and Notice, with PAT-017 style summary cards or sections
        custom_exception: none
      - need: application-information list, detail summaries, and contact tables
        gc_component: DataTable and Notice, with PAT-017 style summary sections
        custom_exception: none
      - need: current members table and search results
        gc_component: DataTable and Notice
        custom_exception: none
  evidence_required:
    desktop_screenshot: pending after implementation
    mobile_screenshot: pending after implementation
    accessibility_result: pending after implementation
    design_system_checklist: pending after implementation
  exceptions:
    required: false
    approval_status: not needed for this slice
    notes: Use existing wrapper components; no raw HTML control exception planned.
