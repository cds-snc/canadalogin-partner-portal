ui_page_pattern_decision:
  page_role: CL Admin cross-workspace user onboarding and access administration
  page_type: directory with focused invite and user-access task pages
  selected_pattern:
    - "PAT-001: UI Page Patterns"
    - "PAT-002: API Query and Mutation"
    - "PAT-003: Form Page"
    - "PAT-004: Protected Route"
    - "PAT-010: RBAC Policy Check"
    - "PAT-013: GC Design System React App Shell"
    - "PAT-014: Bilingual Route and I18n"
    - "PAT-017: Itemized Data Display"
    - "PAT-020: Status and Feedback"
    - "PAT-022: Page Length and Splitting"
    - "PAT-023: Frontend Data Table"
  patterns_not_selected:
    - pattern: "PAT-019: Multi-Step Task Flow"
      reason: Inviting a user is one short related form with confirmation, not a long conditional transaction.
    - pattern: "PAT-021: Dashboard Overview Page"
      reason: Users and access supports search and focused administration tasks, not operational monitoring or triage.
  source_reference:
    - "STD-004: Frontend React and TypeScript"
    - "STD-005: Frontend GC Design System"
    - "STD-006: GC UI Page Layout Rules"
    - "STD-007: UI Accessibility Basics"
    - "STD-013: Security and Privacy Basics"
    - "STD-017: Government of Canada Standards Review"
    - "STD-018: Frontend CSS and Design-System Boundary"
    - "BAS-001: Government of Canada Web Application Baseline"
    - openspec/changes/refine-cl-admin-users-and-access-onboarding/design.md
    - openspec/specs/partner-portal-role-management/spec.md
  target_stack: Vite React with TanStack Router and GC Design System React components
  task_structure:
    multiple_user_goals: true
    entry_page: /users
    destination_routes:
      - /users/invite
      - /users/$userUuid
      - /workspaces/$workspaceUuid/access
    home_page_or_service_home: /
    parent_task_area: /administration
    single_page_rationale: null
  required_shell:
    header: shared GcdsHeader through AppShell
    footer: shared GcdsFooter through AppShell
    main_content: stable AppShell main landmark and skip target
    skip_link: existing header skip link targeting main content
    h1: one localized H1 per route
    date_modified: provided by AppShell when required
  navigation:
    primary_task_paths:
      - task: find and manage an existing user's access
        entry_route: /administration
        navigation_elements:
          - Users and access task link
          - Administration side-navigation item
        destination_routes:
          - /users
          - /users/$userUuid
        return_path: Users and access directory, Administration side navigation, or breadcrumb
      - task: invite a new user into a workspace role
        entry_route: /users
        navigation_elements:
          - Invite user primary action
        destination_routes:
          - /users/invite
        return_path: Users and access directory or Administration breadcrumb
      - task: manage access inside one workspace
        entry_route: /workspaces/$workspaceUuid
        navigation_elements:
          - Access workspace task link
          - workspace side-navigation item
        destination_routes:
          - /workspaces/$workspaceUuid/access
        return_path: selected workspace hub or side navigation
    shared_menu:
      provided: true
      component: Administration child through the existing GcdsTopNav and Administration task hub
      home_link: /
      new_page_or_parent_task_link: /administration
      exclusion_reason: Invite and individual-user routes are focused Administration children and are not top-level menu items.
    breadcrumbs:
      directory: Home then Administration then Users and access
      invite: Home then Administration then Users and access then Invite user
      detail: Home then Administration then Users and access then user-safe label
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route and safe public identifiers; warn before losing unsaved invitation input
      standalone_toggle_in_body: false
    top_navigation: Administration remains active for all Users and access routes
    side_navigation: existing Administration navigation remains available
  forms:
    required: true
    pattern: PAT-003 focused form with GcdsErrorSummary and field-level errors
    invite_fields:
      - invited email
      - workspace
      - canonical partner role
      - invitation expiry
    confirmation: explain whether a new invitation will be created or an existing identity must be managed; require explicit confirmation for access changes
  component_plan:
    page_shell:
      - need: shared page chrome and constrained content
        gc_component: AppShell, GcdsContainer, GcdsHeading, and GcdsText
        custom_exception: none
    navigation:
      - need: parent and return paths
        gc_component: GcdsBreadcrumbs, GcdsBreadcrumbsItem, GcdsLink, and existing Administration navigation
        custom_exception: none
    actions_and_forms:
      - need: invite and assignment input
        gc_component: GcdsInput, GcdsSelect or GcdsRadios, GcdsDateInput, GcdsHint, GcdsButton, GcdsErrorSummary, and GcdsErrorMessage
        custom_exception: none
      - need: consequential assignment, replacement, and revocation confirmation
        gc_component: existing vetted confirmation wrapper with GcdsButton and GcdsNotice semantics
        custom_exception: record before implementation if the wrapper cannot preserve focus, dismissal, and accessible naming
    status_and_content:
      - need: user directory and workspace assignments
        gc_component: PAT-023 DataTable/GcdsTable path with concise actions and unique accessible names
        custom_exception: existing semantic table wrapper remains acceptable only with its recorded GCDS alignment and responsive tests
      - need: one-user identity and access facts
        gc_component: PAT-017 itemized description list with Gcds headings, text, and links
        custom_exception: none
      - need: loading, empty, error, conflict, unauthorized, and success feedback
        gc_component: PAT-020 normal content or GcdsNotice at the affected scope
        custom_exception: none
  identity_and_access:
    backend_authorization_authoritative: true
    canonical_role_service_reused: true
    provider_provenance_in_primary_table: false
    raw_claims_or_policy_details_exposed: false
    route_visibility_is_authorization: false
  accessibility_behavior:
    row_actions: short visible verb plus record-specific visually hidden context
    keyboard: directory, filters, actions, form, errors, confirmation, and return links work without pointer input
    focus: visible and moved to error summary or confirmation heading when state changes
    status: text is used and colour is never the only signal
    responsive: no clipped actions or required horizontal page scrolling at narrow widths or 200 percent zoom
  evidence_required:
    desktop_screenshot: directory, invite form, and user access detail
    mobile_screenshot: directory responsive state and invite form
    accessibility_result: keyboard, focus, table semantics, accessible actions, form errors, notices, confirmation, and zoom review
    bilingual_result: English and French route labels, headings, roles, hints, errors, statuses, actions, and accessible names
    design_system_checklist: required
    state_tests: loading, populated, empty, existing-identity, error, conflict, unauthorized, and success
    authorization_tests: CL Admin allowed; RP Admin and lower roles denied from centralized routes; workspace Access remains scoped
  exceptions:
    required: false
    approval_status: not needed
    notes: No custom page shell, navigation, control, or second authorization model is planned.

