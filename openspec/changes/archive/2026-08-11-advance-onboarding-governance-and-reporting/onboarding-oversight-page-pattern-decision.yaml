ui_page_pattern_decision:
  page_role: authenticated platform-admin operational oversight area
  page_type: operational dashboard entry with linked queue and report task pages
  selected_pattern:
    - PAT-001: UI Page Patterns
    - PAT-021: Dashboard Overview Page
    - PAT-017: Itemized Data Display
    - PAT-023: Frontend Data Table
    - PAT-020: Status and Feedback
  source_reference:
    - STD-005: Frontend GC Design System
    - STD-006: GC UI Page Layout Rules
    - STD-017: Government of Canada Standards Review
    - openspec/changes/advance-onboarding-governance-and-reporting/design.md
  target_stack: Vite React with TanStack Router and GC Design System wrappers
  task_structure:
    multiple_user_goals: true
    entry_page: /onboarding-oversight
    destination_routes:
      - /onboarding-oversight/queue
      - /onboarding-oversight/reports
      - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid
      - /workspaces/$workspaceUuid/applications/$rpApplicationUuid
    home_page_or_service_home: /onboarding-oversight
    single_page_rationale: The overview is only the operational entry point; queue triage, reporting, and record detail stay on separate routes.
  required_shell:
    header: existing shared app header
    footer: existing shared app footer
    main_content: existing AppShell main region
    skip_link: existing header skip link to main content
    h1: required on overview, queue, and reports routes
    date_modified: provided by AppShell
  navigation:
    primary_task_paths:
      - task: review cross-workspace onboarding status
        entry_route: /onboarding-oversight
        navigation_elements:
          - overview section links
          - shared top navigation Onboarding oversight item
        destination_routes:
          - /onboarding-oversight
        return_path: shared top navigation Onboarding oversight item
      - task: triage the onboarding review backlog
        entry_route: /onboarding-oversight
        navigation_elements:
          - queue summary link
          - shared top navigation Onboarding oversight item
        destination_routes:
          - /onboarding-oversight/queue
          - /workspaces/$workspaceUuid/application-information/$applicationInformationUuid
          - /workspaces/$workspaceUuid/applications/$rpApplicationUuid
        return_path: breadcrumb or page link back to /onboarding-oversight and /onboarding-oversight/queue
      - task: inspect aggregate onboarding reporting
        entry_route: /onboarding-oversight
        navigation_elements:
          - reports summary link
          - shared top navigation Onboarding oversight item
        destination_routes:
          - /onboarding-oversight/reports
        return_path: breadcrumb or page link back to /onboarding-oversight
    shared_menu:
      provided: true
      component: shared header top navigation
      home_link: /
      new_page_or_parent_task_link: /onboarding-oversight
      exclusion_reason: null
    breadcrumbs: required on queue, reports, and linked record-detail pages; optional on the overview route
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route with translated content
      standalone_toggle_in_body: false
    search: none in the first slice
    theme_topic_menu: none
    top_navigation: shared authenticated top navigation
    side_navigation: none in the first slice
  forms:
    required: false on the overview route; yes on focused review or filter interactions in child routes
    pattern: use the shared app shell with separate queue and report pages instead of embedding multiple forms in the overview
  component_plan:
    page_shell:
      - need: overview heading, context text, and route-level notices
        gc_component: existing AppShell with Heading, Text, and Notice wrappers
        custom_exception: none
    navigation:
      - need: shared entry from authenticated navigation
        gc_component: existing top navigation and breadcrumb wrappers
        custom_exception: none
    status_and_content:
      - need: overview status summaries and resume-work sections
        gc_component: PAT-017 summary structures with existing text, link, and notice wrappers
        custom_exception: none
      - need: review backlog and reporting tables on child routes
        gc_component: GCDS-compatible table implementation following PAT-023
        custom_exception: none
  evidence_required:
    desktop_screenshot: pending after implementation
    mobile_screenshot: pending after implementation
    accessibility_result: pending after implementation
    design_system_checklist: pending after implementation
  exceptions:
    required: false
    approval_status: not needed for this slice
    notes: The overview stays limited to operational triage and navigation. Full review forms, large queues, and reporting filters remain on dedicated child routes.
