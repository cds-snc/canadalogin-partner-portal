ui_page_pattern_decision:
  page_role: authenticated service home
  page_type: service home with grouped task navigation
  selected_pattern:
    - PAT-001: UI Page Patterns
    - PAT-013: GC Design System React App Shell
  source_reference:
    - STD-005: Frontend GC Design System
    - STD-006: GC UI Page Layout Rules
    - STD-017: Government of Canada Standards Review
    - openspec/changes/add-authenticated-home-and-navigation-groups/design.md
  target_stack: Vite React with TanStack Router and GC Design System wrappers
  task_structure:
    multiple_user_goals: true
    entry_page: /
    destination_routes:
      - /your-applications
      - /workspaces
      - /onboarding-oversight
      - /users
      - /departments
      - /roles
      - /tiers
      - /policies
      - /audit-logs
      - /support
    home_page_or_service_home: /
    single_page_rationale: null
  required_shell:
    header: existing shared app header
    footer: existing shared app footer
    main_content: existing AppShell main region
    skip_link: existing header skip link to main content
    h1: required on the authenticated Home route
    date_modified: provided by AppShell
  navigation:
    primary_task_paths:
      - task: review partner-facing application access
        entry_route: /
        navigation_elements:
          - Home task link for Your applications
          - shared navigation partner tasks group
        destination_routes:
          - /your-applications
          - /your-applications/$rpApplicationUuid
        return_path: shared navigation Home link
      - task: review partner workspace resources
        entry_route: /
        navigation_elements:
          - Home task link for Workspaces
          - shared navigation partner tasks group
        destination_routes:
          - /workspaces
          - /workspaces/$workspaceUuid
        return_path: shared navigation Home link or parent task-area link
      - task: open onboarding oversight
        entry_route: /
        navigation_elements:
          - Home task link for Onboarding oversight when authorized
          - shared navigation oversight group when authorized
        destination_routes:
          - /onboarding-oversight
        return_path: shared navigation Home link
      - task: open platform administration modules
        entry_route: /
        navigation_elements:
          - Home task link for platform administration when authorized
          - shared navigation platform administration group when authorized
        destination_routes:
          - /users
          - /departments
          - /roles
          - /tiers
          - /policies
          - /audit-logs
        return_path: shared navigation Home link or parent task-area link
      - task: open support resources
        entry_route: /
        navigation_elements:
          - Home task link for Support
          - shared navigation Support link
        destination_routes:
          - /support
        return_path: shared navigation Home link
    shared_menu:
      provided: true
      component: shared header top navigation with grouped task areas
      home_link: /
      new_page_or_parent_task_link: /
      exclusion_reason: null
    breadcrumbs: header back link context only
    language_toggle:
      provided_by_header: true
      equivalent_language_route: same route with translated content
      standalone_toggle_in_body: false
    top_navigation: shared authenticated grouped navigation
    side_navigation: none by default
  component_plan:
    page_shell:
      - need: page heading, summary text, and task links
        gc_component: existing AppShell with Heading, Text, Card, Link, and Notice wrappers
        custom_exception: none
    grouped_navigation:
      - need: primary task-area grouping in the shared header
        gc_component: existing header navigation updated with GCDS-compatible grouped links or nav groups
        custom_exception: none
  evidence_required:
    desktop_screenshot: pending after implementation
    mobile_screenshot: pending after implementation
    accessibility_result: pending after implementation
    design_system_checklist: pending after implementation
  exceptions:
    required: false
    approval_status: not needed for this slice
    notes: The change allows implementation flexibility for the exact grouping control as long as grouped task-area discoverability and GC Design System expectations are preserved.
