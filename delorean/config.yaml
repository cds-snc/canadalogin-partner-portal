version: 1

adoptionLevel: 2
adoptionProfile: agent-assisted-development

principles:
  skillsAreLevelAgnostic: true
  agentsApplyAdoptionLevel: true
  localDefaultWhenEnvironmentMissing: true

activeFeatures:
  architectureDocs: required
  standardsAndPatterns: required
  openspec: lightweight
  localVerification: required
  developerReadiness: lightweight
  subagentOrchestration: optional
  changeState: optional
  gates: advisory
  evidenceBundles: optional
  approvalsAndWaivers: manual
  releaseReadiness: lightweight

adoptionLevels:
  "2":
    profile: agent-assisted-development
    purpose: >
      Agent-assisted development with OpenSpec, standards and patterns,
      planning, local checks, review, archive-readiness, and testing for
      developers learning to use Delorean agents without full gate, evidence,
      approval, or release automation.
    activeAgents:
      primary:
        - builder-general
        - qa-support
      optional:
        - coordinator
        - spec-author
        - release-readiness
    expectations:
      architectureDocs: required
      standardsAndPatterns: required
      openspec: lightweight
      localVerification: required
      developerReadiness: lightweight
      subagentOrchestration: optional
      changeState: optional
      gates: advisory
      evidenceBundles: optional
      approvalsAndWaivers: manual
      releaseReadiness: lightweight

  "3":
    profile: lightweight-delorean
    purpose: >
      Lightweight Delorean delivery with phase routing, OpenSpec, change-state,
      gates, guided handoffs, and lightweight evidence summaries while keeping
      formal release evidence and release automation conservative.
    activeAgents:
      primary:
        - coordinator
        - spec-author
        - delivery-planner
        - builder-general
        - qa-support
      optional:
        - release-readiness
    expectations:
      architectureDocs: required
      standardsAndPatterns: required
      openspec: required
      localVerification: required
      developerReadiness: required
      subagentOrchestration: enabled
      changeState: required_for_meaningful_changes
      gates: required
      evidenceBundles: lightweight_for_meaningful_changes
      approvalsAndWaivers: required_when_applicable
      releaseReadiness: optional

  "4":
    profile: full-delorean
    purpose: >
      Full Delorean local workflow with phase routing, change-state, gates,
      evidence bundles, approval and waiver records, and
      release-readiness preparation.
    activeAgents:
      primary:
        - coordinator
        - spec-author
        - delivery-planner
        - builder-general
        - qa-support
        - release-readiness
    expectations:
      architectureDocs: required
      standardsAndPatterns: required
      openspec: required
      localVerification: required
      developerReadiness: required
      subagentOrchestration: enabled
      changeState: required_for_meaningful_changes
      gates: required
      evidenceBundles: required_for_meaningful_changes
      approvalsAndWaivers: required_when_applicable
      releaseReadiness: enabled
