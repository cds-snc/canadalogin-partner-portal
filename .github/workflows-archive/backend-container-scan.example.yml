# Example only. Archived workflows do not run from .github/workflows-archive/.
# Move into .github/workflows/ only after the solution repo chooses this pattern.
# Review action version policy before enabling: use pinned SHAs or approved major tags, but do not mix policies silently.
# Replace the scanner placeholder with the solution repo's approved scanner before activation.

name: Backend container scan example

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: delorean-backend:${{ github.sha }}

jobs:
  scan-backend-container:
    name: Scan backend container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -f backend/Dockerfile -t "${IMAGE_NAME}" backend

      - name: Run approved image scanner
        run: |
          echo "Choose an approved scanner before activating this workflow."
          echo "Examples: trivy image, grype, docker scout, or an organization-approved scanner."
          echo "Do not require a paid scanner unless the solution repo has adopted it."
          exit 1
