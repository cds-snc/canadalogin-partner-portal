# Move into .github/workflows/ only after the solution repo chooses this pattern.
# Review action version policy before enabling: use pinned SHAs or approved major tags, but do not mix policies silently.
# WARNING: Align this with organization cloud security and deployment standards before activation.
# Do not add real AWS account IDs, role ARNs, registry names, or secrets to this template.

name: AWS ECR publish example

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: "<aws-region>"
  AWS_ACCOUNT_ID: "<aws-account-id>"
  AWS_ROLE_TO_ASSUME: "<arn:aws:iam::<aws-account-id>:role/<github-oidc-role>>"
  ECR_REPOSITORY: "<ecr-repository-name>"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  publish-backend-image:
    name: Publish backend image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stop if placeholders were not replaced
        run: |
          case "${AWS_REGION} ${AWS_ACCOUNT_ID} ${AWS_ROLE_TO_ASSUME} ${ECR_REPOSITORY}" in
            *"<"*)
              echo "Replace AWS placeholders before activating this workflow."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -f backend/Dockerfile -t "${IMAGE_URI}" backend
          docker push "${IMAGE_URI}"

      # Add ECS or other deployment steps only after the solution repo has
      # approved deployment standards, environments, IAM roles, and evidence needs.
