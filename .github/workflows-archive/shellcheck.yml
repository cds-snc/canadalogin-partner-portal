name: Shellcheck
on:
  push:
    paths:
      - "**/*.sh"
      - ".github/hooks/**"
      - "scripts/delorean/**"
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/hooks/**"
      - "scripts/delorean/**"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shellcheck
        run: |
          scripts/delorean/run-shellcheck.sh
