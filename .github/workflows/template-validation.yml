name: Template validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-template:
    name: Validate template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: npm ci --ignore-scripts --prefix frontend

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/requirements-dev.txt') != '' }}
        run: make install-dev-python

      - name: Run local verification
        run: scripts/delorean/run-local-verification.sh

      - name: Run OpenAPI checks
        run: scripts/delorean/run-openapi-checks.sh
